<title>Pilotage Budgétaire 2026</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget 2026">
<meta name="theme-color" content="#0f1117">
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;Budget 2026&quot;,&quot;short_name&quot;:&quot;Budget&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#0f1117&quot;,&quot;theme_color&quot;:&quot;#1B3A5C&quot;}">
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f1117; --surface:#181c27; --surface2:#1e2333; --surface3:#242840;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.13);
  --text:#e8eaf0; --muted:#7c8299; --dim:#4a5068;
  --postale:#4f8ef7; --postale-bg:rgba(79,142,247,0.12);
  --bourso:#34d399;  --bourso-bg:rgba(52,211,153,0.12);
  --revolut:#a78bfa; --revolut-bg:rgba(167,139,250,0.12);
  --amex:#fbbf24;    --amex-bg:rgba(251,191,36,0.12);
  --pos:#34d399; --neg:#f87171; --warn:#fbbf24;
  --r:14px; --rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.mono{font-family:'DM Mono',monospace}

/* HEADER */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header-left{display:flex;align-items:center;gap:14px}
.logo{width:30px;height:30px;background:linear-gradient(135deg,#4f8ef7,#a78bfa);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff}
.header h1{font-size:15px;font-weight:500;letter-spacing:-.01em}
.header h1 span{color:var(--muted);font-weight:400}
.month-nav{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.month-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:5px 11px;border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap}
.month-btn:hover{border-color:var(--border2);color:var(--text)}
.month-btn.active{background:var(--postale);border-color:var(--postale);color:#fff;font-weight:500}
.nav-sep{display:flex;align-items:center;gap:4px}
.annual-btn{background:transparent;border:1px solid rgba(167,139,250,0.4);color:var(--revolut);padding:5px 13px;border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:all .15s}
.annual-btn:hover,.annual-btn.active{background:var(--revolut);border-color:var(--revolut);color:#fff}

/* MAIN */
.main{padding:24px 28px;max-width:1440px;margin:0 auto}
.page{display:none}.page.active{display:block}

/* SECTION LABEL */
.sec-label{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* SOLDES GRID */
.soldes-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.solde-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;position:relative;overflow:hidden;transition:border-color .2s}
.solde-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.sc-postale::before{background:var(--postale)}
.sc-bourso::before{background:var(--bourso)}
.sc-revolut::before{background:var(--revolut)}
.sc-amex::before{background:var(--amex)}
.sc-bank{font-size:11px;color:var(--muted);margin-bottom:3px}
.sc-name{font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.sc-dot{width:7px;height:7px;border-radius:50%}
.sc-postale .sc-dot{background:var(--postale)}
.sc-bourso  .sc-dot{background:var(--bourso)}
.sc-revolut .sc-dot{background:var(--revolut)}
.sc-amex    .sc-dot{background:var(--amex)}
.sc-rows{display:flex;flex-direction:column;gap:5px}
.sc-row{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.sc-row .lbl{color:var(--muted)}
.sc-div{height:1px;background:var(--border);margin:8px 0}
.sc-big{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.sc-big .lbl{font-size:12px;color:var(--muted)}
.sc-big .val{font-size:19px;font-weight:600;font-family:'DM Mono',monospace}
.val-pos{color:var(--pos)}
.val-neg{color:var(--neg)}
.val-warn{color:var(--warn)}
.val-muted{color:var(--muted)}
.val-mono{font-family:'DM Mono',monospace;font-size:12px}
.amex-pill{display:inline-flex;align-items:center;gap:5px;background:var(--amex-bg);color:var(--warn);border:1px solid rgba(251,191,36,0.2);border-radius:6px;padding:4px 9px;font-size:11px;font-weight:500;margin-top:10px}

/* KPI BAR */
.kpi-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:14px}
.kpi-item{padding:16px 20px;border-right:1px solid var(--border)}
.kpi-item:last-child{border-right:none}
.kpi-lbl{font-size:11px;color:var(--muted);margin-bottom:6px}
.kpi-val{font-family:'DM Mono',monospace;font-size:22px;font-weight:500;letter-spacing:-.02em}
.kpi-sub{font-size:11px;color:var(--dim);margin-top:3px}

/* AMEX NOTE */
.amex-note{background:rgba(251,191,36,0.07);border:1px solid rgba(251,191,36,0.18);border-radius:var(--rs);padding:10px 16px;font-size:12px;color:var(--warn);margin-bottom:20px;display:flex;align-items:center;gap:8px}

/* TABLE CARD */
.tcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.tcard-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.tcard-title{font-size:13px;font-weight:500}
.tcard-count{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:2px 10px;font-size:11px;color:var(--muted);font-family:'DM Mono',monospace}
table{width:100%;border-collapse:collapse}
thead th{padding:9px 14px;font-size:10px;font-weight:500;color:var(--dim);text-align:left;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--border);background:var(--surface2)}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,0.02)}
tbody td{padding:10px 14px;font-size:13px;vertical-align:middle}
.td-date{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted)}
.td-label{font-weight:400}
.td-num{font-family:'DM Mono',monospace;font-size:12px;text-align:right}
.td-ecart-pos{color:var(--pos);font-family:'DM Mono',monospace;font-size:12px;text-align:right}
.td-ecart-neg{color:var(--neg);font-family:'DM Mono',monospace;font-size:12px;text-align:right}
.td-ecart-zero{color:var(--dim);font-family:'DM Mono',monospace;font-size:12px;text-align:right}
.total-row td{background:var(--surface2);font-weight:600;font-size:13px;border-top:1px solid var(--border2)!important}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:500;white-space:nowrap}
.b-postale{background:var(--postale-bg);color:var(--postale)}
.b-bourso{background:var(--bourso-bg);color:var(--bourso)}
.b-revolut{background:var(--revolut-bg);color:var(--revolut)}
.b-amex{background:var(--amex-bg);color:var(--warn)}
.b-logement{background:rgba(79,142,247,0.12);color:#4f8ef7}
.b-transport{background:rgba(167,139,250,0.12);color:#a78bfa}
.b-alim{background:rgba(251,191,36,0.12);color:#fbbf24}
.b-famille{background:rgba(251,113,133,0.12);color:#fb7185}
.b-sante{background:rgba(52,211,153,0.12);color:#34d399}
.b-epargne{background:rgba(52,211,153,0.15);color:#34d399}
.b-finances{background:rgba(245,158,11,0.12);color:#f59e0b}
.b-animaux{background:rgba(134,239,172,0.12);color:#86efac}
.b-bien{background:rgba(192,132,252,0.12);color:#c084fc}
.b-pro{background:rgba(20,184,166,0.12);color:#14b8a6}
.b-autres{background:rgba(148,163,184,0.12);color:#94a3b8}
.b-depenses{background:rgba(132,204,22,0.12);color:#84cc16}

/* ADD ROW FORM */
.add-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:20px}
.add-title{font-size:12px;color:var(--muted);margin-bottom:12px;font-weight:500}
.add-form{display:grid;grid-template-columns:140px 1fr 130px 130px 160px 100px 100px auto;gap:8px;align-items:end}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:10px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
input,select{background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:7px 10px;border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:12px;outline:none;width:100%;transition:border-color .15s}
input[type="date"]{cursor:pointer;color-scheme:dark}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(0.7);cursor:pointer;margin-right:-2px}

input:focus,select:focus{border-color:var(--postale)}
select option{background:var(--surface2)}
.btn-add{background:var(--postale);border:none;color:#fff;padding:8px 16px;border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:opacity .15s;white-space:nowrap}
.btn-add:hover{opacity:.85}
.btn-del{background:transparent;border:1px solid rgba(248,113,113,0.3);color:var(--neg);padding:4px 8px;border-radius:6px;font-size:11px;cursor:pointer;transition:all .15s}
.btn-del:hover{background:rgba(248,113,113,0.1)}
.row-editing{background:rgba(79,142,247,0.08)!important;outline:1px solid rgba(79,142,247,0.3)}

/* SYNTHESE GROUPES */
.synth-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.prog-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.prog-row{padding:9px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.prog-row:last-child{border-bottom:none}
.prog-label{min-width:150px}
.prog-bar-bg{flex:1;height:4px;background:var(--surface3);border-radius:2px;overflow:hidden}
.prog-bar{height:100%;border-radius:2px;transition:width .6s ease}
.prog-vals{display:flex;gap:10px;min-width:120px;justify-content:flex-end;font-family:'DM Mono',monospace;font-size:11px}
.prog-prev{color:var(--dim)}
.prog-real{font-weight:500}

/* ANNUAL DASHBOARD */
.annual-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.month-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:border-color .2s;cursor:pointer}
.month-card:hover{border-color:var(--border2)}
.mc-header{padding:10px 14px;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.mc-body{padding:10px 14px;display:flex;flex-direction:column;gap:5px}
.mc-row{display:flex;justify-content:space-between;font-size:12px}
.mc-lbl{color:var(--muted)}
.mc-val{font-family:'DM Mono',monospace;font-size:12px;font-weight:500}

/* ANNUAL TABLE */
.annual-table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:24px}

/* EDITABLE */
.editable{cursor:text;border-bottom:1px dashed rgba(79,142,247,0.5);transition:border-color .15s;padding-bottom:1px}
.editable:hover{border-bottom-color:var(--postale)}
.editable-input{background:transparent;border:none;border-bottom:1px solid var(--postale);color:inherit;font:inherit;outline:none;padding:0;margin:0;min-width:60px}
.edit-mode-btn{position:fixed;bottom:20px;background:var(--surface2);border:1px solid var(--border2);color:var(--muted);padding:8px 14px;border-radius:20px;font-family:"DM Sans",sans-serif;font-size:12px;cursor:pointer;z-index:200;transition:all .2s}
.edit-mode-btn:hover{border-color:var(--postale);color:var(--postale)}
.edit-mode-btn.on{background:rgba(79,142,247,0.12);border-color:var(--postale);color:var(--postale)}
#editModeBtn{right:20px}
.edit-hint{position:fixed;bottom:58px;right:20px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:8px 14px;font-size:11px;color:var(--muted);z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.edit-hint.show{opacity:1}

/* SYNC STATUS */
.sync-bar{position:fixed;top:60px;right:0;left:0;height:2px;z-index:99;pointer-events:none}
.sync-bar.syncing{background:linear-gradient(90deg,transparent,var(--postale),transparent);background-size:200% 100%;animation:syncAnim 1.2s ease infinite}
.sync-bar.ok{background:var(--pos);opacity:0;transition:opacity 1s}
.sync-bar.err{background:var(--neg)}
@keyframes syncAnim{0%{background-position:100% 0}100%{background-position:-100% 0}}
.sync-dot{position:fixed;bottom:68px;right:20px;width:8px;height:8px;border-radius:50%;background:var(--dim);z-index:200;transition:background .3s}
.sync-dot.ok{background:var(--pos)}
.sync-dot.syncing{background:var(--warn);animation:pulse .8s ease infinite}
.sync-dot.err{background:var(--neg)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* CHARTS */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 20px}
.chart-title{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:14px;text-transform:uppercase;letter-spacing:.05em}
.chart-wrap{position:relative;width:100%}
.chart-wrap-pie{position:relative;width:100%;max-width:280px;margin:0 auto}
.chart-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chart-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.chart-legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ── FORM GRID ── */
.form-grid { display:grid; gap:10px; align-items:end; }

/* ── MOBILE ── */
@media screen and (max-width:768px) {
  .header { position:static!important; height:auto!important; padding:10px 12px 8px!important; flex-direction:column!important; align-items:stretch!important; gap:7px!important; }
  .header h1 { font-size:13px; }
  .logo { width:24px; height:24px; font-size:10px; }
  .month-nav { display:grid!important; grid-template-columns:repeat(4,1fr)!important; gap:4px!important; width:100%!important; }
  .month-btn { padding:6px 2px!important; font-size:11px!important; }
  .nav-sep { display:grid!important; grid-template-columns:1fr 1fr!important; gap:4px!important; grid-column:1/-1!important; }
  .annual-btn { font-size:11px!important; padding:6px!important; }
  .main { padding:10px!important; }
  .sec-label { font-size:10px!important; }
  .soldes-grid { grid-template-columns:1fr!important; }
  .kpi-bar { grid-template-columns:1fr 1fr!important; }
  .kpi-item { padding:11px 13px!important; border-right:none!important; border-bottom:1px solid var(--border)!important; }
  .kpi-item:nth-child(3),.kpi-item:nth-child(4) { border-bottom:none!important; }
  .kpi-val { font-size:16px!important; }
  .charts-grid { grid-template-columns:1fr!important; }
  .tcard { overflow-x:auto!important; -webkit-overflow-scrolling:touch!important; }
  table { min-width:480px!important; }
  thead th { font-size:9px!important; padding:5px 7px!important; }
  tbody td { font-size:11px!important; padding:8px 7px!important; }
  .form-grid { grid-template-columns:1fr!important; gap:8px!important; }
  .add-form { flex-direction:column!important; gap:8px!important; }
  .form-group { width:100%!important; }
  .form-label { font-size:10px!important; display:block!important; margin-bottom:3px!important; }
  input,select { width:100%!important; font-size:16px!important; padding:10px 12px!important; border-radius:10px!important; box-sizing:border-box!important; }
  .btn-add { width:100%!important; padding:12px!important; font-size:14px!important; border-radius:10px!important; }
  .add-section { padding:14px!important; }
  .annual-grid { grid-template-columns:1fr 1fr!important; }
  .synth-grid { grid-template-columns:1fr!important; }
  .edit-mode-btn { bottom:12px!important; right:12px!important; font-size:11px!important; }
  #editModeBtn { right:12px!important; }
  .sync-dot { bottom:52px!important; right:14px!important; }
  .tcard-header { flex-wrap:wrap!important; }
  .amex-note { font-size:11px!important; }
}
@media screen and (max-width:400px) {
  .annual-grid { grid-template-columns:1fr!important; }
  .kpi-bar { grid-template-columns:1fr!important; }
  .kpi-item { border-bottom:1px solid var(--border)!important; }
  .kpi-item:last-child { border-bottom:none!important; }
}

/* FADE IN */
.fade{opacity:0;transform:translateY(6px);animation:fu .35s ease forwards}
@keyframes fu{to{opacity:1;transform:translateY(0)}}
.fade:nth-child(1){animation-delay:.04s}.fade:nth-child(2){animation-delay:.08s}
.fade:nth-child(3){animation-delay:.12s}.fade:nth-child(4){animation-delay:.16s}
</style>
</head>

  const main = document.getElementById('mainContent');
  if (main) main.innerHTML = '<div style="padding:40px;color:#f87171;font-family:monospace"><h2>Erreur JavaScript</h2><p>' + msg + '</p><p>Ligne ' + line + '</p><pre>' + (err&&err.stack?err.stack:'') + '</pre></div>';
  return false;
};
</script>

    <div class="logo">P</div>

</header>

<script>

const CATEGORIES = {

  Transport:['Carburant','Voiture / Scooter','Parking'],
  Alimentation:['Courses courantes','Courses exceptionnelles','Épicerie / Boulangerie','Restaurants'],
  Famille_et_Enfants:['Jimmy','Léon','Nounou','École / Cantine'],
  Animaux:['Chats'],
  Sante:['Médecin / Pharmacie','Mutuelles'],
  Bien_etre_Perso:['Coiffeur','Vêtements','Loisirs','Livres'],
  Epargne:['LDDS Yann','LDDS Noëmie','PEA Yann','PEA Noëmie','Assurance vie Yann','Assurance vie Noëmie','Assurance vie Jimmy','Assurance vie Léon','Livret A Jimmy','Livret A Léon','CTO','Épargne Espèces'],

let syncDot, saveTimeout;

function setSyncStatus(status) {
  if (!syncDot) syncDot = document.getElementById('syncDot');
  const bar = document.getElementById('syncBar');
  if (syncDot) syncDot.className = 'sync-dot ' + status;
  if (bar) bar.className = 'sync-bar ' + status;
  if (status === 'ok') {
    setTimeout(() => { if(bar) bar.className='sync-bar'; }, 2000);
  }
}

function save() {
  // Keep localStorage as offline cache
  localStorage.setItem('budget2026', JSON.stringify(data));
  // Debounce Firebase writes
  clearTimeout(saveTimeout);
  setSyncStatus('syncing');
  saveTimeout = setTimeout(() => {
    REF.set(data)
      .then(() => setSyncStatus('ok'))
      .catch(e => { console.error(e); setSyncStatus('err'); });
  }, 800);
}

function sanitizeData(d) {
  if (!d) d = {};
  if (!d.revenus) d.revenus = { salaire_yann:0, salaire_noemie:0, caf:0, cmg:0, autres:0 };
  if (!d.soldes_debut) d.soldes_debut = { jan: {postale:0,bourso:0,revolut:0} };
  if (!d.soldes_debut.jan) d.soldes_debut.jan = {postale:0,bourso:0,revolut:0};
  if (!d.transactions) d.transactions = {};
  if (!d.revenus_tx) d.revenus_tx = {};
  MOIS.forEach(m => {
    if (!d.transactions[m]) d.transactions[m] = [];
    if (!d.revenus_tx[m]) d.revenus_tx[m] = [];
  });
  if (!d.config) d.config = {};
  if (!d.config.activeMonths) d.config.activeMonths = {
    'Janvier':false,'Février':false,'Mars':false,'Avril':false,
    'Mai':true,'Juin':true,'Juillet':true,'Août':true,
    'Septembre':true,'Octobre':true,'Novembre':true,'Décembre':true
  };
  if (!d.recurrents) d.recurrents = { revenus: [], depenses: [] };
  if (!d.virements) d.virements = {};
  MOIS.forEach(m => { if (!d.virements[m]) d.virements[m] = []; });
  if (!d.epargne) d.epargne = { comptes: [], soldes: {} };
  if (!d.epargne.comptes) d.epargne.comptes = [];
  if (!d.epargne.soldes) d.epargne.soldes = {};
  if (!d.credits) d.credits = [];
  if (!d.petite_monnaie) d.petite_monnaie = {};
  if (!d.soldes_mois) d.soldes_mois = {};
  MOIS.forEach(m => {
    if (!d.soldes_mois[m]) d.soldes_mois[m] = {postale:null, bourso:null, revolut:null};
  });
  if (!d.recurrents.revenus)  d.recurrents.revenus  = [];
  if (!d.recurrents.depenses) d.recurrents.depenses = [];
  return d;
}

// Load from Firebase on start, fall back to localStorage
function loadData(callback) {
  setSyncStatus('syncing');
  // Always render immediately with local/default data first
  const local = localStorage.getItem('budget2026');
  if (local) { try { data = sanitizeData(JSON.parse(local)); } catch(e) {} }
  else { data = sanitizeData({}); }
  callback(); // Render immediately

  // Then try Firebase
  REF.once('value')
    .then(snap => {
      const val = snap.val();
      if (val) {
        data = sanitizeData(val);
        localStorage.setItem('budget2026', JSON.stringify(data));
        setSyncStatus('ok');
        renderMain();
        // Re-init dropdowns after Firebase data loaded
        setTimeout(() => { updateCats(); updateRevCats(); }, 100);
      } else {
        // First time on Firebase: push local data up
        REF.set(data).catch(()=>{});
        setSyncStatus('ok');
      }
    })
    .catch(e => {
      console.warn('Firebase offline, using local data');
      setSyncStatus('err');
    });
}

// Real-time listener for changes from other devices
REF.on('value', snap => {
  const val = snap.val();
  if (!val) return;
  const newData = JSON.stringify(val);
  const curData = JSON.stringify(data);
  if (newData !== curData) {
    data = sanitizeData(val);
    localStorage.setItem('budget2026', JSON.stringify(data));
    renderMain();
    setTimeout(() => { updateCats(); updateRevCats(); }, 100);
    setSyncStatus('ok');
  }
});

function isMonthActive(m) {

function parseAmount(val) {
  if (!val && val !== 0) return 0;
  // Accept both comma and dot as decimal separator
  return parseFloat(String(val).replace(',', '.')) || 0;
}

function fmt(n) {
  if (n === null || n === undefined || n === '') return '—';
  const abs = Math.abs(n);
  const s = abs.toLocaleString('fr-FR', {minimumFractionDigits:0, maximumFractionDigits:2});
  return (n < 0 ? '−' : '') + s + ' €';
}
function getProjectionFinMois(moisIdx) {
  const mois = MOIS[moisIdx];
  const txs = data.transactions[mois] || [];
  const revTxs = data.revenus_tx[mois] || [];
  const recDeps = data.recurrents?.depenses || [];
  const recRevs = data.recurrents?.revenus || [];

  // Soldes de début
  const soldeDebut = ['La Banque Postale','BoursoBank','Revolut']
    .reduce((a,c) => a + getSoldeDebut(moisIdx, c), 0);

  // Revenus déjà encaissés (réel)
  const revEncaisses = getRevTotal(moisIdx);

  // Revenus fixes restants non encore saisis (prévu mais pas encore réel)
  const revFixesTotal = recRevs.reduce((a,r) => a + (+r.montant||0), 0);
  const revFixesSaisis = revTxs.filter(t=>t._isRecurrent)
    .reduce((a,t) => a + (+t.montant||0), 0);
  const revRestants = Math.max(0, revFixesTotal - revFixesSaisis);

  // Dépenses réelles déjà saisies
  const depReelles = txs.reduce((a,t) => a + (+t.reel||0), 0)
    + (data.transactions[mois]||[]).filter(t=>t._isRecurrent)
      .reduce((a,t) => a + (+t.reel||0), 0);

  // Dépenses fixes restantes non encore saisies (prévu mais pas réel)
  const depFixesRestantes = recDeps.reduce((r2,r) => {
    const override = txs.find(t=>t._isRecurrent && data.recurrents.depenses.indexOf(r)===data.recurrents.depenses.indexOf(r));
    return r2 + (override ? 0 : (+r.montant||0));
  }, 0);
  // Simpler: total dépenses fixes prévues - déjà saisies
  const depFixesTotal = recDeps.reduce((a,r) => {
      const freq = r.frequence || 'mensuelle';
      let applies = true;
      let mult = 1;
      if (freq==='hebdomadaire') mult = 4;
      else if (freq==='bimensuelle') mult = 2;
      else if (freq==='trimestrielle') { applies = ((moisIdx+1)-(r._startMois||1))%3===0; }
      else if (freq==='annuelle') { applies = (moisIdx+1)===(r._startMois||1); }
      return applies ? a+(+r.montant||0)*mult : a;
    }, 0);
  const depFixesSaisies = txs.filter(t=>t._isRecurrent).reduce((a,t) => a + (+t.reel||0), 0);
  const depFixesRest = Math.max(0, depFixesTotal - depFixesSaisies);

  // Dépenses variables prévues non encore réalisées
  const depVarPrevues = txs.filter(t=>!t._isRecurrent && t.prevu && !t.reel)
    .reduce((a,t) => a + (+t.prevu||0), 0);

  const projectionBasse = soldeDebut + revEncaisses - depReelles - depFixesRest;
  const projectionHaute = soldeDebut + revEncaisses + revRestants - depReelles - depFixesRest - depVarPrevues;

  return {
    soldeDebut,
    revEncaisses,
    revRestants,
    depReelles,
    depFixesRest,
    depVarPrevues,
    projectionBasse,
    projectionHaute,
    resteAVivre: projectionHaute,
  };
}

function fmtSign(n) {
  if (!n && n !== 0) return '—';
  const s = Math.abs(n).toLocaleString('fr-FR', {minimumFractionDigits:0, maximumFractionDigits:0});
  return (n > 0 ? '+' : n < 0 ? '−' : '') + s + ' €';
}
function ecartClass(n) {
  if (!n && n !== 0) return 'td-ecart-zero';
  return n > 0 ? 'td-ecart-pos' : n < 0 ? 'td-ecart-neg' : 'td-ecart-zero';
}

// ── CALCULS ───────────────────────────────────────────────────────────────────
// Get recurring items merged into a month (prévu from template, réel = 0 until filled)
function getRecurrantsForMonth(moisName, type) {
  const items = (data.recurrents && data.recurrents[type]) || [];
  return items.map((r,i) => ({
    ...r,
    _recId: i,
    _isRecurrent: true,
  }));
}

function getRevTotal(moisIdx) {
  if (moisIdx !== undefined) {
    const mois = MOIS[moisIdx];
    const txRev = (data.revenus_tx && data.revenus_tx[mois]) || [];
    // Recurring revenues: use réel if filled, else prévu
    const recRev = getRecurrantsForMonth(mois,'revenus');
    const fromRec = recRev.reduce((a,r) => {
      const override = txRev.find(t => t._recId === r._recId);
      return a + (override ? (+override.montant||0) : (+r.montant||0));
    }, 0);
    // Manual (non-recurring) revenues
    const manual = txRev.filter(t => !t._isRecurrent).reduce((a,t)=>a+(+t.montant||0),0);
    return fromRec + manual;
  }
  return Object.values(data.revenus).reduce((a,b)=>a+(+b||0),0);
}
function getSoldeDebut(moisIdx, compte) {
  if (compte === 'Amex (différé)') return 0;
  const key = ['postale','bourso','revolut'][['La Banque Postale','BoursoBank','Revolut'].indexOf(compte)];
  const mois = MOIS[moisIdx];
  // Check if a manual override exists for this month
  if (data.soldes_mois && data.soldes_mois[mois] && data.soldes_mois[mois][key] !== null && data.soldes_mois[mois][key] !== undefined) {
    return data.soldes_mois[mois][key];
  }
  // Otherwise: Jan uses Paramètres, others carry over from previous month
  if (moisIdx === 0) return data.soldes_debut.jan[key] || 0;
  return getSoldeReel(moisIdx - 1, compte);
}

function setSoldeDebutAmex(moisName, val) {
  data.soldes_mois = data.soldes_mois || {};
  data.soldes_mois[moisName] = data.soldes_mois[moisName] || {};
  data.soldes_mois[moisName].amex = parseAmount(val);
  save(); renderMain();
}

function setSoldeDebut(moisName, key, val) {
  data.soldes_mois = data.soldes_mois || {};
  data.soldes_mois[moisName] = data.soldes_mois[moisName] || {postale:null, bourso:null, revolut:null};
  data.soldes_mois[moisName][key] = parseAmount(val);
  save();
  renderMain();
}
function getDepenses(moisIdx, compte) {
  return (data.transactions[MOIS[moisIdx]] || [])
    .filter(t => t.compte === compte)
    .reduce((a,t)=>a+(+t.reel||0),0);
}
function getDepensesPrev(moisIdx, compte) {
  return (data.transactions[MOIS[moisIdx]] || [])
    .filter(t => t.compte === compte)
    .reduce((a,t)=>a+(+t.prevu||0),0);
}
function getVirementsBalance(moisIdx, compte) {
  const mois = MOIS[moisIdx];
  const virs = data.virements?.[mois] || [];
  let balance = 0;
  virs.forEach(v => {
    if (v.vers === compte) balance += (+v.montant || 0);
    if (v.de   === compte) balance -= (+v.montant || 0);
  });
  return balance;
}

function getSoldeReel(moisIdx, compte) {
  if (compte === 'Amex (différé)') return 0;
  const rev = compte === 'La Banque Postale' ? getRevTotal(moisIdx) : 0;
  return getSoldeDebut(moisIdx, compte) + rev - getDepenses(moisIdx, compte) + getVirementsBalance(moisIdx, compte);
}
function getSoldePrev(moisIdx, compte) {
  if (compte === 'Amex (différé)') return 0;
  const rev = compte === 'La Banque Postale' ? getRevTotal(moisIdx) : 0;
  return getSoldeDebut(moisIdx, compte) + rev - getDepensesPrev(moisIdx, compte) + getVirementsBalance(moisIdx, compte);
}
function getAmex(moisIdx) {
  return (data.transactions[MOIS[moisIdx]] || [])
    .filter(t => t.compte === 'Amex (différé)')
    .reduce((a,t)=>a+(+t.reel||0),0);
}
function getEpargne(moisIdx) {
  return (data.transactions[MOIS[moisIdx]] || [])
    .filter(t => t.groupe === 'Epargne')
    .reduce((a,t)=>a+(+t.reel||0),0);
}
function getTotalDep(moisIdx) {
  return COMPTES.filter(c=>c!=='Amex (différé)').reduce((a,c)=>a+getDepenses(moisIdx,c),0)
    + getAmex(moisIdx);
}

                style="width:110px;background:transparent;border:none;border-bottom:1px dashed rgba(251,191,36,0.4);color:var(--warn);font-family:'DM Mono',monospace;font-size:12px;text-align:right;padding:2px 4px;outline:none"
                onfocus="this.style.borderColor='var(--amex)'"
                onblur="setSoldeDebutAmex('${moisName}',this.value)"
                onkeydown="if(event.key==='Enter')this.blur()"
                placeholder="0">
              <span style="font-size:11px;color:var(--warn)">€</span>
            </span>
          </div>
        </div>
        <div class="amex-pill">⚠ À provisionner sur La Banque Postale</div>
      </div>`;
  }).join('');

  // KPIs
  const revTotal = getRevTotal(moisIdx);
  const depTotal = getTotalDep(moisIdx);
  const soldeGlobal = ['La Banque Postale','BoursoBank','Revolut']
    .reduce((a,c)=>a+getSoldeReel(moisIdx,c),0);
  const amexTotal = getAmex(moisIdx);
  const depPrev = COMPTES.reduce((a,c)=>a+getDepensesPrev(moisIdx,c),0);

  // Transactions table
  // Recurring depenses pre-filled
  // Combine fixed + variable transactions and sort by date
  const recDeps = data.recurrents?.depenses||[];

  // Build unified sorted list
  const allDepRows = [];

  // Helper: get week dates for a month
  function getWeeklyDates(moisIdx, jourHabitual) {
    const year = 2026;
    const mois0 = moisIdx; // 0-based
    const jour = parseInt(jourHabitual) || 1;
    const dates = [];
    const daysInMonth = new Date(year, mois0+1, 0).getDate();
    // Find all occurrences of the weekday starting from the given day
    // If no specific day, generate every 7 days from day 1
    let d = jour;
    while (d <= daysInMonth) {
      const dd = String(d).padStart(2,'0');
      const mm = String(mois0+1).padStart(2,'0');
      dates.push({display: dd+'/'+mm, sort: d});
      d += 7;
    }
    return dates;
  }

  // Add fixed recurring — expand hebdomadaire into multiple rows
  recDeps.forEach((r,idx)=>{
    const freq = r.frequence || 'mensuelle';
    if (freq === 'hebdomadaire') {
      const weekDates = getWeeklyDates(moisIdx, parseInt(r.date)||1);
      weekDates.forEach((wd, wi) => {
        const overrideKey = `${idx}_${wi}`;
        const override = txs.find(t=>t._isRecurrent && t._recId===idx && t._weekIdx===wi);
        const reelVal = override ? override.reel : '';
        const grpObj = getGroupes().find(g=>g.code===r.groupe);
        allDepRows.push({dateSort:wd.sort, isRecurrent:true, r, idx, override, reelVal, grpObj,
          weekIdx: wi, weekDate: wd.display, isWeekly: true});
      });
    } else if (freq === 'trimestrielle') {
      const mN = moisIdx + 1;
      const jourRef = parseInt(r.date) || 1;
      const refMois = r._startMois || 1;
      if ((mN - refMois) % 3 === 0) {
        const dd = String(jourRef).padStart(2,'0');
        const mm = String(mN).padStart(2,'0');
        const override = txs.find(t=>t._isRecurrent && t._recId===idx);
        const reelVal = override ? override.reel : '';
        const grpObj = getGroupes().find(g=>g.code===r.groupe);
        allDepRows.push({dateSort:jourRef, isRecurrent:true, r, idx, override, reelVal, grpObj,
          weekDate: dd+'/'+mm, isWeekly:false});
      }
    } else if (freq === 'annuelle') {
      const mN2 = moisIdx + 1;
      const refMois2 = r._startMois || 1;
      if (mN2 === refMois2) {
        const jourRef = parseInt(r.date) || 1;
        const dd = String(jourRef).padStart(2,'0');
        const mm = String(mN).padStart(2,'0');
        const override = txs.find(t=>t._isRecurrent && t._recId===idx);
        const reelVal = override ? override.reel : '';
        const grpObj = getGroupes().find(g=>g.code===r.groupe);
        allDepRows.push({dateSort:jourRef, isRecurrent:true, r, idx, override, reelVal, grpObj,
          weekDate: dd+'/'+mm, isWeekly:false});
      }
    } else if (freq === 'bimensuelle') {
      // Two occurrences: day X and day X+15
      const jour = parseInt(r.date) || 1;
      const jour2 = Math.min(jour + 15, 28);
      [jour, jour2].forEach((d, wi) => {
        const dd = String(d).padStart(2,'0');
        const mm = String(moisIdx+1).padStart(2,'0');
        const override = txs.find(t=>t._isRecurrent && t._recId===idx && t._weekIdx===wi);
        const reelVal = override ? override.reel : '';
        const grpObj = getGroupes().find(g=>g.code===r.groupe);
        allDepRows.push({dateSort:d, isRecurrent:true, r, idx, override, reelVal, grpObj,
          weekIdx: wi, weekDate: dd+'/'+mm, isWeekly: true});
      });
    } else {
      const override = txs.find(t=>t._isRecurrent && t._recId===idx && !t._weekIdx);
      const reelVal = override ? override.reel : '';
      const grpObj = getGroupes().find(g=>g.code===r.groupe);
      const dateSort = r.date || '99';
      allDepRows.push({dateSort, isRecurrent:true, r, idx, override, reelVal, grpObj});
    }
  });

  // Add variable transactions
  txs.filter(t=>!t._isRecurrent).forEach((t,i)=>{
    const grpObj = getGroupes().find(g=>g.code===t.groupe);
    const ecart = (t.prevu && t.reel) ? t.prevu - t.reel : null;
    const isEditingRow = !!t._editing;
    const dateSort = t.date || '99';
    allDepRows.push({dateSort, isRecurrent:false, t, i, grpObj, ecart, isEditingRow});
  });

  // Sort by day number extracted from date (DD/MM format)
  allDepRows.sort((a,b)=>{
    const da = parseInt((a.dateSort||'').split('/')[0])||99;
    const db = parseInt((b.dateSort||'').split('/')[0])||99;
    return da - db;
  });



  const totalPrevu = txs.reduce((a,t)=>a+(+t.prevu||0),0);
  const totalReel  = txs.reduce((a,t)=>a+(+t.reel||0),0);
  const totalEcart = totalPrevu - totalReel;

  // Synthèse par groupe
  const synthRows = getGroupes().map(g => {
    const prev = txs.filter(t=>t.groupe===g.code).reduce((a,t)=>a+(+t.prevu||0),0);
    const reel = txs.filter(t=>t.groupe===g.code).reduce((a,t)=>a+(+t.reel||0),0);
    const maxVal = Math.max(prev, reel, 1);
    const pct = Math.min((reel/maxVal)*100, 100);
    const over = reel > prev && prev > 0;
    const barColor = over ? 'var(--neg)' : 'var(--postale)';
    if (!reel && !prev) return '';
    const total = txs.reduce((a,t)=>a+(+t.reel||0),0) + recDeps.reduce((a,r)=>a+(+r.montant||0),0);
    const pctOfTotal = total > 0 ? Math.round((reel/total)*100) : 0;
    return `
      <div class="prog-row" style="flex-direction:column;align-items:stretch;gap:5px;padding:10px 16px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span class="badge ${g.cls}">${g.label}</span>
          <span style="font-family:'DM Mono',monospace;font-size:12px;font-weight:500;color:var(--text)">${fmt(reel)} <span style="color:var(--dim);font-size:11px">(${pctOfTotal}%)</span></span>
        </div>
        <div style="height:8px;background:var(--surface3);border-radius:4px;overflow:hidden">
          <div style="height:100%;border-radius:4px;transition:width .5s ease;width:${pctOfTotal}%;background:${over?'var(--neg)':'var(--postale)'}"></div>
        </div>
      </div>`;
  }).join('');

  // Formulaire ajout transaction
  const grpOptions = getGroupes().map(g=>`<option value="${g.code}">${g.label}</option>`).join('');
  const compteOptions = COMPTES.map(c=>`<option value="${c}">${c}</option>`).join('');

  return `
    <div class="sec-label">Soldes par compte</div>
    <div class="soldes-grid">${soldesHTML}</div>

    <div class="kpi-bar fade">
      <div class="kpi-item">
        <div class="kpi-lbl">${editable(getConf("kpi_rev","Revenus du mois"),"kpi_rev")}</div>
        <div class="kpi-val val-pos">${fmt(revTotal)}</div>
        <div class="kpi-sub">Prévu : ${fmt(revTotal)}</div>
      </div>
      <div class="kpi-item">
        <div class="kpi-lbl">${editable(getConf("kpi_dep","Dépenses totales"),"kpi_dep")}</div>
        <div class="kpi-val val-neg">${fmt(depTotal)}</div>
        <div class="kpi-sub">Prévu : ${fmt(depPrev)}</div>
      </div>
      <div class="kpi-item">
        <div class="kpi-lbl">Solde actuel (tous comptes)</div>
        <div class="kpi-val" style="color:${soldeGlobal<0?'var(--neg)':soldeGlobal===0?'var(--muted)':'var(--pos)'}">${fmt(soldeGlobal)}</div>
        <div style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:10px;color:var(--muted)">Fin de mois estimé</span>
          <span style="font-family:'DM Mono',monospace;font-size:13px;font-weight:600;color:${(()=>{const p=getProjectionFinMois(moisIdx);return p.resteAVivre<0?'var(--neg)':p.resteAVivre>0?'var(--pos)':'var(--muted)';})()} ">${(()=>{const p=getProjectionFinMois(moisIdx);return fmt(p.resteAVivre);})()}</span>
        </div>
      </div>
      <div class="kpi-item" style="background:var(--amex-bg)">
        <div class="kpi-lbl" style="color:var(--warn)">Amex à provisionner</div>
        <div class="kpi-val val-warn">${fmt(amexTotal)}</div>
        <div class="kpi-sub" style="color:rgba(251,191,36,0.5)">Prélèvement mois suivant</div>
      </div>
    </div>

    ${amexTotal > 0 ? `<div class="amex-note">⚠ Les ${fmt(amexTotal)} Amex seront prélevés sur La Banque Postale le mois suivant — le solde réel affiché ne les inclut pas encore.</div>` : ''}

    <div class="sec-label">Revenus du mois</div>
    <div class="tcard" style="margin-bottom:20px">
      <div class="tcard-header">
        <span class="tcard-title">Entrées — ${moisName} 2026</span>
        <span class="tcard-count">${(data.revenus_tx[moisName]||[]).length} entrée${(data.revenus_tx[moisName]||[]).length!==1?'s':''}</span>
      </div>
      <table>
        <thead><tr>
          <th>Date</th><th>Libellé</th><th>Compte</th><th>Groupe</th><th>Catégorie</th><th style="text-align:right">Prévu</th><th style="text-align:right">Réel</th><th style="text-align:right">Écart</th><th></th>
        </tr></thead>
        <tbody>
          ${(()=>{
            const recs = data.recurrents?.revenus||[];
            const manuals = (data.revenus_tx[moisName]||[]).filter(t=>!t._isRecurrent);
            const recRows = recs.map((r,i)=>{
              const override = (data.revenus_tx[moisName]||[]).find(t=>t._recId===i&&t._isRecurrent);
              const realVal = override ? override.montant : '';
              const ecart = realVal ? realVal - r.montant : null;
              const grpObj = getGroupes().find(g=>g.code===r.groupe);
              return `<tr style="background:rgba(52,211,153,0.04)">
                <td class="td-date">${r.date||''}<span style="font-size:9px;margin-left:4px;color:var(--pos);opacity:.7">↺</span></td>
                <td>${r.libelle}</td>
                <td><span class="badge ${COMPTE_CLS[r.compte]||''}">${r.compte||''}</span></td>
                <td>${grpObj?`<span class="badge ${grpObj.cls}">${grpObj.label}</span>`:''}</td>
                <td style="color:var(--muted);font-size:12px">${r.categorie||''}</td>
                <td class="td-num val-muted">${fmt(r.montant)}</td>
                <td style="padding:4px 8px"><input type="number" placeholder="Réel" value="${realVal}"
                  style="width:90px;background:var(--surface2);border:1px solid var(--border2);color:var(--pos);padding:4px 8px;border-radius:6px;font-size:12px;text-align:right"
                  onchange="updateRecurrentReal('${moisName}','revenus',${i},this.value)"></td>
                <td class="${ecartClass(ecart)}">${ecart!==null?fmtSign(ecart):'—'}</td>
                <td></td>
              </tr>`;
            }).join('');
            const manualRows = manuals.map((t,i)=>{
              const grpObj = getGroupes().find(g=>g.code===t.groupe);
              const ecart = (t.prevu && t.montant) ? t.montant - t.prevu : null;
              const isEditingRev = !!t._editing;
              return `<tr class="${isEditingRev?'row-editing':''}">
                <td class="td-date">${t.date||''}</td>
                <td>${t.libelle||''}${isEditingRev?' <span style="font-size:10px;color:var(--postale);margin-left:4px">✏️ en cours…</span>':''}</td>
                <td><span class="badge ${COMPTE_CLS[t.compte]||''}">${t.compte||''}</span></td>
                <td>${grpObj?`<span class="badge ${grpObj.cls}">${grpObj.label}</span>`:''}</td>
                <td style="color:var(--muted);font-size:12px">${t.categorie||''}</td>
                <td class="td-num val-muted">${t.prevu?fmt(t.prevu):'—'}</td>
                <td class="td-num val-pos">${fmt(t.montant)}</td>
                <td class="${ecartClass(ecart)}">${ecart!==null?fmtSign(ecart):'—'}</td>
                <td style="display:flex;gap:4px">
                  ${isEditingRev
                    ? `<button class="btn-del" style="color:var(--muted);border-color:var(--border)" onclick="cancelEdit('${moisName}','rev')">✕ Annuler</button>`
                    : `<button class="btn-del" style="color:var(--postale);border-color:rgba(79,142,247,0.3)" onclick="editRevTx('${moisName}',${i})">✏️</button>
                       <button class="btn-del" onclick="delRevTx('${moisName}',${i})">✕</button>`
                  }
                </td>
              </tr>`;}).join('');
            return recRows + manualRows || '<tr><td colspan="7" style="text-align:center;color:var(--dim);padding:16px;font-size:12px">Aucun revenu ce mois — ajoutez des revenus fixes dans Paramètres</td></tr>';
          })()}
          ${(data.revenus_tx[moisName]||[]).length ? `<tr class="total-row">
            <td colspan="5" style="text-align:right;color:var(--muted);font-size:12px">TOTAL</td>
            <td class="td-num val-muted">${fmt((data.recurrents?.revenus||[]).reduce((a,r)=>a+(+r.montant||0),0)+(data.revenus_tx[moisName]||[]).filter(t=>!t._isRecurrent).reduce((a,t)=>a+(+t.prevu||0),0))}</td>
            <td class="td-num val-pos">${fmt(getRevTotal(moisIdx))}</td>
            <td class="${ecartClass(getRevTotal(moisIdx) - (
              (data.recurrents?.revenus||[]).reduce((a,r)=>a+(+r.montant||0),0) +
              (data.revenus_tx[moisName]||[]).filter(t=>!t._isRecurrent).reduce((a,t)=>a+(+t.prevu||0),0)
            ))}">${fmtSign(getRevTotal(moisIdx) - (
              (data.recurrents?.revenus||[]).reduce((a,r)=>a+(+r.montant||0),0) +
              (data.revenus_tx[moisName]||[]).filter(t=>!t._isRecurrent).reduce((a,t)=>a+(+t.prevu||0),0)
            ))}</td>
            <td></td>
          </tr>` : ''}
        </tbody>
      </table>
      <div class="form-grid" style="grid-template-columns:1fr 1fr 120px 160px auto" style="padding:14px 18px;border-top:1px solid var(--border);grid-template-columns:140px 1fr 130px 130px 160px 100px 100px auto">
        <div class="form-group"><label class="form-label">Date</label><input type="date" id="rv-date"></div>
        <div class="form-group"><label class="form-label">Libellé</label><input type="text" id="rv-libelle" placeholder="Ex : Salaire Yann"></div>
        <div class="form-group"><label class="form-label">Compte</label><select id="rv-compte">${compteOptions}</select></div>
        <div class="form-group"><label class="form-label">Groupe</label><select id="rv-groupe" onchange="updateRevCats()">${grpOptions}</select></div>
        <div class="form-group"><label class="form-label">Catégorie</label><select id="rv-categorie"></select></div>
        <div class="form-group"><label class="form-label">Prévu (€)</label><input type="number" id="rv-prevu" placeholder="0"></div>
        <div class="form-group"><label class="form-label">Réel (€)</label><input type="number" id="rv-montant" placeholder="0"></div>
        <button class="btn-add" onclick="addRevTx('${moisName}')" style="background:var(--pos)">${editingTx&&editingTx.type==='rev'?'Modifier':'+ Ajouter'}</button>
      </div>
    </div>

    <div class="sec-label" style="display:flex;align-items:center;justify-content:space-between">
      <span style="display:flex;align-items:center;gap:8px;font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)">
        Virements inter-comptes
        <span style="font-size:9px;background:var(--surface2);padding:2px 7px;border-radius:10px;color:var(--muted);text-transform:none;letter-spacing:0">${((data.virements||{})[moisName]||[]).length} virement${((data.virements||{})[moisName]||[]).length!==1?'s':''}</span>
      </span>
      <span style="flex:1;height:1px;background:var(--border);margin:0 8px"></span>
    </div>
    <div class="tcard" style="margin-bottom:12px">
      ${((data.virements||{})[moisName]||[]).length ? `
      <table>
        <thead><tr>
          <th>Date</th><th>Libellé</th><th>Compte débiteur</th><th>Compte créditeur</th><th style="text-align:right">Montant</th><th></th>
        </tr></thead>
        <tbody>
          ${((data.virements||{})[moisName]||[]).map((v,i)=>`<tr>
            <td class="td-date">${v.date||''}</td>
            <td>${v.libelle||'Virement'}</td>
            <td><span class="badge ${COMPTE_CLS[v.de]||''}">${v.de||''}</span></td>
            <td><span class="badge ${COMPTE_CLS[v.vers]||''}">${v.vers||''}</span></td>
            <td class="td-num val-warn">${fmt(v.montant)}</td>
            <td><button class="btn-del" onclick="delVirement('${moisName}',${i})">✕</button></td>
          </tr>`).join('')}
        </tbody>
      </table>` : ''}
      <div class="form-grid" style="grid-template-columns:120px 1fr 160px 160px 120px auto;padding:12px 16px;${((data.virements||{})[moisName]||[]).length?'border-top:1px solid var(--border)':''}">
        <div class="form-group"><label class="form-label">Date</label><input type="date" id="vir-date"></div>
        <div class="form-group"><label class="form-label">Libellé</label><input type="text" id="vir-libelle" placeholder="Ex: Épargne mensuelle"></div>
        <div class="form-group"><label class="form-label">Compte débiteur</label><select id="vir-de">${compteOptions}</select></div>
        <div class="form-group"><label class="form-label">Compte créditeur</label><select id="vir-vers">${compteOptions}</select></div>
        <div class="form-group"><label class="form-label">Montant (€)</label><input type="number" id="vir-montant" placeholder="0"></div>
        <button class="btn-add" style="background:var(--revolut)" onclick="addVirement('${moisName}')">+ Ajouter</button>
      </div>
    </div>

    <div style="background:var(--surface);border:1px solid rgba(167,139,250,0.3);border-radius:var(--r);padding:14px 18px;margin-bottom:14px;display:flex;align-items:center;gap:16px">
      <div style="font-size:20px">🪙</div>
      <div style="flex:1">
        <div style="font-size:12px;font-weight:500;margin-bottom:2px">Petite monnaie Revolut</div>
        <div style="font-size:11px;color:var(--muted)">Arrondi automatique débité de Revolut</div>
      </div>
      <div style="text-align:right;margin-right:12px">
        <div style="font-size:11px;color:var(--muted);margin-bottom:2px">Total ce mois</div>
        <div style="font-family:'DM Mono',monospace;font-size:18px;font-weight:600;color:var(--revolut)">−${fmt((data.petite_monnaie||{})[moisName]||0)}</div>

      <div style="display:flex;flex-direction:column;gap:6px">

        <div style="display:flex;gap:6px;align-items:center">
          <input type="number" id="pm-add" step="0.01" placeholder="0,00"

          <button onclick="addPetiteMonnaie('${moisName}')"
            style="background:rgba(139,92,246,0.2);border:1px solid rgba(139,92,246,0.4);color:#a78bfa;padding:6px 12px;border-radius:var(--rs);font-size:12px;cursor:pointer;white-space:nowrap">+ Ajouter</button>
          ${(data.petite_monnaie||{})[moisName] ? '<button onclick="resetPetiteMonnaie(\'' + moisName + '\')" style="background:transparent;border:1px solid rgba(248,113,113,0.3);color:var(--neg);padding:6px 10px;border-radius:var(--rs);font-size:11px;cursor:pointer">Reset</button>' : ''}
        </div>

    </div>

    <div class="sec-label">Dépenses du mois</div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:8px">
      <label style="display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border2);color:var(--muted);padding:6px 14px;border-radius:var(--rs);font-size:12px;cursor:pointer;transition:all .2s" onmouseover="this.style.borderColor='var(--postale)';this.style.color='var(--postale)'" onmouseout="this.style.borderColor='var(--border2)';this.style.color='var(--muted)'">

    <div class="add-section">

        <div class="form-group"><label class="form-label">Groupe</label><select id="f-groupe" onchange="updateCats()">${grpOptions}</select></div>

function updateCategorySelect(groupeId, catSelectId) {
  const grpEl = document.getElementById(groupeId);
  const catEl = document.getElementById(catSelectId);
  if (!grpEl || !catEl) return;
  const cats = getCats()[grpEl.value] || [];
  catEl.innerHTML = cats.map(cc=>`<option value="${cc}">${cc}</option>`).join('');
}

function updateCats()    { updateCategorySelect('f-groupe',  'f-categorie'); }
function updateRevCats() { updateCategorySelect('rv-groupe', 'rv-categorie'); }
function syncRrCats()    { updateCategorySelect('rr-groupe', 'rr-categorie'); }
function syncRdCats()    { updateCategorySelect('rd-groupe', 'rd-categorie'); }


function addTx(moisName) {
  const rawDate = document.getElementById('f-date').value;
  const date = rawDate ? new Date(rawDate).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}) : '';
  const libelle = document.getElementById('f-libelle').value;
  const compte = document.getElementById('f-compte').value;
  const groupe = document.getElementById('f-groupe').value;
  const categorie = document.getElementById('f-categorie').value;
  const reel = parseAmount(document.getElementById('f-reel').value);
  const prevu = reel; // variable dépenses: prévu = réel
  if (!libelle) return;
  if (!data.transactions[moisName]) data.transactions[moisName] = [];
  if (editingTx && editingTx.moisName === moisName && editingTx.type === 'dep') {
    const realIdx = data.transactions[moisName].indexOf(editingTx.originalRow);
    if (realIdx !== -1) {
      data.transactions[moisName][realIdx] = {date,libelle,compte,groupe,categorie,prevu,reel,_rawDate:rawDate};
    } else {
      data.transactions[moisName].push({date,libelle,compte,groupe,categorie,prevu,reel,_rawDate:rawDate});
    }
    editingTx = null;
  } else {
    if (editingTx && editingTx.originalRow) { delete editingTx.originalRow._editing; editingTx = null; }
    data.transactions[moisName].push({date,libelle,compte,groupe,categorie,prevu,reel,_rawDate:rawDate});
  }
  save(); showPage(moisName);
}

function delTx(moisName, idx) {
  data.transactions[moisName].splice(idx, 1);
  save(); showPage(moisName);
}

// Track which row is being edited
let editingTx = null;   // {moisName, type:'dep'|'rev', allIdx}

function editTx(moisName, manualIdx) {
  const manuals = data.transactions[moisName].filter(x=>!x._isRecurrent);
  const t = manuals[manualIdx];
  if (!t) return;
  const allIdx = data.transactions[moisName].indexOf(t);
  editingTx = {moisName, type:'dep', allIdx, snapshot: {...t}, originalRow: data.transactions[moisName][allIdx]};
  data.transactions[moisName][allIdx]._editing = true;

  renderMain(); // re-render first

  // THEN pre-fill form after render
  setTimeout(() => {
    const snap = editingTx?.snapshot;
    if (!snap) return;
    if (document.getElementById('f-date')) document.getElementById('f-date').value = snap._rawDate || '';
    if (document.getElementById('f-libelle')) document.getElementById('f-libelle').value = snap.libelle || '';
    if (document.getElementById('f-compte')) document.getElementById('f-compte').value = snap.compte || '';
    const grpEl = document.getElementById('f-groupe');
    if (grpEl) { grpEl.value = snap.groupe || ''; updateCats(); }
    setTimeout(() => {
      if (document.getElementById('f-categorie')) document.getElementById('f-categorie').value = snap.categorie || '';
      // no f-prevu field for variable expenses
      if (document.getElementById('f-reel')) document.getElementById('f-reel').value = snap.reel || '';
    }, 60);
    document.getElementById('f-libelle')?.scrollIntoView({behavior:'smooth', block:'center'});
  }, 80);
}

function editRevTx(moisName, manualIdx) {
  const manuals = (data.revenus_tx[moisName]||[]).filter(x=>!x._isRecurrent);
  const t = manuals[manualIdx];
  if (!t) return;
  const allIdx = data.revenus_tx[moisName].indexOf(t);
  editingTx = {moisName, type:'rev', allIdx, snapshot: {...t}, originalRow: data.revenus_tx[moisName][allIdx]};
  data.revenus_tx[moisName][allIdx]._editing = true;

  renderMain(); // re-render first (clears form)

  // THEN pre-fill form after render
  setTimeout(() => {
    const snap = editingTx?.snapshot;
    if (!snap) return;
    if (document.getElementById('rv-date')) document.getElementById('rv-date').value = snap._rawDate || '';
    if (document.getElementById('rv-libelle')) document.getElementById('rv-libelle').value = snap.libelle || '';
    if (document.getElementById('rv-compte')) document.getElementById('rv-compte').value = snap.compte || '';
    const grpEl = document.getElementById('rv-groupe');
    if (grpEl) { grpEl.value = snap.groupe || ''; updateRevCats(); }
    setTimeout(() => {
      if (document.getElementById('rv-categorie')) document.getElementById('rv-categorie').value = snap.categorie || '';
      if (document.getElementById('rv-prevu')) document.getElementById('rv-prevu').value = snap.prevu || '';
      if (document.getElementById('rv-montant')) document.getElementById('rv-montant').value = snap.montant || '';
    }, 60);
    document.getElementById('rv-libelle')?.scrollIntoView({behavior:'smooth', block:'center'});
  }, 80);
}

function cancelEdit(moisName, type) {
  if (!editingTx) return;
  if (editingTx.originalRow) delete editingTx.originalRow._editing;
  editingTx = null;
  renderMain();
}

function updateRev(key, val) {
  data.revenus[key] = parseFloat(val) || 0;
  save();
}

function updateSolde(key, val) {
  data.soldes_debut.jan[key] = parseFloat(val) || 0;
  save();
}

function addRevTx(moisName) {
  const rawDate2  = document.getElementById('rv-date').value;
  const date      = rawDate2 ? new Date(rawDate2).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}) : '';
  const libelle   = document.getElementById('rv-libelle').value.trim();
  const compte    = document.getElementById('rv-compte').value;
  const groupe    = document.getElementById('rv-groupe') ? document.getElementById('rv-groupe').value : '';
  const categorie = document.getElementById('rv-categorie') ? document.getElementById('rv-categorie').value : '';
  const prevu     = parseAmount(document.getElementById('rv-prevu') ? document.getElementById('rv-prevu').value : 0);
  const montant   = parseAmount(document.getElementById('rv-montant').value);
  if (!libelle) return;
  if (!data.revenus_tx) data.revenus_tx = {};
  if (!data.revenus_tx[moisName]) data.revenus_tx[moisName] = [];
  if (editingTx && editingTx.type === 'rev' && editingTx.moisName === moisName) {
    const realIdx = data.revenus_tx[moisName].indexOf(editingTx.originalRow);
    if (realIdx !== -1) {
      data.revenus_tx[moisName][realIdx] = {date, libelle, compte, groupe, categorie, prevu, montant, _rawDate: rawDate2};
    } else {
      data.revenus_tx[moisName].push({date, libelle, compte, groupe, categorie, prevu, montant, _rawDate: rawDate2});
    }
    editingTx = null;
  } else {
    if (editingTx && editingTx.type === 'rev') {
      if (editingTx.originalRow) delete editingTx.originalRow._editing;
      editingTx = null;
    }
    data.revenus_tx[moisName].push({date, libelle, compte, groupe, categorie, prevu, montant, _rawDate: rawDate2});
  }
  save(); showPage(moisName);
}

function delRevTx(moisName, idx) {
  data.revenus_tx[moisName].splice(idx, 1);
  save(); showPage(moisName);
}

let editingRec = null;

function editRecurrent(type, idx) {
  const items = data.recurrents[type];
  const r = items[idx];
  if (!r) return;

  // Store snapshot and mark editing — no save/showPage to avoid double render
  items.forEach(x => delete x._editing);
  r._editing = true;
  editingRec = {type, idx};

  // Prefill form immediately (DOM already rendered)
  const prefix = type === 'revenus' ? 'rr' : 'rd';
  const dateEl = document.getElementById(prefix+'-date');
  const libEl  = document.getElementById(prefix+'-libelle');
  const cpEl   = document.getElementById(prefix+'-compte');
  const grpEl  = document.getElementById(prefix+'-groupe');
  const catEl  = document.getElementById(prefix+'-categorie');
  const mtEl   = document.getElementById(prefix+'-montant');

  if (dateEl) dateEl.value = r._rawDate || '';
  if (libEl)  libEl.value  = r.libelle  || '';
  if (cpEl)   cpEl.value   = r.compte   || '';
  if (grpEl)  { grpEl.value = r.groupe || ''; type==='revenus'?syncRrCats():syncRdCats(); }
  setTimeout(() => {
    if (catEl) catEl.value = r.categorie || '';
    if (mtEl)  mtEl.value  = r.montant   || 0;
    // Update button label
    const btn = document.querySelector(`[onclick="addRecurrent('${type}')"]`);
    if (btn) btn.textContent = 'Modifier';
  }, 50);

  // Highlight the row by re-rendering just the table body without full page reload
  const rows = document.querySelectorAll('tr');
  rows.forEach(row => {
    if (row.textContent.includes(r.libelle)) {
      row.style.background = 'rgba(79,142,247,0.08)';
      row.style.outline = '1px solid rgba(79,142,247,0.3)';
    }
  });

  // Scroll to form
  if (libEl) libEl.scrollIntoView({behavior:'smooth', block:'center'});
}

function addRecurrent(type) {
  const prefix = type === 'revenus' ? 'rr' : 'rd';
  const rawDate   = document.getElementById(prefix+'-date').value;
  const date      = rawDate ? new Date(rawDate).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}) : '';
  const libelle   = document.getElementById(prefix+'-libelle').value.trim();
  const compte    = document.getElementById(prefix+'-compte').value;
  const grpEl     = document.getElementById(prefix+'-groupe');
  const groupe    = grpEl ? grpEl.value : '';
  const catEl     = document.getElementById(prefix+'-categorie');
  const categorie = catEl ? catEl.value : '';
  const montant   = parseAmount(document.getElementById(prefix+'-montant').value);
  if (!libelle || !montant) { alert('Libellé et montant obligatoires'); return; }

  const freqEl = type === 'depenses' ? document.getElementById('rd-frequence') : null;
  const frequence = freqEl ? freqEl.value : 'mensuelle';
  const startMoisEl = document.getElementById('rd-startmois');
  const startMois = startMoisEl ? parseInt(startMoisEl.value) : 1;
  const entry = {date, libelle, compte, groupe, categorie, montant, frequence, _startMois: startMois, _rawDate: rawDate};

  if (editingRec && editingRec.type === type) {
    // Replace existing
    delete data.recurrents[type][editingRec.idx]._editing;
    data.recurrents[type][editingRec.idx] = entry;
    editingRec = null;
  } else {
    data.recurrents[type].push(entry);
  }
  save();
  editingRec = null;
  showPage('settings');
}

function delRecurrent(type, idx) {
  data.recurrents[type].splice(idx, 1);
  save();
  showPage('settings');
}

function updateRecurrentReal(moisName, type, recId, val, weekIdx) {
  const key = type === 'revenus' ? 'revenus_tx' : 'transactions';
  if (!data[key]) data[key] = {};
  if (!data[key][moisName]) data[key][moisName] = [];
  const wi = weekIdx !== undefined && weekIdx >= 0 ? weekIdx : undefined;
  const existing = data[key][moisName].find(t =>
    t._recId === recId && (wi === undefined ? !t._weekIdx && t._weekIdx !== 0 : t._weekIdx === wi)
  );
  if (existing) {
    if (type === 'revenus') existing.montant = parseAmount(val);
    else existing.reel = parseAmount(val);
  } else {
    const rec = data.recurrents[type][recId];
    const entry = {...rec, _recId: recId, _isRecurrent: true};
    if (wi !== undefined) entry._weekIdx = wi;
    if (type === 'revenus') entry.montant = parseAmount(val);
    else { entry.prevu = rec.montant; entry.reel = parseAmount(val); }
    data[key][moisName].push(entry);
  }
  save();
  renderMain();
}

function getCats() {

    Transport:['Carburant','Voiture / Scooter','Parking'],

    Animaux:['Chats'],

    Bien_etre_Perso:['Coiffeur','Vêtements','Loisirs','Livres'],
    Epargne:['LDDS Yann','LDDS Noëmie','PEA Yann','PEA Noëmie','Assurance vie Yann','Assurance vie Noëmie','Assurance vie Jimmy','Assurance vie Léon','Livret A Jimmy','Livret A Léon','CTO','Épargne Espèces'],
    Finances_Obligations:['Crédits','Impôts','Assurances','Frais bancaires'],
    Depenses_perso:['Yann','Noëmie'],
    Pro:['Frais de missions','Cantine boulot'],
    Autres:['Cadeaux','Dons','Divers','Hors Budget'],

  // Merge: user categories override/extend defaults
  const userCats = (data.config && data.config.categories) ? data.config.categories : {};

function saveGroupes(g) { data.config = data.config||{}; data.config.groupes = g; save(); }
function saveCats(cats) { data.config = data.config||{}; data.config.categories = cats; save(); }

function moveGroupe(idx, dir) {
  const grps = getGroupes();
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= grps.length) return;
  [grps[idx], grps[newIdx]] = [grps[newIdx], grps[idx]];
  saveGroupes(grps);
  showPage('settings');
}

function sortGroupesAlpha() {
  const grps = getGroupes();
  grps.sort((a, b) => a.label.localeCompare(b.label, 'fr'));
  saveGroupes(grps);
  showPage('settings');
}

function addGroupe() {
  const label = document.getElementById('new-grp-label').value.trim();
  if (!label) return;
  const code = label.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]/g,'_');
  const clsList = ['b-logement','b-transport','b-alim','b-famille','b-sante','b-epargne','b-finances','b-bien','b-pro','b-autres','b-animaux','b-depenses'];
  const grps = getGroupes();
  const cls = clsList[grps.length % clsList.length];
  grps.push({label, code, cls});
  saveGroupes(grps);
  const cats = getCats(); cats[code] = []; saveCats(cats);
  document.getElementById('new-grp-label').value = '';
  showPage('settings');
}

function delGroupe(code) {
  if (!confirm('Supprimer ce groupe et toutes ses catégories ?')) return;
  const grps = getGroupes().filter(g => g.code !== code);
  saveGroupes(grps);
  const cats = getCats(); delete cats[code]; saveCats(cats);
  showPage('settings');
}

function renameGroupe(code) {
  const newLabel = document.getElementById('grp-rename-'+code).value.trim();
  if (!newLabel) return;
  const grps = getGroupes().map(g => g.code===code ? {...g, label:newLabel} : g);
  saveGroupes(grps);
  showPage('settings');
}

function addCat(code) {
  const inp = document.getElementById('new-cat-'+code);
  const val = inp.value.trim();
  if (!val) return;
  const cats = getCats();
  if (!cats[code]) cats[code] = [];
  if (!cats[code].includes(val)) { cats[code].push(val); saveCats(cats); }
  inp.value = '';
  showPage('settings');
}

function delCat(code, idx) {
  const cats = getCats();
  cats[code].splice(idx, 1);
  saveCats(cats);
  showPage('settings');
}

function importCSV(event, moisName) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const lines = ev.target.result.split('\n').filter(l => l.trim());
    if (lines.length < 2) { alert('Fichier CSV vide ou invalide'); return; }
    const sep = lines[0].includes(';') ? ';' : ',';
    const headers = lines[0].split(sep).map(h => h.trim().toLowerCase().replace(/['"]/g,''));
    
    // Try to detect columns
    const findCol = (...names) => {
      for (const n of names) {
        const idx = headers.findIndex(h => h.includes(n));
        if (idx !== -1) return idx;
      }
      return -1;
    };
    
    const dateCol    = findCol('date');
    const labelCol   = findCol('libellé','libelle','label','intitulé','description','opération');
    const debitCol   = findCol('débit','debit','montant débit','sortie');
    const creditCol  = findCol('crédit','credit','montant crédit','entrée');
    const montantCol = findCol('montant','amount');

    if (dateCol === -1 || labelCol === -1) {
      alert('Colonnes Date et Libellé introuvables dans ce CSV.\nEn-têtes détectés : ' + headers.join(', '));
      return;
    }

    let imported = 0, skipped = 0;
    const newTx = [];
    const newRev = [];

    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(sep).map(c => c.trim().replace(/['"]/g,''));
      if (cols.length < 2) continue;
      
      const rawDate = cols[dateCol] || '';
      // Parse date formats: DD/MM/YYYY or YYYY-MM-DD
      let dateObj;
      if (rawDate.includes('/')) {
        const parts = rawDate.split('/');
        if (parts.length === 3) {
          dateObj = parts[0].length === 4 
            ? new Date(parts[0], parts[1]-1, parts[2])
            : new Date(parts[2], parts[1]-1, parts[0]);
        }
      } else if (rawDate.includes('-')) {
        dateObj = new Date(rawDate);
      }
      const date = dateObj ? dateObj.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}) : rawDate;
      const libelle = cols[labelCol] || '';
      
      let montant = 0;
      let isCredit = false;
      
      if (debitCol !== -1 && creditCol !== -1) {
        const debit  = parseAmount(cols[debitCol]);
        const credit = parseAmount(cols[creditCol]);
        if (credit > 0) { montant = credit; isCredit = true; }
        else if (debit > 0) { montant = debit; isCredit = false; }
        else continue;
      } else if (montantCol !== -1) {
        montant = parseAmount(cols[montantCol]);
        isCredit = montant > 0;
        montant = Math.abs(montant);
      } else { skipped++; continue; }

      if (!libelle || !montant) { skipped++; continue; }

      if (isCredit) {
        newRev.push({date, libelle, compte:'La Banque Postale', groupe:'', categorie:'', prevu:0, montant, _rawDate: rawDate});
      } else {
        newTx.push({date, libelle, compte:'La Banque Postale', groupe:'Autres', categorie:'Divers', prevu:0, reel:montant, _rawDate: rawDate});
      }
      imported++;
    }

    if (!data.transactions[moisName]) data.transactions[moisName] = [];
    if (!data.revenus_tx[moisName]) data.revenus_tx[moisName] = [];
    data.transactions[moisName].push(...newTx);
    data.revenus_tx[moisName].push(...newRev);
    save();
    alert(`✅ ${imported} opérations importées${skipped ? ' (' + skipped + ' ignorées)' : ''}.\nPense à vérifier et catégoriser les lignes importées.`);
    showPage(moisName);
  };
  reader.readAsText(file, 'UTF-8');
}

function getLastSoldeFinMois(id) {
  const soldes = data.epargne.soldes[String(id)] || data.epargne.soldes[id] || {};
  const activeM = MOIS.filter(m=>isMonthActive(m));
  for (let i = activeM.length-1; i >= 0; i--) {
    const s = soldes[activeM[i]];
    if (s && (s.fin !== undefined || s.debut !== undefined)) {
      return s.fin !== undefined ? s.fin : s.debut;
    }
    // backward compat: old format was a number
    if (typeof s === 'number') return s;
  }
  return 0;
}

function getLastSoldeEpargne(id) {
  const soldes = data.epargne.soldes[String(id)] || data.epargne.soldes[id] || {};
  const activeM = MOIS.filter(m=>isMonthActive(m));
  let bestVal = null;
  for (let i = 0; i < activeM.length; i++) {
    const m = activeM[i];
    const s = soldes[m];
    if (s === undefined || s === null) continue;
    // Legacy: raw number
    if (typeof s === 'number') {
      if (s !== 0) bestVal = s;
      continue;
    }
    // New format: {debut, fin}
    if (typeof s === 'object') {
      const hasFin   = s.fin   !== undefined && s.fin   !== '' && s.fin   !== null && +s.fin   !== 0;
      const hasDebut = s.debut !== undefined && s.debut !== '' && s.debut !== null && +s.debut !== 0;
      if (hasFin)   bestVal = +s.fin;
      else if (hasDebut) bestVal = +s.debut;
      // Zero values are ignored — they mean "not yet filled"
    }
  }
  return bestVal !== null ? bestVal : 0;
}

function getTotalEpargne() {
  return (data.epargne.comptes||[]).reduce((a,c)=>a+getLastSoldeEpargne(c.id),0);

            onblur="setSoldeEpargne('${cp.id}','${m}','debut',this.value)"

          <input type="number" step="0.01" value="${vFin}" placeholder="Fin"
            style="width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:11px;text-align:right;padding:4px 6px;border-radius:5px;outline:none"
            onblur="setSoldeEpargne('${cp.id}','${m}','fin',this.value)"
            onkeydown="if(event.key==='Enter')this.blur()">
          ${prog !== null ? `<div style="font-size:10px;font-weight:600;text-align:center;color:${pc}">${prog>=0?'+':''}${prog.toLocaleString('fr-FR',{maximumFractionDigits:0})}€</div>` : '<div style="height:16px"></div>'}
        </div>`;
    }).join('');

    return `
    <div style="background:var(--surface);border:1px solid var(--border);border-left:3px solid ${color};border-radius:var(--r);padding:14px 18px;margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">

          <div style="font-size:10px;color:var(--muted);margin-bottom:2px">
            ${cp.type}${cp.organisme?` · <span style="color:var(--postale)">${cp.organisme}</span>`:''}
            ${cp.detenteur?`<span style="margin-left:6px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:1px 7px;font-size:9px;color:var(--text)">${cp.detenteur}</span>`:''}
          </div>
          <div contenteditable="false"
            onclick="this.contentEditable='true';this.focus()"
            onblur="this.contentEditable='false';updateEpargneField(${cp.id},'nom',this.textContent.trim())"
            onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"
            style="font-size:14px;font-weight:600;outline:none;border-bottom:1px dashed transparent;cursor:text;transition:border-color .15s;display:inline-block"
            onfocus="this.style.borderBottomColor='rgba(255,255,255,0.3)'"
            onmouseout="if(document.activeElement!==this)this.style.borderBottomColor='transparent'"
            onmouseover="this.style.borderBottomColor='rgba(255,255,255,0.2)'"
          >${cp.nom}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:10px;color:var(--muted)">Solde actuel</div>
          <div style="font-family:'DM Mono',monospace;font-size:18px;font-weight:700;color:${lastSolde<0?'var(--neg)':'var(--pos)'}">${fmt(lastSolde)}</div>
          ${progression !== null ? `<div style="font-size:11px;font-weight:500;color:${progression>=0?'var(--pos)':'var(--neg)'}">${progression>=0?'+':''}${progression.toLocaleString('fr-FR',{maximumFractionDigits:2})} € ce mois</div>` : ''}
        </div>
        <button onclick="delEpargneCompte(${cp.id})" style="background:transparent;border:1px solid rgba(248,113,113,0.25);color:var(--neg);padding:4px 8px;border-radius:var(--rs);font-size:11px;cursor:pointer;flex-shrink:0">✕</button>
      </div>
      <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
        <div style="display:flex;gap:8px;min-width:max-content;padding-bottom:4px">
          <div style="display:flex;flex-direction:column;gap:3px;justify-content:flex-end;padding-bottom:16px;min-width:36px">
            <div style="font-size:9px;color:var(--dim);text-align:right">Début</div>
            <div style="font-size:9px;color:var(--dim);text-align:right">Fin</div>
            <div style="height:16px"></div>
          </div>
          ${soldeInputs}
        </div>
      </div>
    </div>`;
  }).join('');

  const legend = comptes.map((cp,i)=>`
    <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)">
      <div style="width:8px;height:8px;border-radius:50%;background:${CHART_COLORS[i%CHART_COLORS.length]}"></div>
      <span>${cp.nom} <span style="color:var(--text);font-family:'DM Mono',monospace">${fmt(getLastSoldeEpargne(cp.id))}</span></span>
    </div>`).join('');

  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <div>
        <div style="font-size:10px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em">Total épargne & investissement</div>
        <div style="font-family:'DM Mono',monospace;font-size:28px;font-weight:700;color:var(--pos)">${fmt(total)}</div>
      </div>
    </div>

    ${comptes.length ? `
    <div style="display:grid;grid-template-columns:260px 1fr;gap:14px;margin-bottom:20px">
        <div style="display:flex;flex-direction:column;gap:10px">
        ${['Noëmie','Yann','Jimmy','Léon','Commun'].map(p => {
          const pid = 'ep-pie-'+p.replace(/[^a-zA-Z]/g,'');
          const pComptes = comptes.filter(cp=>(cp.detenteur||'Commun')===p);
          if (!pComptes.length) return '';
          const pTotal = pComptes.reduce((a,cp)=>a+getLastSoldeEpargne(cp.id),0);
          const pLegend = pComptes.map((cp,i)=>`
            <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)">
              <div style="width:7px;height:7px;border-radius:50%;background:${CHART_COLORS[i%CHART_COLORS.length]};flex-shrink:0"></div>
              <span>${cp.nom} <span style="color:var(--text);font-family:'DM Mono',monospace">${fmt(getLastSoldeEpargne(cp.id))}</span></span>
            </div>`).join('');
          return `
            <div style="background:var(--surface2);border-radius:var(--rs);padding:12px">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
                <div style="font-size:12px;font-weight:500">${p}</div>
                <div style="font-family:'DM Mono',monospace;font-size:13px;font-weight:600;color:var(--pos)">${fmt(pTotal)}</div>
              </div>

      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px">
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px">Évolution mensuelle</div>
        <canvas id="chart-ep-line" height="180"></canvas>
      </div>
    </div>` : ''}

    <div class="sec-label">Comptes épargne & investissement</div>
    ${compteCards || '<div style="color:var(--dim);font-size:13px;padding:20px 0">Ajoutez votre premier compte ci-dessous</div>'}

    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-top:4px">
      <div style="font-size:12px;color:var(--muted);font-weight:500;margin-bottom:12px">Ajouter un compte</div>
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Nom du compte</label><input type="text" id="ep-nom" placeholder="Ex: LDDS Yann, PEA..."></div>
        <div class="form-group"><label class="form-label">Organisme</label><input type="text" id="ep-organisme" placeholder="Ex: Finary, Boursobank..."></div>
        <div class="form-group"><label class="form-label">Détenteur</label>
          <select id="ep-detenteur">
            <option value="">Commun</option>
            <option>Noëmie</option><option>Yann</option>

            <option>CTO</option><option>Épargne retraite</option><option>Autre</option>
