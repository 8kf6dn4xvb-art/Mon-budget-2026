// ── PAGE CRÉDITS ──────────────────────────────────────────────────────────────
function addCredit() {
  const nom       = document.getElementById('cr-nom').value.trim();
  const organisme = document.getElementById('cr-organisme').value.trim();
  const total     = parseAmount(document.getElementById('cr-total').value);
  const mensualite= parseAmount(document.getElementById('cr-mensualite').value);
  const debut     = document.getElementById('cr-debut').value;
  const fin       = document.getElementById('cr-fin').value;
  const compte    = document.getElementById('cr-compte').value;
  if (!nom || !total || !mensualite) { alert('Nom, montant et mensualité obligatoires'); return; }
  const capitalRestant = total - (data.credits||[]).filter(cr=>cr.nom===nom).length * mensualite;
  data.credits.push({id:Date.now(), nom, organisme, total, mensualite, debut, fin, compte,
    rembourse: 0});
  save(); showPage('credits');
}

function delCredit(id) {
  if (!confirm('Supprimer ce crédit ?')) return;
  data.credits = data.credits.filter(c=>c.id!==id);
  save(); showPage('credits');
}

function updateCredit(id, field, val) {
  const cr = data.credits.find(c=>c.id===id);
  if (cr) { cr[field] = field==='nom'||field==='organisme'||field==='debut'||field==='fin'||field==='compte' ? val : parseAmount(val); save(); }
}

function renderCreditsCharts() {
  const credits = data.credits||[];
  if (!credits.length) return;

  destroyChart('cr-bar');
  const bar = document.getElementById('chart-cr-bar');
  if (bar) {
    chartInstances['cr-bar'] = new Chart(bar, {
      type:'bar',
      data:{
        labels: credits.map(c=>c.nom),
        datasets:[
          {label:'Remboursé',data:credits.map(c=>+c.rembourse||0),backgroundColor:'rgba(52,211,153,0.8)',borderRadius:4,borderSkipped:false},
          {label:'Restant',data:credits.map(c=>Math.max(0,(+c.total||0)-(+c.rembourse||0))),backgroundColor:'rgba(248,113,113,0.6)',borderRadius:4,borderSkipped:false},
        ]
      },
      options:{responsive:true,
        plugins:{legend:{labels:{color:'#7c8299',font:{size:11},boxWidth:10}},
          tooltip:{callbacks:{label:ctx=>` ${ctx.dataset.label} : ${fmt(ctx.raw)}`},
            backgroundColor:'rgba(24,28,39,0.95)',titleColor:'#e8eaf0',bodyColor:'#7c8299',borderColor:'rgba(255,255,255,0.07)',borderWidth:1}},
        scales:{
          x:{stacked:true,ticks:{color:'#7c8299'},grid:{display:false},border:{display:false}},
          y:{stacked:true,ticks:{color:'#7c8299',callback:v=>fmt(v)},grid:{color:'rgba(255,255,255,0.05)'},border:{display:false}}
        }
      }
    });
  }
}

function renderCredits() {
  const credits = data.credits||[];
  const totalDette = credits.reduce((a,c)=>a+Math.max(0,(+c.total||0)-(+c.rembourse||0)),0);
  const totalMensualites = credits.reduce((a,c)=>a+(+c.mensualite||0),0);
  const compteOpts = COMPTES.map(cp=>`<option value="${cp}">${cp}</option>`).join('');

  const creditCards = credits.map(cr => {
    const restant = Math.max(0, (+cr.total||0) - (+cr.rembourse||0));
    const pct = cr.total>0 ? Math.min(100,Math.round(((+cr.rembourse||0)/cr.total)*100)) : 0;
    const moisRestants = cr.mensualite>0 ? Math.ceil(restant/cr.mensualite) : '?';
    return `
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;margin-bottom:12px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:12px">
        <div style="flex:1">
          <div style="font-size:11px;color:var(--muted);margin-bottom:2px">${cr.organisme||'—'}</div>
          <div style="font-size:16px;font-weight:600">${cr.nom}</div>
          <div style="font-size:11px;color:var(--dim);margin-top:3px">
            ${cr.compte?`<span class="badge ${COMPTE_CLS[cr.compte]||''}">${cr.compte}</span>`:''}
            ${cr.debut?' · Début '+cr.debut:''}${cr.fin?' · Fin prévue '+cr.fin:''}
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;text-align:center">
          <div>
            <div style="font-size:10px;color:var(--muted);margin-bottom:3px">Emprunté</div>
            <div style="font-family:'DM Mono',monospace;font-size:15px;font-weight:600">${fmt(+cr.total||0)}</div>
          </div>
          <div>
            <div style="font-size:10px;color:var(--muted);margin-bottom:3px">Mensualité actuelle</div>
            <div style="display:flex;align-items:center;gap:4px">
              <input type="number" step="0.01" value="${+cr.mensualite||0}"
                style="width:100px;background:transparent;border:none;border-bottom:1px dashed rgba(248,113,113,0.4);color:var(--neg);font-family:'DM Mono',monospace;font-size:15px;font-weight:600;text-align:right;padding:2px 4px;outline:none"
                onfocus="this.style.borderColor='var(--neg)'"
                onblur="this.style.borderColor='rgba(248,113,113,0.4)';updateCredit(${cr.id},'mensualite',this.value)"
                onkeydown="if(event.key==='Enter')this.blur()"
                title="Cliquez pour modifier la mensualité">
              <span style="font-size:11px;color:var(--muted)">€</span>
            </div>
            <div style="font-size:9px;color:var(--dim);margin-top:2px">Cliquez pour modifier</div>
          </div>
          <div>
            <div style="font-size:10px;color:var(--muted);margin-bottom:3px">Restant dû</div>
            <div style="font-family:'DM Mono',monospace;font-size:15px;font-weight:600;color:${restant>0?'var(--neg)':'var(--pos)'}">${fmt(restant)}</div>
          </div>
        </div>
        <button onclick="delCredit(${cr.id})" style="background:transparent;border:1px solid rgba(248,113,113,0.3);color:var(--neg);padding:5px 10px;border-radius:var(--rs);font-size:11px;cursor:pointer;flex-shrink:0">✕</button>
      </div>

      <div style="margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:4px">
          <span>Remboursement</span>
          <span>${pct}% · ${moisRestants} mois restants</span>
        </div>
        <div style="height:8px;background:var(--surface2);border-radius:4px;overflow:hidden">
          <div style="height:100%;border-radius:4px;width:${pct}%;background:${pct>=100?'var(--pos)':pct>50?'var(--postale)':'var(--warn)'}"></div>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:10px;margin-top:12px">
        <span style="font-size:11px;color:var(--muted)">Montant remboursé à ce jour :</span>
        <input type="number" step="0.01" value="${+cr.rembourse||0}"
          style="width:130px;background:var(--surface2);border:1px solid var(--border2);color:var(--pos);font-family:'DM Mono',monospace;font-size:13px;text-align:right;padding:6px 10px;border-radius:var(--rs);outline:none"
          onblur="updateCredit(${cr.id},'rembourse',this.value);showPage('credits')"
          onkeydown="if(event.key==='Enter')this.blur()">
        <span style="font-size:11px;color:var(--muted)">€</span>
      </div>
    </div>`;
  }).join('');

  return `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px">
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 20px">
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px">Total restant dû</div>
        <div style="font-family:'DM Mono',monospace;font-size:24px;font-weight:700;color:var(--neg)">${fmt(totalDette)}</div>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 20px">
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px">Mensualités totales</div>
        <div style="font-family:'DM Mono',monospace;font-size:24px;font-weight:700;color:var(--warn)">${fmt(totalMensualites)}/mois</div>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 20px">
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px">Nombre de crédits</div>
        <div style="font-family:'DM Mono',monospace;font-size:24px;font-weight:700">${credits.length}</div>
      </div>
    </div>

    ${credits.length ? `
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:20px">
      <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px">Remboursé vs Restant</div>
      <canvas id="chart-cr-bar" height="140"></canvas>
    </div>` : ''}

    <div class="sec-label">Mes crédits</div>
    ${creditCards || '<div style="color:var(--dim);font-size:13px;padding:20px 0">Aucun crédit enregistré</div>'}

    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-top:4px">
      <div style="font-size:12px;color:var(--muted);font-weight:500;margin-bottom:12px">Ajouter un crédit</div>
      <div class="form-grid" style="margin-bottom:10px">
        <div class="form-group"><label class="form-label">Nom du crédit</label><input type="text" id="cr-nom" placeholder="Ex: Crédit immobilier"></div>
        <div class="form-group"><label class="form-label">Organisme</label><input type="text" id="cr-organisme" placeholder="Ex: Crédit Agricole"></div>
        <div class="form-group"><label class="form-label">Compte prélevé</label><select id="cr-compte">${compteOpts}</select></div>
        <div class="form-group"><label class="form-label">Montant emprunté (€)</label><input type="number" id="cr-total" placeholder="0"></div>
      </div>
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Mensualité (€)</label><input type="number" id="cr-mensualite" placeholder="0"></div>
        <div class="form-group"><label class="form-label">Date de début</label><input type="date" id="cr-debut"></div>
        <div class="form-group"><label class="form-label">Date de fin prévue</label><input type="date" id="cr-fin"></div>
        <button class="btn-add" onclick="addCredit()">+ Ajouter</button>
      </div>
    </div>
  `;
}

function exportData() {
  const a = document.createElement('a');
  a.href = 'data:application/json,' + encodeURIComponent(JSON.stringify(data, null, 2));
  a.download = 'budget_2026_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const imported = JSON.parse(ev.target.result);
      Object.assign(data, imported);
      save(); showPage('settings');
    } catch { alert('Fichier invalide'); }
  };
  reader.readAsText(file);
}

function renderMain() {
  const main = document.getElementById('mainContent');
  if (currentPage === 'annual') {
    main.innerHTML = renderAnnual();
  } else if (currentPage === 'settings') {
    main.innerHTML = renderSettings();
    setTimeout(() => { syncRrCats(); syncRdCats(); }, 50);
  } else if (currentPage === 'epargne') {
    main.innerHTML = renderEpargne();
    setTimeout(renderEpargneCharts, 150);
  } else if (currentPage === 'credits') {
    main.innerHTML = renderCredits();
    setTimeout(renderCreditsCharts, 150);
  } else {
    main.innerHTML = renderMonth(currentPage);
    setTimeout(() => {
      updateCats();
      // Pre-fill date fields with today
      const today = new Date().toISOString().split('T')[0];
      // Init all category selects with correct options
      updateCats();
      updateRevCats();
      syncRrCats();
      syncRdCats();
      ['f-date','rv-date'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = today;
      });
    }, 50);
  }
}

// ── EDIT MODE ─────────────────────────────────────────────────────────────────
let editMode = false;

function toggleEditMode() {
  editMode = !editMode;
  const btn = document.getElementById('editModeBtn');
  btn.textContent = editMode ? '✅  Terminer' : '✏️  Mode édition';
  btn.className = 'edit-mode-btn' + (editMode ? ' on' : '');
  const hint = document.getElementById('editHint');
  hint.className = 'edit-hint' + (editMode ? ' show' : '');
  renderMain();
}

function getConf(key, fallback) {
  return (data.config && data.config[key]) ? data.config[key] : fallback;
}

function setConf(key, val) {
  data.config = data.config || {};
  data.config[key] = val;
  save();
}

function editable(val, key) {
  if (!editMode) return val;
  return `<span class="editable" onclick="startEdit(this,'${key}')">${val}</span>`;
}

function startEdit(el, key) {
  const cur = el.textContent;
  const inp = document.createElement('input');
  inp.className = 'editable-input';
  inp.value = cur;
  inp.style.fontSize = getComputedStyle(el).fontSize;
  inp.style.fontWeight = getComputedStyle(el).fontWeight;
  inp.style.color = getComputedStyle(el).color;
  inp.style.width = Math.max(cur.length * 9, 80) + 'px';
  el.replaceWith(inp);
  inp.focus(); inp.select();
  function commit() { setConf(key, inp.value.trim() || cur); renderMain(); }
  inp.onblur = commit;
  inp.onkeydown = e => { if(e.key==='Enter'){e.preventDefault();commit();} if(e.key==='Escape'){inp.value=cur;commit();} };
}

// ── INIT ──────────────────────────────────────────────────────────────────────
// ── INIT ─────────────────────────────────────────────────────────────────────

const syncBar = document.createElement('div');
syncBar.id = 'syncBar'; syncBar.className = 'sync-bar syncing';
document.body.appendChild(syncBar);
const syncDotEl = document.createElement('div');
syncDotEl.id = 'syncDot'; syncDotEl.className = 'sync-dot syncing';
document.body.appendChild(syncDotEl);

buildNav();
loadData(() => {
  renderMain();
});

// Inject floating buttons after render

editBtn.id = 'editModeBtn';
editBtn.className = 'edit-mode-btn';
editBtn.textContent = '✏️  Mode édition';
editBtn.onclick = toggleEditMode;
document.body.appendChild(editBtn);

const hint = document.createElement('div');
hint.id = 'editHint';
hint.className = 'edit-hint';
hint.textContent = 'Cliquez sur un texte pointillé pour le modifier';
document.body.appendChild(hint);

</script>
