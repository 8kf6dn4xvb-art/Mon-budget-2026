<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pilotage Budgétaire 2026</title>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f1117; --surface:#181c27; --surface2:#1e2333; --surface3:#242840;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.13);
  --text:#e8eaf0; --muted:#7c8299; --dim:#4a5068;
  --postale:#4f8ef7; --postale-bg:rgba(79,142,247,0.12);
  --bourso:#34d399;  --bourso-bg:rgba(52,211,153,0.12);
  --revolut:#a78bfa; --revolut-bg:rgba(167,139,250,0.12);
  --amex:#fbbf24;    --amex-bg:rgba(251,191,36,0.12);
  --pos:#34d399; --neg:#f87171; --warn:#fbbf24;
  --r:14px; --rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.mono{font-family:'DM Mono',monospace}

/* HEADER */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header-left{display:flex;align-items:center;gap:14px}
.logo{width:30px;height:30px;background:linear-gradient(135deg,#4f8ef7,#a78bfa);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff}
.header h1{font-size:15px;font-weight:500;letter-spacing:-.01em}
.header h1 span{color:var(--muted);font-weight:400}
.month-nav{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.month-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:5px 11px;border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap}
.month-btn:hover{border-color:var(--border2);color:var(--text)}
.month-btn.active{background:var(--postale);border-color:var(--postale);color:#fff;font-weight:500}
.nav-sep{display:flex;align-items:center;gap:4px}
.annual-btn{background:transparent;border:1px solid rgba(167,139,250,0.4);color:var(--revolut);padding:5px 13px;border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:all .15s}
.annual-btn:hover,.annual-btn.active{background:var(--revolut);border-color:var(--revolut);color:#fff}

/* MAIN */
.main{padding:24px 28px;max-width:1440px;margin:0 auto}
.page{display:none}.page.active{display:block}

/* SECTION LABEL */
.sec-label{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* SOLDES GRID */
.soldes-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.solde-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;position:relative;overflow:hidden;transition:border-color .2s}
.solde-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.sc-postale::before{background:var(--postale)}
.sc-bourso::before{background:var(--bourso)}
.sc-revolut::before{background:var(--revolut)}
.sc-amex::before{background:var(--amex)}
.sc-bank{font-size:11px;color:var(--muted);margin-bottom:3px}
.sc-name{font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.sc-dot{width:7px;height:7px;border-radius:50%}
.sc-postale .sc-dot{background:var(--postale)}
.sc-bourso  .sc-dot{background:var(--bourso)}
.sc-revolut .sc-dot{background:var(--revolut)}
.sc-amex    .sc-dot{background:var(--amex)}
.sc-rows{display:flex;flex-direction:column;gap:5px}
.sc-row{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.sc-row .lbl{color:var(--muted)}
.sc-div{height:1px;background:var(--border);margin:8px 0}
.sc-big{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.sc-big .lbl{font-size:12px;color:var(--muted)}
.sc-big .val{font-size:19px;font-weight:600;font-family:'DM Mono',monospace}
.val-pos{color:var(--pos)}
.val-neg{color:var(--neg)}
.val-warn{color:var(--warn)}
.val-muted{color:var(--muted)}
.val-mono{font-family:'DM Mono',monospace;font-size:12px}
.amex-pill{display:inline-flex;align-items:center;gap:5px;background:var(--amex-bg);color:var(--warn);border:1px solid rgba(251,191,36,0.2);border-radius:6px;padding:4px 9px;font-size:11px;font-weight:500;margin-top:10px}

/* KPI BAR */
.kpi-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:14px}
.kpi-item{padding:16px 20px;border-right:1px solid var(--border)}
.kpi-item:last-child{border-right:none}
.kpi-lbl{font-size:11px;color:var(--muted);margin-bottom:6px}
.kpi-val{font-family:'DM Mono',monospace;font-size:22px;font-weight:500;letter-spacing:-.02em}
.kpi-sub{font-size:11px;color:var(--dim);margin-top:3px}

/* AMEX NOTE */
.amex-note{background:rgba(251,191,36,0.07);border:1px solid rgba(251,191,36,0.18);border-radius:var(--rs);padding:10px 16px;font-size:12px;color:var(--warn);margin-bottom:20px;display:flex;align-items:center;gap:8px}

/* TABLE CARD */
.tcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.tcard-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.tcard-title{font-size:13px;font-weight:500}
.tcard-count{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:2px 10px;font-size:11px;color:var(--muted);font-family:'DM Mono',monospace}
table{width:100%;border-collapse:collapse}
thead th{padding:9px 14px;font-size:10px;font-weight:500;color:var(--dim);text-align:left;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--border);background:var(--surface2)}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,0.02)}
tbody td{padding:10px 14px;font-size:13px;vertical-align:middle}
.td-date{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted)}
.td-label{font-weight:400}
.td-num{font-family:'DM Mono',monospace;font-size:12px;text-align:right}
.td-ecart-pos{color:var(--pos);font-family:'DM Mono',monospace;font-size:12px;text-align:right}
.td-ecart-neg{color:var(--neg);font-family:'DM Mono',monospace;font-size:12px;text-align:right}
.td-ecart-zero{color:var(--dim);font-family:'DM Mono',monospace;font-size:12px;text-align:right}
.total-row td{background:var(--surface2);font-weight:600;font-size:13px;border-top:1px solid var(--border2)!important}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:500;white-space:nowrap}
.b-postale{background:var(--postale-bg);color:var(--postale)}
.b-bourso{background:var(--bourso-bg);color:var(--bourso)}
.b-revolut{background:var(--revolut-bg);color:var(--revolut)}
.b-amex{background:var(--amex-bg);color:var(--warn)}
.b-logement{background:rgba(79,142,247,0.12);color:#4f8ef7}
.b-transport{background:rgba(167,139,250,0.12);color:#a78bfa}
.b-alim{background:rgba(251,191,36,0.12);color:#fbbf24}
.b-famille{background:rgba(251,113,133,0.12);color:#fb7185}
.b-sante{background:rgba(52,211,153,0.12);color:#34d399}
.b-epargne{background:rgba(52,211,153,0.15);color:#34d399}
.b-finances{background:rgba(245,158,11,0.12);color:#f59e0b}
.b-animaux{background:rgba(134,239,172,0.12);color:#86efac}
.b-bien{background:rgba(192,132,252,0.12);color:#c084fc}
.b-pro{background:rgba(20,184,166,0.12);color:#14b8a6}
.b-autres{background:rgba(148,163,184,0.12);color:#94a3b8}
.b-depenses{background:rgba(132,204,22,0.12);color:#84cc16}

/* ADD ROW FORM */
.add-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:20px}
.add-title{font-size:12px;color:var(--muted);margin-bottom:12px;font-weight:500}
.add-form{display:grid;grid-template-columns:90px 1fr 130px 130px 160px 100px 100px auto;gap:8px;align-items:end}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:10px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
input,select{background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:7px 10px;border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:12px;outline:none;width:100%;transition:border-color .15s}
input:focus,select:focus{border-color:var(--postale)}
select option{background:var(--surface2)}
.btn-add{background:var(--postale);border:none;color:#fff;padding:8px 16px;border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:opacity .15s;white-space:nowrap}
.btn-add:hover{opacity:.85}
.btn-del{background:transparent;border:1px solid rgba(248,113,113,0.3);color:var(--neg);padding:4px 8px;border-radius:6px;font-size:11px;cursor:pointer;transition:all .15s}
.btn-del:hover{background:rgba(248,113,113,0.1)}

/* SYNTHESE GROUPES */
.synth-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.prog-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.prog-row{padding:9px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.prog-row:last-child{border-bottom:none}
.prog-label{min-width:150px}
.prog-bar-bg{flex:1;height:4px;background:var(--surface3);border-radius:2px;overflow:hidden}
.prog-bar{height:100%;border-radius:2px;transition:width .6s ease}
.prog-vals{display:flex;gap:10px;min-width:120px;justify-content:flex-end;font-family:'DM Mono',monospace;font-size:11px}
.prog-prev{color:var(--dim)}
.prog-real{font-weight:500}

/* ANNUAL DASHBOARD */
.annual-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.month-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:border-color .2s;cursor:pointer}
.month-card:hover{border-color:var(--border2)}
.mc-header{padding:10px 14px;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.mc-body{padding:10px 14px;display:flex;flex-direction:column;gap:5px}
.mc-row{display:flex;justify-content:space-between;font-size:12px}
.mc-lbl{color:var(--muted)}
.mc-val{font-family:'DM Mono',monospace;font-size:12px;font-weight:500}

/* ANNUAL TABLE */
.annual-table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:24px}

/* EDITABLE */
.editable{cursor:text;border-bottom:1px dashed rgba(79,142,247,0.5);transition:border-color .15s;padding-bottom:1px}
.editable:hover{border-bottom-color:var(--postale)}
.editable-input{background:transparent;border:none;border-bottom:1px solid var(--postale);color:inherit;font:inherit;outline:none;padding:0;margin:0;min-width:60px}
.edit-mode-btn{position:fixed;bottom:20px;background:var(--surface2);border:1px solid var(--border2);color:var(--muted);padding:8px 14px;border-radius:20px;font-family:"DM Sans",sans-serif;font-size:12px;cursor:pointer;z-index:200;transition:all .2s}
.edit-mode-btn:hover{border-color:var(--postale);color:var(--postale)}
.edit-mode-btn.on{background:rgba(79,142,247,0.12);border-color:var(--postale);color:var(--postale)}
#editModeBtn{right:20px}
.edit-hint{position:fixed;bottom:58px;right:20px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:8px 14px;font-size:11px;color:var(--muted);z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.edit-hint.show{opacity:1}

/* SYNC STATUS */
.sync-bar{position:fixed;top:60px;right:0;left:0;height:2px;z-index:99;pointer-events:none}
.sync-bar.syncing{background:linear-gradient(90deg,transparent,var(--postale),transparent);background-size:200% 100%;animation:syncAnim 1.2s ease infinite}
.sync-bar.ok{background:var(--pos);opacity:0;transition:opacity 1s}
.sync-bar.err{background:var(--neg)}
@keyframes syncAnim{0%{background-position:100% 0}100%{background-position:-100% 0}}
.sync-dot{position:fixed;bottom:68px;right:20px;width:8px;height:8px;border-radius:50%;background:var(--dim);z-index:200;transition:background .3s}
.sync-dot.ok{background:var(--pos)}
.sync-dot.syncing{background:var(--warn);animation:pulse .8s ease infinite}
.sync-dot.err{background:var(--neg)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* FADE IN */
.fade{opacity:0;transform:translateY(6px);animation:fu .35s ease forwards}
@keyframes fu{to{opacity:1;transform:translateY(0)}}
.fade:nth-child(1){animation-delay:.04s}.fade:nth-child(2){animation-delay:.08s}
.fade:nth-child(3){animation-delay:.12s}.fade:nth-child(4){animation-delay:.16s}
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="logo">P</div>
    <h1>Pilotage budgétaire &nbsp;<span>2026</span></h1>
  </div>
  <div class="month-nav" id="monthNav"></div>
</header>

<main class="main" id="mainContent"></main>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const MOIS = ['Janvier','Février','Mars','Avril','Mai','Juin',
              'Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

const COMPTES = ['La Banque Postale','BoursoBank','Revolut','Amex (différé)'];

const GROUPES = [
  {label:'Logement',         code:'Logement',          cls:'b-logement'},
  {label:'Transport',        code:'Transport',          cls:'b-transport'},
  {label:'Alimentation',     code:'Alimentation',       cls:'b-alim'},
  {label:'Famille & Enfants',code:'Famille_et_Enfants', cls:'b-famille'},
  {label:'Animaux',          code:'Animaux',            cls:'b-animaux'},
  {label:'Santé',            code:'Sante',              cls:'b-sante'},
  {label:'Bien-être & Perso',code:'Bien_etre_Perso',    cls:'b-bien'},
  {label:'Épargne',          code:'Epargne',            cls:'b-epargne'},
  {label:'Finances & Oblig.',code:'Finances_Obligations',cls:'b-finances'},
  {label:'Dépenses perso',   code:'Depenses_perso',     cls:'b-depenses'},
  {label:'Pro',              code:'Pro',                cls:'b-pro'},
  {label:'Autres',           code:'Autres',             cls:'b-autres'},
];

const CATEGORIES = {
  Logement:['Loyer / Charges','Électricité / Eau / Gaz','Décorations & Équipement','Entretien / Réparations'],
  Transport:['Carburant','Voiture / Scooter','Parking'],
  Alimentation:['Courses courantes','Courses exceptionnelles','Épicerie / Boulangerie','Restaurants'],
  Famille_et_Enfants:['Jimmy','Léon','Nounou','École / Cantine'],
  Animaux:['Chats'],
  Sante:['Médecin / Pharmacie','Mutuelles'],
  Bien_etre_Perso:['Coiffeur','Vêtements','Loisirs','Livres'],
  Epargne:['LDDS Yann','LDDS Noëmie','PEA Yann','PEA Noëmie','Assurance vie Yann','Assurance vie Noëmie','Assurance vie Jimmy','Assurance vie Léon','Livret A Jimmy','Livret A Léon','CTO','Épargne Espèces'],
  Finances_Obligations:['Crédits','Impôts','Assurances','Frais bancaires'],
  Depenses_perso:['Yann','Noëmie'],
  Pro:['Frais de missions','Cantine boulot'],
  Autres:['Cadeaux','Dons','Divers','Hors Budget'],
};

const COMPTE_CLS = {
  'La Banque Postale':'b-postale','BoursoBank':'b-bourso',
  'Revolut':'b-revolut','Amex (différé)':'b-amex'
};
const COMPTE_COLOR = {
  'La Banque Postale':'var(--postale)','BoursoBank':'var(--bourso)',
  'Revolut':'var(--revolut)','Amex (différé)':'var(--warn)'
};
const COMPTE_VAR = {
  'La Banque Postale':'--postale','BoursoBank':'--bourso',
  'Revolut':'--revolut','Amex (différé)':'--amex'
};

// ── STATE ─────────────────────────────────────────────────────────────────────
// ── FIREBASE SETUP ────────────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyBsiK-PoQx8Pp92wZtIXAq-F5RW7xEddZc",
  authDomain: "mon-budget-2026.firebaseapp.com",
  databaseURL: "https://mon-budget-2026-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "mon-budget-2026",
  storageBucket: "mon-budget-2026.firebasestorage.app",
  messagingSenderId: "442641870179",
  appId: "1:442641870179:web:1245bd1ea6228eb961f756"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const REF = db.ref('budget2026');

let data = {
  revenus: { salaire_yann:0, salaire_noemie:0, caf:0, cmg:0, autres:0 },
  soldes_debut: { jan: {postale:0,bourso:0,revolut:0} },
  transactions: Object.fromEntries(MOIS.map(m => [m, []]))
};

let syncDot, saveTimeout;

function setSyncStatus(status) {
  if (!syncDot) syncDot = document.getElementById('syncDot');
  const bar = document.getElementById('syncBar');
  if (syncDot) syncDot.className = 'sync-dot ' + status;
  if (bar) bar.className = 'sync-bar ' + status;
  if (status === 'ok') {
    setTimeout(() => { if(bar) bar.className='sync-bar'; }, 2000);
  }
}

function save() {
  // Keep localStorage as offline cache
  localStorage.setItem('budget2026', JSON.stringify(data));
  // Debounce Firebase writes
  clearTimeout(saveTimeout);
  setSyncStatus('syncing');
  saveTimeout = setTimeout(() => {
    REF.set(data)
      .then(() => setSyncStatus('ok'))
      .catch(e => { console.error(e); setSyncStatus('err'); });
  }, 800);
}

function sanitizeData(d) {
  if (!d) d = {};
  if (!d.revenus) d.revenus = { salaire_yann:0, salaire_noemie:0, caf:0, cmg:0, autres:0 };
  if (!d.soldes_debut) d.soldes_debut = { jan: {postale:0,bourso:0,revolut:0} };
  if (!d.soldes_debut.jan) d.soldes_debut.jan = {postale:0,bourso:0,revolut:0};
  if (!d.transactions) d.transactions = {};
  MOIS.forEach(m => { if (!d.transactions[m]) d.transactions[m] = []; });
  if (!d.config) d.config = {};
  return d;
}

// Load from Firebase on start, fall back to localStorage
function loadData(callback) {
  setSyncStatus('syncing');
  // Always render immediately with local/default data first
  const local = localStorage.getItem('budget2026');
  if (local) { try { data = sanitizeData(JSON.parse(local)); } catch(e) {} }
  else { data = sanitizeData({}); }
  callback(); // Render immediately

  // Then try Firebase
  REF.once('value')
    .then(snap => {
      const val = snap.val();
      if (val) {
        data = sanitizeData(val);
        localStorage.setItem('budget2026', JSON.stringify(data));
        setSyncStatus('ok');
        renderMain(); // Re-render with Firebase data
      } else {
        // First time on Firebase: push local data up
        REF.set(data).catch(()=>{});
        setSyncStatus('ok');
      }
    })
    .catch(e => {
      console.warn('Firebase offline, using local data');
      setSyncStatus('err');
    });
}

// Real-time listener for changes from other devices
REF.on('value', snap => {
  const val = snap.val();
  if (!val) return;
  const newData = JSON.stringify(val);
  const curData = JSON.stringify(data);
  if (newData !== curData) {
    data = sanitizeData(val);
    localStorage.setItem('budget2026', JSON.stringify(data));
    renderMain();
    setSyncStatus('ok');
  }
});

// ── FORMATTERS ────────────────────────────────────────────────────────────────
function fmt(n) {
  if (n === null || n === undefined || n === '') return '—';
  const abs = Math.abs(n);
  const s = abs.toLocaleString('fr-FR', {minimumFractionDigits:0, maximumFractionDigits:0});
  return (n < 0 ? '−' : '') + s + ' €';
}
function fmtSign(n) {
  if (!n && n !== 0) return '—';
  const s = Math.abs(n).toLocaleString('fr-FR', {minimumFractionDigits:0, maximumFractionDigits:0});
  return (n > 0 ? '+' : n < 0 ? '−' : '') + s + ' €';
}
function ecartClass(n) {
  if (!n && n !== 0) return 'td-ecart-zero';
  return n > 0 ? 'td-ecart-pos' : n < 0 ? 'td-ecart-neg' : 'td-ecart-zero';
}

// ── CALCULS ───────────────────────────────────────────────────────────────────
function getRevTotal() {
  return Object.values(data.revenus).reduce((a,b)=>a+(+b||0),0);
}
function getSoldeDebut(moisIdx, compte) {
  const key = ['postale','bourso','revolut','amex'][COMPTES.indexOf(compte)];
  if (compte === 'Amex (différé)') return 0;
  if (moisIdx === 0) return data.soldes_debut.jan[key] || 0;
  const prevMois = MOIS[moisIdx-1];
  return getSoldeReel(moisIdx-1, compte);
}
function getDepenses(moisIdx, compte) {
  return (data.transactions[MOIS[moisIdx]] || [])
    .filter(t => t.compte === compte)
    .reduce((a,t)=>a+(+t.reel||0),0);
}
function getDepensesPrev(moisIdx, compte) {
  return (data.transactions[MOIS[moisIdx]] || [])
    .filter(t => t.compte === compte)
    .reduce((a,t)=>a+(+t.prevu||0),0);
}
function getSoldeReel(moisIdx, compte) {
  if (compte === 'Amex (différé)') return 0;
  const rev = compte === 'La Banque Postale' ? getRevTotal() : 0;
  return getSoldeDebut(moisIdx, compte) + rev - getDepenses(moisIdx, compte);
}
function getSoldePrev(moisIdx, compte) {
  if (compte === 'Amex (différé)') return 0;
  const rev = compte === 'La Banque Postale' ? getRevTotal() : 0;
  return getSoldeDebut(moisIdx, compte) + rev - getDepensesPrev(moisIdx, compte);
}
function getAmex(moisIdx) {
  return (data.transactions[MOIS[moisIdx]] || [])
    .filter(t => t.compte === 'Amex (différé)')
    .reduce((a,t)=>a+(+t.reel||0),0);
}
function getEpargne(moisIdx) {
  return (data.transactions[MOIS[moisIdx]] || [])
    .filter(t => t.groupe === 'Epargne')
    .reduce((a,t)=>a+(+t.reel||0),0);
}
function getTotalDep(moisIdx) {
  return COMPTES.filter(c=>c!=='Amex (différé)').reduce((a,c)=>a+getDepenses(moisIdx,c),0)
    + getAmex(moisIdx);
}

// ── NAVIGATION ────────────────────────────────────────────────────────────────
let currentPage = 'Mai';

function buildNav() {
  const nav = document.getElementById('monthNav');
  nav.innerHTML = '';
  const abr = ['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];
  MOIS.forEach((m,i) => {
    const b = document.createElement('button');
    b.className = 'month-btn' + (m===currentPage?' active':'');
    b.textContent = abr[i];
    b.onclick = () => showPage(m);
    nav.appendChild(b);
  });
  const sep = document.createElement('div');
  sep.className='nav-sep';
  sep.style.marginLeft='8px';
  const ab = document.createElement('button');
  ab.className='annual-btn'+(currentPage==='annual'?' active':'');
  ab.textContent='Annuel';
  ab.onclick=()=>showPage('annual');
  sep.appendChild(ab);
  const spBtn = document.createElement('button');
  spBtn.className='annual-btn'+(currentPage==='settings'?' active':'');
  spBtn.style.cssText='border-color:rgba(251,191,36,0.35);color:var(--warn)';
  spBtn.textContent='⚙ Paramètres';
  spBtn.onclick=()=>showPage('settings');
  sep.appendChild(spBtn);
  nav.appendChild(sep);
}

function showPage(page) {
  currentPage = page;
  buildNav();
  renderMain();
}

// ── RENDER MONTH ──────────────────────────────────────────────────────────────
function renderMonth(moisName) {
  const moisIdx = MOIS.indexOf(moisName);
  const txs = data.transactions[moisName] || [];

  // Soldes
  const soldesHTML = COMPTES.map((compte,i) => {
    const isAmex = compte === 'Amex (différé)';
    const cls = ['sc-postale','sc-bourso','sc-revolut','sc-amex'][i];
    const debut = isAmex ? null : getSoldeDebut(moisIdx, compte);
    const dep = getDepenses(moisIdx, compte);
    const rev = compte==='La Banque Postale' ? getRevTotal() : null;
    const prev = isAmex ? null : getSoldePrev(moisIdx, compte);
    const reel = isAmex ? null : getSoldeReel(moisIdx, compte);
    const amex = isAmex ? getAmex(moisIdx) : null;
    const DEF_BANKS = ['La Banque Postale','BoursoBank','Revolut','American Express'];
    const DEF_CARDS = ['Compte principal','Compte secondaire','Compte courant','Carte différée'];
    const bankName = getConf('bank_'+i, DEF_BANKS[i]);
    const cardName = getConf('card_'+i, DEF_CARDS[i]);

    if (!isAmex) return `
      <div class="solde-card ${cls} fade">
        <div class="sc-bank">${editable(bankName,'bank_'+i)}</div>
        <div class="sc-name"><span class="sc-dot"></span>${editable(cardName,'card_'+i)}</div>
        <div class="sc-rows">
          <div class="sc-row"><span class="lbl">Solde début</span><span class="val-mono">${fmt(debut)}</span></div>
          <div class="sc-row"><span class="lbl">Revenus</span><span class="val-mono ${rev?'val-pos':''}">${rev?'+'+fmt(rev):'—'}</span></div>
          <div class="sc-row"><span class="lbl">Dépenses réelles</span><span class="val-mono val-neg">${dep?'−'+fmt(dep):'—'}</span></div>
        </div>
        <div class="sc-div"></div>
        <div class="sc-big"><span class="lbl">Prévu</span><span class="val val-muted mono">${fmt(prev)}</span></div>
        <div class="sc-big"><span class="lbl">Réel</span><span class="val val-pos mono">${fmt(reel)}</span></div>
      </div>`;
    else return `
      <div class="solde-card ${cls} fade">
        <div class="sc-bank">${editable(bankName,'bank_'+i)}</div>
        <div class="sc-name"><span class="sc-dot"></span>${editable(cardName,'card_'+i)}</div>
        <div class="sc-rows">
          <div class="sc-row"><span class="lbl">Dépenses du mois</span><span class="val-mono val-neg">${fmt(amex)}</span></div>
          <div class="sc-row"><span class="lbl">Prélèvement prévu</span><span class="val-mono val-warn">mois suivant</span></div>
        </div>
        <div class="amex-pill">⚠ À provisionner sur La Banque Postale</div>
      </div>`;
  }).join('');

  // KPIs
  const revTotal = getRevTotal();
  const depTotal = getTotalDep(moisIdx);
  const soldeGlobal = ['La Banque Postale','BoursoBank','Revolut']
    .reduce((a,c)=>a+getSoldeReel(moisIdx,c),0);
  const amexTotal = getAmex(moisIdx);
  const depPrev = COMPTES.reduce((a,c)=>a+getDepensesPrev(moisIdx,c),0);

  // Transactions table
  const txRows = txs.map((t,i) => {
    const grpObj = GROUPES.find(g=>g.code===t.groupe);
    const ecart = (t.prevu && t.reel) ? t.prevu - t.reel : null;
    return `
      <tr>
        <td class="td-date">${t.date||''}</td>
        <td class="td-label">${t.libelle||''}</td>
        <td><span class="badge ${COMPTE_CLS[t.compte]||''}">${t.compte||''}</span></td>
        <td><span class="badge ${grpObj?grpObj.cls:''}">${grpObj?grpObj.label:t.groupe||''}</span></td>
        <td style="color:var(--muted);font-size:12px">${t.categorie||''}</td>
        <td class="td-num">${t.prevu?fmt(t.prevu):'—'}</td>
        <td class="td-num">${t.reel?fmt(t.reel):'—'}</td>
        <td class="${ecartClass(ecart)}">${ecart!==null?fmtSign(ecart):'—'}</td>
        <td><button class="btn-del" onclick="delTx('${moisName}',${i})">✕</button></td>
      </tr>`;
  }).join('');

  const totalPrevu = txs.reduce((a,t)=>a+(+t.prevu||0),0);
  const totalReel  = txs.reduce((a,t)=>a+(+t.reel||0),0);
  const totalEcart = totalPrevu - totalReel;

  // Synthèse par groupe
  const synthRows = getGroupes().map(g => {
    const prev = txs.filter(t=>t.groupe===g.code).reduce((a,t)=>a+(+t.prevu||0),0);
    const reel = txs.filter(t=>t.groupe===g.code).reduce((a,t)=>a+(+t.reel||0),0);
    const maxVal = Math.max(prev, reel, 1);
    const pct = Math.min((reel/maxVal)*100, 100);
    const over = reel > prev && prev > 0;
    const barColor = over ? 'var(--neg)' : 'var(--postale)';
    if (!prev && !reel) return '';
    return `
      <div class="prog-row">
        <div class="prog-label"><span class="badge ${g.cls}">${g.label}</span></div>
        <div class="prog-bar-bg"><div class="prog-bar" style="width:${pct}%;background:${barColor}"></div></div>
        <div class="prog-vals">
          <span class="prog-prev">${fmt(prev)}</span>
          <span class="prog-real" style="color:${over?'var(--neg)':'var(--pos)'}">${fmt(reel)}</span>
        </div>
      </div>`;
  }).join('');

  // Formulaire ajout transaction
  const grpOptions = GROUPES.map(g=>`<option value="${g.code}">${g.label}</option>`).join('');
  const compteOptions = COMPTES.map(c=>`<option value="${c}">${c}</option>`).join('');

  return `
    <div class="sec-label">Soldes par compte</div>
    <div class="soldes-grid">${soldesHTML}</div>

    <div class="kpi-bar fade">
      <div class="kpi-item">
        <div class="kpi-lbl">${editable(getConf("kpi_rev","Revenus du mois"),"kpi_rev")}</div>
        <div class="kpi-val val-pos">${fmt(revTotal)}</div>
        <div class="kpi-sub">Prévu : ${fmt(revTotal)}</div>
      </div>
      <div class="kpi-item">
        <div class="kpi-lbl">${editable(getConf("kpi_dep","Dépenses totales"),"kpi_dep")}</div>
        <div class="kpi-val val-neg">${fmt(depTotal)}</div>
        <div class="kpi-sub">Prévu : ${fmt(depPrev)}</div>
      </div>
      <div class="kpi-item">
        <div class="kpi-lbl">${editable(getConf("kpi_sol","Solde global réel"),"kpi_sol")}</div>
        <div class="kpi-val val-pos">${fmt(soldeGlobal)}</div>
      </div>
      <div class="kpi-item" style="background:var(--amex-bg)">
        <div class="kpi-lbl" style="color:var(--warn)">Amex à provisionner</div>
        <div class="kpi-val val-warn">${fmt(amexTotal)}</div>
        <div class="kpi-sub" style="color:rgba(251,191,36,0.5)">Prélèvement mois suivant</div>
      </div>
    </div>

    ${amexTotal > 0 ? `<div class="amex-note">⚠ Les ${fmt(amexTotal)} Amex seront prélevés sur La Banque Postale le mois suivant — le solde réel affiché ne les inclut pas encore.</div>` : ''}

    <div class="sec-label">Ajouter une opération</div>
    <div class="add-section">
      <div class="add-form" id="addForm-${moisName}">
        <div class="form-group"><label class="form-label">Date</label><input type="text" id="f-date" placeholder="01/05"></div>
        <div class="form-group"><label class="form-label">Libellé</label><input type="text" id="f-libelle" placeholder="Ex : Loyer"></div>
        <div class="form-group"><label class="form-label">Compte</label><select id="f-compte">${compteOptions}</select></div>
        <div class="form-group"><label class="form-label">Groupe</label><select id="f-groupe" onchange="updateCats()">${grpOptions}</select></div>
        <div class="form-group"><label class="form-label">Catégorie</label><select id="f-categorie"></select></div>
        <div class="form-group"><label class="form-label">Prévu (€)</label><input type="number" id="f-prevu" placeholder="0"></div>
        <div class="form-group"><label class="form-label">Réel (€)</label><input type="number" id="f-reel" placeholder="0"></div>
        <button class="btn-add" onclick="addTx('${moisName}')">+ Ajouter</button>
      </div>
    </div>

    <div class="sec-label">Opérations du mois</div>
    <div class="tcard">
      <div class="tcard-header">
        <span class="tcard-title">Tableau de saisie — ${moisName} 2026</span>
        <span class="tcard-count">${txs.length} opération${txs.length!==1?'s':''}</span>
      </div>
      <table>
        <thead><tr>
          <th>Date</th><th>Libellé</th><th>Compte</th><th>Groupe</th><th>Catégorie</th>
          <th style="text-align:right">Prévu</th><th style="text-align:right">Réel</th>
          <th style="text-align:right">Écart</th><th></th>
        </tr></thead>
        <tbody>
          ${txRows || '<tr><td colspan="9" style="text-align:center;color:var(--dim);padding:24px;font-size:12px">Aucune opération ce mois — utilisez le formulaire ci-dessus</td></tr>'}
          ${txs.length ? `<tr class="total-row">
            <td colspan="5" style="text-align:right;color:var(--muted);font-size:12px">TOTAL</td>
            <td class="td-num">${fmt(totalPrevu)}</td>
            <td class="td-num">${fmt(totalReel)}</td>
            <td class="${ecartClass(totalEcart)}">${fmtSign(totalEcart)}</td>
            <td></td>
          </tr>` : ''}
        </tbody>
      </table>
    </div>

    ${synthRows ? `
    <div class="sec-label">Synthèse par groupe</div>
    <div class="tcard">
      <div class="tcard-header"><span class="tcard-title">Répartition des dépenses</span></div>
      ${synthRows}
    </div>` : ''}
  `;
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function updateCats() {
  const grp = document.getElementById('f-groupe') ? document.getElementById('f-groupe').value : null;
  if (!grp) return;
  const cats = getCats()[grp] || [];
  const sel = document.getElementById('f-categorie');
  if (sel) sel.innerHTML = cats.map(c=>`<option value="${c}">${c}</option>`).join('');
}

function addTx(moisName) {
  const date = document.getElementById('f-date').value;
  const libelle = document.getElementById('f-libelle').value;
  const compte = document.getElementById('f-compte').value;
  const groupe = document.getElementById('f-groupe').value;
  const categorie = document.getElementById('f-categorie').value;
  const prevu = parseFloat(document.getElementById('f-prevu').value) || 0;
  const reel = parseFloat(document.getElementById('f-reel').value) || 0;
  if (!libelle) return;
  if (!data.transactions[moisName]) data.transactions[moisName] = [];
  data.transactions[moisName].push({date,libelle,compte,groupe,categorie,prevu,reel});
  save(); showPage(moisName);
}

function delTx(moisName, idx) {
  data.transactions[moisName].splice(idx, 1);
  save(); showPage(moisName);
}

function updateRev(key, val) {
  data.revenus[key] = parseFloat(val) || 0;
  save();
}

function updateSolde(key, val) {
  data.soldes_debut.jan[key] = parseFloat(val) || 0;
  save();
}

}

function saveGroupes(g) { data.config = data.config||{}; data.config.groupes = g; save(); }
function saveCats(cats) { data.config = data.config||{}; data.config.categories = cats; save(); }

function addGroupe() {
  const label = document.getElementById('new-grp-label').value.trim();
  if (!label) return;
  const code = label.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]/g,'_');
  const clsList = ['b-logement','b-transport','b-alim','b-famille','b-sante','b-epargne','b-finances','b-bien','b-pro','b-autres','b-animaux','b-depenses'];
  const grps = getGroupes();
  const cls = clsList[grps.length % clsList.length];
  grps.push({label, code, cls});
  saveGroupes(grps);
  const cats = getCats(); cats[code] = []; saveCats(cats);
  document.getElementById('new-grp-label').value = '';
  showPage('settings');
}

function delGroupe(code) {
  if (!confirm('Supprimer ce groupe et toutes ses catégories ?')) return;
  const grps = getGroupes().filter(g => g.code !== code);
  saveGroupes(grps);
  const cats = getCats(); delete cats[code]; saveCats(cats);
  showPage('settings');
}

function renameGroupe(code) {
  const newLabel = document.getElementById('grp-rename-'+code).value.trim();
  if (!newLabel) return;
  const grps = getGroupes().map(g => g.code===code ? {...g, label:newLabel} : g);
  saveGroupes(grps);
  showPage('settings');
}

function addCat(code) {
  const inp = document.getElementById('new-cat-'+code);
  const val = inp.value.trim();
  if (!val) return;
  const cats = getCats();
  if (!cats[code]) cats[code] = [];
  if (!cats[code].includes(val)) { cats[code].push(val); saveCats(cats); }
  inp.value = '';
  showPage('settings');
}

function delCat(code, idx) {
  const cats = getCats();
  cats[code].splice(idx, 1);
  saveCats(cats);
  showPage('settings');
}

function renderSettings() {
  const grps = getGroupes();
  const cats = getCats();
  const revInputs = [
    ['salaire_yann','Salaire Yann'],['salaire_noemie','Salaire Noëmie'],
    ['caf','CAF'],['cmg','CMG'],['autres','Autres revenus']
  ].map(([k,l]) => `
    <div class="form-group">
      <label class="form-label">${l}</label>
      <input type="number" value="${data.revenus[k]||0}" onchange="updateRev('${k}',this.value)">
    </div>`).join('');

  const soldeInputs = [
    ['postale','La Banque Postale'],['bourso','BoursoBank'],['revolut','Revolut']
  ].map(([k,l]) => `
    <div class="form-group">
      <label class="form-label">Solde jan. — ${l}</label>
      <input type="number" value="${data.soldes_debut.jan[k]||0}" onchange="updateSolde('${k}',this.value)">
    </div>`).join('');

  const grpCards = grps.map(g => {
    const gcats = cats[g.code] || [];
    const catPills = gcats.map((cat,i) => `
      <span style="display:inline-flex;align-items:center;gap:5px;background:var(--surface3);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:12px;margin:3px">
        ${cat}
        <span onclick="delCat('${g.code}',${i})" style="cursor:pointer;color:var(--neg);font-size:10px;padding:0 2px;line-height:1" title="Supprimer">✕</span>
      </span>`).join('');

    return `
      <div class="tcard" style="margin-bottom:12px">
        <div class="tcard-header" style="gap:10px">
          <span class="badge ${g.cls}">${g.label}</span>
          <div style="display:flex;gap:8px;align-items:center;flex:1">
            <input id="grp-rename-${g.code}" type="text" placeholder="Renommer le groupe…" style="flex:1;font-size:12px">
            <button class="btn-add" style="padding:6px 12px;font-size:12px" onclick="renameGroupe('${g.code}')">Renommer</button>
            <button onclick="delGroupe('${g.code}')" style="background:transparent;border:1px solid rgba(248,113,113,0.3);color:var(--neg);padding:6px 10px;border-radius:var(--rs);font-size:12px;cursor:pointer">Supprimer</button>
          </div>
        </div>
        <div style="padding:12px 16px">
          <div style="margin-bottom:10px;min-height:32px">${catPills || '<span style="color:var(--dim);font-size:12px">Aucune catégorie</span>'}</div>
          <div style="display:flex;gap:8px">
            <input id="new-cat-${g.code}" type="text" placeholder="Nouvelle catégorie…" style="flex:1;font-size:12px"
              onkeydown="if(event.key==='Enter')addCat('${g.code}')">
            <button class="btn-add" style="padding:6px 12px;font-size:12px" onclick="addCat('${g.code}')">+ Ajouter</button>
          </div>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="sec-label">Revenus fixes mensuels</div>
    <div class="tcard" style="padding:20px;margin-bottom:20px">
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:14px">${revInputs}</div>
    </div>

    <div class="sec-label">Soldes de début — Janvier 2026</div>
    <div class="tcard" style="padding:20px;margin-bottom:20px">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">${soldeInputs}</div>
    </div>

    <div class="sec-label">Groupes & catégories</div>
    ${grpCards}

    <div class="tcard" style="padding:16px;margin-bottom:20px">
      <div style="font-size:12px;color:var(--muted);margin-bottom:10px;font-weight:500">Ajouter un nouveau groupe</div>
      <div style="display:flex;gap:8px">
        <input id="new-grp-label" type="text" placeholder="Nom du groupe…" style="flex:1"
          onkeydown="if(event.key==='Enter')addGroupe()">
        <button class="btn-add" onclick="addGroupe()">+ Créer le groupe</button>
      </div>
    </div>

    <div class="sec-label">Données</div>
    <div class="tcard" style="padding:16px;margin-bottom:20px">
      <div style="display:flex;gap:10px;align-items:center">
        <button class="btn-add" onclick="exportData()">💾 Exporter les données (JSON)</button>
        <label class="btn-add" style="cursor:pointer">
          📂 Importer des données
          <input type="file" accept=".json" style="display:none" onchange="importData(event)">
        </label>
        <button onclick="if(confirm('Effacer toutes les données ?')){localStorage.removeItem(\'budget2026\');location.reload()}"
          style="background:transparent;border:1px solid rgba(248,113,113,0.3);color:var(--neg);padding:8px 14px;border-radius:var(--rs);font-size:12px;cursor:pointer">
          🗑 Réinitialiser
        </button>
      </div>
    </div>
  `;
}

function exportData() {
  const a = document.createElement('a');
  a.href = 'data:application/json,' + encodeURIComponent(JSON.stringify(data, null, 2));
  a.download = 'budget_2026_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const imported = JSON.parse(ev.target.result);
      Object.assign(data, imported);
      save(); showPage('settings');
    } catch { alert('Fichier invalide'); }
  };
  reader.readAsText(file);
}

function renderMain() {
  const main = document.getElementById('mainContent');
  if (currentPage === 'annual') {
    main.innerHTML = renderAnnual();
  } else if (currentPage === 'settings') {
    main.innerHTML = renderSettings();
  } else {
    main.innerHTML = renderMonth(currentPage);
    setTimeout(updateCats, 50);
  }
}

// ── EDIT MODE ─────────────────────────────────────────────────────────────────
let editMode = false;

function toggleEditMode() {
  editMode = !editMode;
  const btn = document.getElementById('editModeBtn');
  btn.textContent = editMode ? '✅  Terminer' : '✏️  Mode édition';
  btn.className = 'edit-mode-btn' + (editMode ? ' on' : '');
  const hint = document.getElementById('editHint');
  hint.className = 'edit-hint' + (editMode ? ' show' : '');
  renderMain();
}

function getConf(key, fallback) {
  return (data.config && data.config[key]) ? data.config[key] : fallback;
}

function setConf(key, val) {
  data.config = data.config || {};
  data.config[key] = val;
  save();
}

function editable(val, key) {
  if (!editMode) return val;
  return `<span class="editable" onclick="startEdit(this,'${key}')">${val}</span>`;
}

function startEdit(el, key) {
  const cur = el.textContent;
  const inp = document.createElement('input');
  inp.className = 'editable-input';
  inp.value = cur;
  inp.style.fontSize = getComputedStyle(el).fontSize;
  inp.style.fontWeight = getComputedStyle(el).fontWeight;
  inp.style.color = getComputedStyle(el).color;
  inp.style.width = Math.max(cur.length * 9, 80) + 'px';
  el.replaceWith(inp);
  inp.focus(); inp.select();
  function commit() { setConf(key, inp.value.trim() || cur); renderMain(); }
  inp.onblur = commit;
  inp.onkeydown = e => { if(e.key==='Enter'){e.preventDefault();commit();} if(e.key==='Escape'){inp.value=cur;commit();} };
}

// ── INIT ──────────────────────────────────────────────────────────────────────

const syncBar = document.createElement('div');
syncBar.id = 'syncBar'; syncBar.className = 'sync-bar syncing';
document.body.appendChild(syncBar);
const syncDotEl = document.createElement('div');
syncDotEl.id = 'syncDot'; syncDotEl.className = 'sync-dot syncing';
document.body.appendChild(syncDotEl);

buildNav();
loadData(() => {
  renderMain();
});

// Inject floating buttons after render
const editBtn = document.createElement('button');
editBtn.id = 'editModeBtn';
editBtn.className = 'edit-mode-btn';
editBtn.textContent = '✏️  Mode édition';
editBtn.onclick = toggleEditMode;
document.body.appendChild(editBtn);

const hint = document.createElement('div');
hint.id = 'editHint';
hint.className = 'edit-hint';
hint.textContent = 'Cliquez sur un texte pointillé pour le modifier';
document.body.appendChild(hint);

</script>
</body>
