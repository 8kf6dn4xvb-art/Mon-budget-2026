// ── REVENUE TRANSACTIONS ──────────────────────────────────────────────────────
function addRevTx(moisName) {
  const rawDate2  = document.getElementById('rv-date').value;
  const date      = rawDate2 ? new Date(rawDate2).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}) : '';
  const libelle   = document.getElementById('rv-libelle').value.trim();
  const compte    = document.getElementById('rv-compte').value;
  const groupe    = document.getElementById('rv-groupe') ? document.getElementById('rv-groupe').value : '';
  const categorie = document.getElementById('rv-categorie') ? document.getElementById('rv-categorie').value : '';
  const prevu     = parseAmount(document.getElementById('rv-prevu') ? document.getElementById('rv-prevu').value : 0);
  const montant   = parseAmount(document.getElementById('rv-montant').value);
  if (!libelle) return;
  if (!data.revenus_tx) data.revenus_tx = {};
  if (!data.revenus_tx[moisName]) data.revenus_tx[moisName] = [];
  if (editingTx && editingTx.type === 'rev' && editingTx.moisName === moisName) {
    const realIdx = data.revenus_tx[moisName].indexOf(editingTx.originalRow);
    if (realIdx !== -1) {
      data.revenus_tx[moisName][realIdx] = {date, libelle, compte, groupe, categorie, prevu, montant, _rawDate: rawDate2};
    } else {
      data.revenus_tx[moisName].push({date, libelle, compte, groupe, categorie, prevu, montant, _rawDate: rawDate2});
    }
    editingTx = null;
  } else {
    if (editingTx && editingTx.type === 'rev') {
      if (editingTx.originalRow) delete editingTx.originalRow._editing;
      editingTx = null;
    }
    data.revenus_tx[moisName].push({date, libelle, compte, groupe, categorie, prevu, montant, _rawDate: rawDate2});
  }
  save(); showPage(moisName);
  setTimeout(() => {
    ['rv-date','rv-libelle','rv-prevu','rv-montant'].forEach(id => { const el = document.getElementById(id); if(el) el.value=''; });
    document.getElementById('rv-date')?.focus();
  }, 80);
}

function delRevTx(moisName, idx) {
  // idx est l'index dans les manuels filtrés — on retrouve l'index réel dans le tableau brut
  const allTxs = data.revenus_tx[moisName] || [];
  const manuals = allTxs.reduce((acc, t, realIdx) => {
    if (!t._isRecurrent) acc.push({ t, realIdx });
    return acc;
  }, []);
  const entry = manuals[idx];
  if (!entry) return;
  const { t, realIdx } = entry;

  const matchingRec = (data.recurrents?.revenus||[]).findIndex(r => r.libelle === t.libelle);
  toastConfirm(
    `Supprimer "${t.libelle}" des entrées${matchingRec>=0?' (⚠ existe aussi en récurrent)':''}?`,
    () => {
      data.revenus_tx[moisName].splice(realIdx, 1);
      if (matchingRec >= 0) {
        data.recurrents.revenus.splice(matchingRec, 1);
      }
      save(); showPage(moisName);
    }
  );
}

// ── RÉCURRENTS ────────────────────────────────────────────────────────────────
let editingRec = null;

function editRecurrent(type, idx) {
  const items = data.recurrents[type];
  const r = items[idx];
  if (!r) return;

  // Store snapshot and mark editing — no save/showPage to avoid double render
  items.forEach(x => delete x._editing);
  r._editing = true;
  editingRec = {type, idx};

  // Prefill form immediately (DOM already rendered)
  const prefix = type === 'revenus' ? 'rr' : 'rd';
  const dateEl = document.getElementById(prefix+'-date');
  const libEl  = document.getElementById(prefix+'-libelle');
  const cpEl   = document.getElementById(prefix+'-compte');
  const grpEl  = document.getElementById(prefix+'-groupe');
  const catEl  = document.getElementById(prefix+'-categorie');
  const mtEl   = document.getElementById(prefix+'-montant');

  if (dateEl) dateEl.value = r._rawDate || '';
  if (libEl)  libEl.value  = r.libelle  || '';
  if (cpEl)   cpEl.value   = r.compte   || '';
  if (grpEl)  { grpEl.value = r.groupe || ''; type==='revenus'?syncRrCats():syncRdCats(); }
  setTimeout(() => {
    if (catEl) catEl.value = r.categorie || '';
    if (mtEl)  mtEl.value  = r.montant   || 0;
    // Update button label
    const btn = document.querySelector(`[onclick="addRecurrent('${type}')"]`);
    if (btn) btn.textContent = 'Modifier';
  }, 50);

  // Highlight the row by re-rendering just the table body without full page reload
  const rows = document.querySelectorAll('tr');
  rows.forEach(row => {
    if (row.textContent.includes(r.libelle)) {
      row.style.background = 'rgba(79,142,247,0.08)';
      row.style.outline = '1px solid rgba(79,142,247,0.3)';
    }
  });

  // Scroll to form
  if (libEl) libEl.scrollIntoView({behavior:'smooth', block:'center'});
}

function addRecurrent(type) {
  const prefix = type === 'revenus' ? 'rr' : 'rd';
  const rawDate   = document.getElementById(prefix+'-date').value;
  const date      = rawDate ? new Date(rawDate).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}) : '';
  const libelle   = document.getElementById(prefix+'-libelle').value.trim();
  const compte    = document.getElementById(prefix+'-compte').value;
  const grpEl     = document.getElementById(prefix+'-groupe');
  const groupe    = grpEl ? grpEl.value : '';
  const catEl     = document.getElementById(prefix+'-categorie');
  const categorie = catEl ? catEl.value : '';
  const montant   = parseAmount(document.getElementById(prefix+'-montant').value);
  if (!libelle || !montant) { alert('Libellé et montant obligatoires'); return; }

  const freqEl = type === 'depenses' ? document.getElementById('rd-frequence') : null;
  const frequence = freqEl ? freqEl.value : 'mensuelle';
  const startMoisEl = document.getElementById('rd-startmois');
  const startMois = startMoisEl ? parseInt(startMoisEl.value) : 1;
  const entry = {date, libelle, compte, groupe, categorie, montant, frequence, _startMois: startMois, _rawDate: rawDate};

  if (editingRec && editingRec.type === type) {
    // Replace existing
    delete data.recurrents[type][editingRec.idx]._editing;
    data.recurrents[type][editingRec.idx] = entry;
    editingRec = null;
  } else {
    data.recurrents[type].push(entry);
  }
  save();
  editingRec = null;
  showPage('settings');
}

function delRecurrent(type, idx) {
  data.recurrents[type].splice(idx, 1);
  save();
  showPage('settings');
}

function updateRecurrentReal(moisName, type, recId, val, weekIdx) {
  const key = type === 'revenus' ? 'revenus_tx' : 'transactions';
  if (!data[key]) data[key] = {};
  if (!data[key][moisName]) data[key][moisName] = [];
  const wi = weekIdx !== undefined && weekIdx >= 0 ? weekIdx : undefined;
  const existing = data[key][moisName].find(t =>
    t._recId === recId && (wi === undefined ? !t._weekIdx && t._weekIdx !== 0 : t._weekIdx === wi)
  );
  if (existing) {
    if (type === 'revenus') existing.montant = parseAmount(val);
    else existing.reel = parseAmount(val);
  } else {
    const rec = data.recurrents[type][recId];
    const entry = {...rec, _recId: recId, _isRecurrent: true};
    if (wi !== undefined) entry._weekIdx = wi;
    if (type === 'revenus') entry.montant = parseAmount(val);
    else { entry.prevu = rec.montant; entry.reel = parseAmount(val); }
    data[key][moisName].push(entry);
  }
  save();
  renderMain();
}

function getCats() {
  const defaults = {
    Logement:['Loyer / Charges','Électricité / Eau / Gaz','Décorations & Équipement','Entretien / Réparations','Box/Internet'],
    Transport:['Carburant','Voiture / Scooter','Parking'],
    Alimentation:['Courses courantes','Courses exceptionnelles','Épicerie / Boulangerie','Restaurants'],
    Famille_et_Enfants:['Jimmy','Léon','Nounou','École / Cantine'],
    Animaux:['Chats'],
    Sante:['Médecin / Pharmacie','Mutuelles'],
    Bien_etre_Perso:['Coiffeur','Vêtements','Loisirs','Livres'],
    Epargne:['LDDS Yann','LDDS Noëmie','PEA Yann','PEA Noëmie','Assurance vie Yann','Assurance vie Noëmie','Assurance vie Jimmy','Assurance vie Léon','Livret A Jimmy','Livret A Léon','CTO','Épargne Espèces'],
    Finances_Obligations:['Crédits','Impôts','Assurances','Frais bancaires'],
    Depenses_perso:['Livres','Vêtements','Mobile','Soins & Beauté','Autres'],
    Depenses_perso_Yann:['Mobile','Vêtements','Nutrition & Sports'],
    Pro:['Frais de missions','Cantine boulot','Syndicat'],
    Loisirs:['Abonnement','Sports','Parc d\'attractions','Loisirs'],
    Autres:['Cadeaux','Dons','Divers','Hors Budget'],
    Auto_entreprise:['Terra Mate','Terra Nativa'],
    Revenus:['Salaire Yann','Salaire Nono','Aides sociales'],
  };
  const userCats = (data.config && data.config.categories) ? data.config.categories : {};
  const merged = Object.assign({}, defaults);
  // Merge user cats: add unique entries only (avoid duplicates)
  Object.keys(userCats).forEach(code => {
    if (!merged[code]) merged[code] = [];
    userCats[code].forEach(cat => {
      if (!merged[code].includes(cat)) merged[code].push(cat);
    });
  });
  return merged;
}

function saveGroupes(g) { data.config = data.config||{}; data.config.groupes = g; save(); }
function saveCats(cats) { data.config = data.config||{}; data.config.categories = cats; save(); }

function moveGroupe(idx, dir) {
  const grps = getGroupes();
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= grps.length) return;
  [grps[idx], grps[newIdx]] = [grps[newIdx], grps[idx]];
  saveGroupes(grps);
  showPage('settings');
}

function sortGroupesAlpha() {
  const grps = getGroupes();
  grps.sort((a, b) => a.label.localeCompare(b.label, 'fr'));
  saveGroupes(grps);
  showPage('settings');
}

function addGroupe() {
  const label = document.getElementById('new-grp-label').value.trim();
  if (!label) return;
  const code = label.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]/g,'_');
  const clsList = ['b-logement','b-transport','b-alim','b-famille','b-sante','b-epargne','b-finances','b-bien','b-pro','b-autres','b-animaux','b-depenses'];
  const grps = getGroupes();
  const cls = clsList[grps.length % clsList.length];
  grps.push({label, code, cls});
  saveGroupes(grps);
  const cats = getCats(); cats[code] = []; saveCats(cats);
  document.getElementById('new-grp-label').value = '';
  showPage('settings');
}

function delGroupe(code) {
  toastConfirm('Supprimer ce groupe et toutes ses catégories ?', () => {
    const grps = getGroupes().filter(g => g.code !== code);
    saveGroupes(grps);
    const cats = getCats(); delete cats[code]; saveCats(cats);
    showPage('settings');
  });
}

function renameGroupe(code) {
  const newLabel = document.getElementById('grp-rename-'+code).value.trim();
  if (!newLabel) return;
  const grps = getGroupes().map(g => g.code===code ? {...g, label:newLabel} : g);
  saveGroupes(grps);
  showPage('settings');
}

function addCat(code) {
  const inp = document.getElementById('new-cat-'+code);
  const val = inp.value.trim();
  if (!val) return;
  const cats = getCats();
  if (!cats[code]) cats[code] = [];
  if (!cats[code].includes(val)) { cats[code].push(val); saveCats(cats); }
  inp.value = '';
  showPage('settings');
}

function delCat(code, idx) {
  const cats = getCats();
  cats[code].splice(idx, 1);
  saveCats(cats);
  showPage('settings');
}

function importCSV(event, moisName) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const lines = ev.target.result.split('\n').filter(l => l.trim());
    if (lines.length < 2) { alert('Fichier CSV vide ou invalide'); return; }
    const sep = lines[0].includes(';') ? ';' : ',';
    const headers = lines[0].split(sep).map(h => h.trim().toLowerCase().replace(/['"]/g,''));
    
    // Try to detect columns
    const findCol = (...names) => {
      for (const n of names) {
        const idx = headers.findIndex(h => h.includes(n));
        if (idx !== -1) return idx;
      }
      return -1;
    };
    
    const dateCol    = findCol('date');
    const labelCol   = findCol('libellé','libelle','label','intitulé','description','opération');
    const debitCol   = findCol('débit','debit','montant débit','sortie');
    const creditCol  = findCol('crédit','credit','montant crédit','entrée');
    const montantCol = findCol('montant','amount');

    if (dateCol === -1 || labelCol === -1) {
      alert('Colonnes Date et Libellé introuvables dans ce CSV.\nEn-têtes détectés : ' + headers.join(', '));
      return;
    }

    let imported = 0, skipped = 0;
    const newTx = [];
    const newRev = [];

    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(sep).map(c => c.trim().replace(/['"]/g,''));
      if (cols.length < 2) continue;
      
      const rawDate = cols[dateCol] || '';
      // Parse date formats: DD/MM/YYYY or YYYY-MM-DD
      let dateObj;
      if (rawDate.includes('/')) {
        const parts = rawDate.split('/');
        if (parts.length === 3) {
          dateObj = parts[0].length === 4 
            ? new Date(parts[0], parts[1]-1, parts[2])
            : new Date(parts[2], parts[1]-1, parts[0]);
        }
      } else if (rawDate.includes('-')) {
        dateObj = new Date(rawDate);
      }
      const date = dateObj ? dateObj.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}) : rawDate;
      const libelle = cols[labelCol] || '';
      
      let montant = 0;
      let isCredit = false;
      
      if (debitCol !== -1 && creditCol !== -1) {
        const debit  = parseAmount(cols[debitCol]);
        const credit = parseAmount(cols[creditCol]);
        if (credit > 0) { montant = credit; isCredit = true; }
        else if (debit > 0) { montant = debit; isCredit = false; }
        else continue;
      } else if (montantCol !== -1) {
        montant = parseAmount(cols[montantCol]);
        isCredit = montant > 0;
        montant = Math.abs(montant);
      } else { skipped++; continue; }

      if (!libelle || !montant) { skipped++; continue; }

      if (isCredit) {
        newRev.push({date, libelle, compte:'La Banque Postale', groupe:'', categorie:'', prevu:0, montant, _rawDate: rawDate});
      } else {
        newTx.push({date, libelle, compte:'La Banque Postale', groupe:'Autres', categorie:'Divers', prevu:0, reel:montant, _rawDate: rawDate});
      }
      imported++;
    }

    if (!data.transactions[moisName]) data.transactions[moisName] = [];
    if (!data.revenus_tx[moisName]) data.revenus_tx[moisName] = [];
    data.transactions[moisName].push(...newTx);
    data.revenus_tx[moisName].push(...newRev);
    save();
    alert(`✅ ${imported} opérations importées${skipped ? ' (' + skipped + ' ignorées)' : ''}.\nPense à vérifier et catégoriser les lignes importées.`);
    showPage(moisName);
  };
  reader.readAsText(file, 'UTF-8');
}

function addPetiteMonnaie(moisName) {
  const val = parseAmount(document.getElementById('pm-add').value);
  if (!val) return;
  if (!data.petite_monnaie) data.petite_monnaie = {};
  (data.petite_monnaie||{})[moisName] = ((data.petite_monnaie||{})[moisName] || 0) + val;
  // Also add as a transaction on Revolut
  if (!data.transactions[moisName]) data.transactions[moisName] = [];
  data.transactions[moisName].push({
    date: new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}),
    libelle: '🪙 Petite monnaie Revolut',
    compte: 'Revolut',
    groupe: 'Autres',
    categorie: 'Arrondi',
    prevu: 0,
    reel: val,
    _rawDate: new Date().toISOString().split('T')[0]
  });
  save(); showPage(moisName);
}

function resetPetiteMonnaie(moisName) {
  toastConfirm('Remettre la petite monnaie à 0 pour ce mois ?', () => {
    (data.petite_monnaie||{})[moisName] = 0;
    data.transactions[moisName] = (data.transactions[moisName]||[])
      .filter(t => t.libelle !== '🪙 Petite monnaie Revolut');

}

function confirmAmexPrelevement(moisName, moisPrev, montantPrevu, reelVal) {
  const libelle = `Prélèvement Amex (${moisPrev})`;
  if (!data.transactions[moisName]) data.transactions[moisName] = [];
  const existing = data.transactions[moisName].find(t => t.libelle === libelle && !t._isRecurrent);
  const val = parseAmount(reelVal) || montantPrevu;
  const entry = {
    date: `30/${String(MOIS.indexOf(moisName)+1).padStart(2,'0')}`,
    _rawDate: `2026-${String(MOIS.indexOf(moisName)+1).padStart(2,'0')}-30`,
    libelle,
    compte: 'La Banque Postale',
    groupe: 'Finances_Obligations',
    categorie: 'Crédits',
    prevu: montantPrevu,
    reel: val,
    _amexAuto: true,
  };
  if (existing) {
    const idx = data.transactions[moisName].indexOf(existing);
    data.transactions[moisName][idx] = entry;
  } else {
    data.transactions[moisName].push(entry);
  }
  save(); renderMain();
}

function delAmexPrelevement(moisName, moisPrev) {
  const libelle = `Prélèvement Amex (${moisPrev})`;
  if (!data.transactions[moisName]) return;
  data.transactions[moisName] = data.transactions[moisName].filter(t => t.libelle !== libelle);
  save(); renderMain();
}

function addVirement(moisName) {
  const rawDate = document.getElementById('vir-date').value;
  const date    = rawDate ? new Date(rawDate).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}) : '';
  const libelle = document.getElementById('vir-libelle').value || 'Virement';
  const de      = document.getElementById('vir-de').value;
  const vers    = document.getElementById('vir-vers').value;
  const montant = parseAmount(document.getElementById('vir-montant').value);
  if (!montant || de === vers) { alert(de===vers?'Les deux comptes doivent être différents':'Montant obligatoire'); return; }
  if (!data.virements) data.virements = {};
  if (!(data.virements||{})[moisName]) (data.virements||{})[moisName] = [];
  (data.virements||{})[moisName].push({date, libelle, de, vers, montant});
  save(); showPage(moisName);
}

function delVirement(moisName, idx) {
  (data.virements||{})[moisName].splice(idx, 1);
  save(); showPage(moisName);
}

function getLastSoldeFinMois(id) {
  const soldes = data.epargne.soldes[String(id)] || data.epargne.soldes[id] || {};
  const activeM = MOIS.filter(m=>isMonthActive(m));
  for (let i = activeM.length-1; i >= 0; i--) {
    const s = soldes[activeM[i]];
    if (s && (s.fin !== undefined || s.debut !== undefined)) {
      return s.fin !== undefined ? s.fin : s.debut;
    }
    // backward compat: old format was a number
    if (typeof s === 'number') return s;
  }
  return 0;
}

function getLastSoldeEpargne(id) {
  const soldes = data.epargne.soldes[String(id)] || data.epargne.soldes[id] || {};
  const activeM = MOIS.filter(m=>isMonthActive(m));
  let bestVal = null;
  for (let i = 0; i < activeM.length; i++) {
    const m = activeM[i];
    const s = soldes[m];
    if (s === undefined || s === null) continue;
    // Legacy: raw number
    if (typeof s === 'number') {
      if (s !== 0) bestVal = s;
      continue;
    }
    // New format: {debut, fin}
    if (typeof s === 'object') {
      const hasFin   = s.fin   !== undefined && s.fin   !== '' && s.fin   !== null && +s.fin   !== 0;
      const hasDebut = s.debut !== undefined && s.debut !== '' && s.debut !== null && +s.debut !== 0;
      if (hasFin)   bestVal = +s.fin;
      else if (hasDebut) bestVal = +s.debut;
      // Zero values are ignored — they mean "not yet filled"
    }
  }
  return bestVal !== null ? bestVal : 0;
}

function getTotalEpargne() {
  return (data.epargne.comptes||[]).reduce((a,c)=>a+getLastSoldeEpargne(c.id),0);
}

function renderEpargne() {
  if (!data.epargne) data.epargne = {comptes:[], soldes:{}};
  const comptes = data.epargne.comptes||[];
  const activeM = MOIS.filter(m=>isMonthActive(m));
  if (!data.epargne) data.epargne = {comptes:[], soldes:{}};
  const total = getTotalEpargne();

  const compteCards = comptes.map((cp,ci) => {
    const lastSolde = getLastSoldeEpargne(cp.id);
    const activeM2 = MOIS.filter(m=>isMonthActive(m));
    let progression = null;
    for (let mi = activeM2.length-1; mi >= 0; mi--) {
      const mData = (data.epargne.soldes[String(cp.id)]||data.epargne.soldes[cp.id]||{})[activeM2[mi]] || {};
      if (typeof mData === 'object' && mData.debut !== undefined && mData.fin !== undefined) {
        progression = mData.fin - mData.debut; break;
      }
    }
    const color = CHART_COLORS[ci % CHART_COLORS.length];

    const soldeInputs = activeM.map(m => {
      const mData = (data.epargne.soldes[String(cp.id)]||data.epargne.soldes[cp.id]||{})[m] || {};
      const vDebut = typeof mData === 'number' ? mData : (mData.debut !== undefined && mData.debut !== '' ? +mData.debut || '' : '');
      const vFin   = typeof mData === 'number' ? '' : (mData.fin !== undefined && mData.fin !== '' ? +mData.fin || '' : '');
      const prog   = (vDebut !== '' && vFin !== '') ? vFin - vDebut : null;
      const pc = prog === null ? '' : prog >= 0 ? 'var(--pos)' : 'var(--neg)';
      return `
        <div style="display:flex;flex-direction:column;gap:3px;min-width:88px">
          <div style="font-size:10px;color:var(--muted);text-align:center;font-weight:500">${m.slice(0,3)}</div>
          <input type="number" step="0.01" value="${vDebut}" placeholder="Début"
            style="width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:11px;text-align:right;padding:4px 6px;border-radius:5px;outline:none"
            onblur="setSoldeEpargne('${cp.id}','${m}','debut',this.value)"
            onkeydown="if(event.key==='Enter')this.blur()">
          <input type="number" step="0.01" value="${vFin}" placeholder="Fin"
            style="width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:11px;text-align:right;padding:4px 6px;border-radius:5px;outline:none"
            onblur="setSoldeEpargne('${cp.id}','${m}','fin',this.value)"
            onkeydown="if(event.key==='Enter')this.blur()">
          ${prog !== null ? `<div style="font-size:10px;font-weight:600;text-align:center;color:${pc}">${prog>=0?'+':''}${prog.toLocaleString('fr-FR',{maximumFractionDigits:0})}€</div>` : '<div style="height:16px"></div>'}
        </div>`;
    }).join('');

    return `
    <div style="background:var(--surface);border:1px solid var(--border);border-left:3px solid ${color};border-radius:var(--r);padding:14px 18px;margin-bottom:10px">

        <div style="flex:1;min-width:0">
          <div style="font-size:10px;color:var(--muted);margin-bottom:2px">
            ${cp.type}${cp.organisme?` · <span style="color:var(--postale)">${cp.organisme}</span>`:''}
            ${cp.detenteur?`<span style="margin-left:6px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:1px 7px;font-size:9px;color:var(--text)">${cp.detenteur}</span>`:''}
          </div>
          <div contenteditable="false"
            onclick="this.contentEditable='true';this.focus()"

            style="font-size:14px;font-weight:600;outline:none;border-bottom:1px dashed transparent;cursor:text;transition:border-color .15s;display:inline-block"
            onfocus="this.style.borderBottomColor='rgba(255,255,255,0.3)'"
            onmouseout="if(document.activeElement!==this)this.style.borderBottomColor='transparent'"

        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:10px;color:var(--muted)">Solde actuel</div>
          <div style="font-family:'DM Mono',monospace;font-size:18px;font-weight:700;color:${lastSolde<0?'var(--neg)':'var(--pos)'}">${fmt(lastSolde)}</div>

        <button onclick="delEpargneCompte(${cp.id})" style="background:transparent;border:1px solid rgba(248,113,113,0.25);color:var(--neg);padding:4px 8px;border-radius:var(--rs);font-size:11px;cursor:pointer;flex-shrink:0">✕</button>
      </div>

            <div style="font-size:9px;color:var(--dim);text-align:right">Fin</div>

  const personTotals = ['Noëmie','Yann','Jimmy','Léon','Commun'].map(p => ({
    name: p,
    total: comptes.filter(cp=>(cp.detenteur||'Commun')===p).reduce((a,cp)=>a+getLastSoldeEpargne(cp.id),0),
    count: comptes.filter(cp=>(cp.detenteur||'Commun')===p).length
  })).filter(pt => pt.count > 0);

  return `
    <div style="margin-bottom:20px">
      <div style="display:flex;align-items:baseline;gap:16px;margin-bottom:14px;flex-wrap:wrap">
        <div>
          <div style="font-size:10px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em">Total épargne & investissement</div>
          <div style="font-family:'DM Mono',monospace;font-size:28px;font-weight:700;color:var(--pos)">${fmt(total)}</div>
        </div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        ${personTotals.map(pt=>`
          <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:10px 16px;min-width:130px">
            <div style="font-size:10px;color:var(--muted);margin-bottom:3px">${pt.name}</div>
            <div style="font-family:'DM Mono',monospace;font-size:16px;font-weight:600;color:var(--pos)">${fmt(pt.total)}</div>
          </div>`).join('')}
      </div>
      ${comptes.length ? `
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-top:14px">
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Évolution du patrimoine total</div>
        <canvas id="chart-ep-patrimoine" height="120"></canvas>
      </div>` : ''}
    </div>

    ${comptes.length ? `
    <div style="display:flex;flex-direction:column;gap:14px;margin-bottom:20px">
      ${['Noëmie','Yann','Jimmy','Léon','Commun'].map(p => {
        const pid = 'ep-pie-'+p.replace(/[^a-zA-Z]/g,'');
        const pComptes = comptes.filter(cp=>(cp.detenteur||'Commun')===p);
        if (!pComptes.length) return '';
        const pTotal = pComptes.reduce((a,cp)=>a+getLastSoldeEpargne(cp.id),0);
        const pLeg = pComptes.map((cp,i)=>`<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-top:3px"><div style="width:7px;height:7px;border-radius:50%;background:${CHART_COLORS[i%CHART_COLORS.length]};flex-shrink:0"></div><span>${cp.nom} <span style="color:var(--text);font-family:'DM Mono',monospace">${fmt(getLastSoldeEpargne(cp.id))}</span></span></div>`).join('');
        const lineId = 'ep-line-'+p.replace(/[^a-zA-Z]/g,'');
        return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:200px 1fr;gap:20px">

            <canvas id="${lineId}" height="160"></canvas>

        </div>`;

    <div class="sec-label">Comptes épargne & investissement</div>

// ── PAGE CRÉDITS ──────────────────────────────────────────────────────────────
function addCredit() {
  const nom       = document.getElementById('cr-nom').value.trim();
  const organisme = document.getElementById('cr-organisme').value.trim();
  const total     = parseAmount(document.getElementById('cr-total').value);
  const mensualite= parseAmount(document.getElementById('cr-mensualite').value);
  const debut     = document.getElementById('cr-debut').value;
  const fin       = document.getElementById('cr-fin').value;
  const compte    = document.getElementById('cr-compte').value;
  if (!nom || !total || !mensualite) { alert('Nom, montant et mensualité obligatoires'); return; }
  const capitalRestant = total - (data.credits||[]).filter(cr=>cr.nom===nom).length * mensualite;
  data.credits.push({id:Date.now(), nom, organisme, total, mensualite, debut, fin, compte,
    rembourse: 0});
  save(); showPage('credits');
}

function delCredit(id) {
  toastConfirm('Supprimer ce crédit ?', () => {
    data.credits = data.credits.filter(c=>c.id!==id);
    save(); showPage('credits');
  });
}

function updateCredit(id, field, val) {
  const cr = data.credits.find(c=>c.id===id);
  if (cr) { cr[field] = field==='nom'||field==='organisme'||field==='debut'||field==='fin'||field==='compte' ? val : parseAmount(val); save(); }
}

function renderCreditsCharts() {
  const credits = data.credits||[];
  if (!credits.length) return;

  destroyChart('cr-bar');
  const bar = document.getElementById('chart-cr-bar');
  if (bar) {
    chartInstances['cr-bar'] = new Chart(bar, {
      type:'bar',
      data:{
        labels: credits.map(c=>c.nom),
        datasets:[
          {label:'Remboursé',data:credits.map(c=>+c.rembourse||0),backgroundColor:'rgba(52,211,153,0.8)',borderRadius:4,borderSkipped:false},
          {label:'Restant',data:credits.map(c=>Math.max(0,(+c.total||0)-(+c.rembourse||0))),backgroundColor:'rgba(248,113,113,0.6)',borderRadius:4,borderSkipped:false},
        ]
      },
      options:{responsive:true,
        plugins:{legend:{labels:{color:'#7c8299',font:{size:11},boxWidth:10}},
          tooltip:{callbacks:{label:ctx=>` ${ctx.dataset.label} : ${fmt(ctx.raw)}`},
            backgroundColor:'rgba(24,28,39,0.95)',titleColor:'#e8eaf0',bodyColor:'#7c8299',borderColor:'rgba(255,255,255,0.07)',borderWidth:1}},
        scales:{
          x:{stacked:true,ticks:{color:'#7c8299'},grid:{display:false},border:{display:false}},
          y:{stacked:true,ticks:{color:'#7c8299',callback:v=>fmt(v)},grid:{color:'rgba(255,255,255,0.05)'},border:{display:false}}
        }
      }
    });
  }
}

      <div style="margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:4px">
          <span>Remboursement</span>
          <span>${pct}% · ${moisRestants} mois restants</span>
        </div>
        <div style="height:8px;background:var(--surface2);border-radius:4px;overflow:hidden">
          <div style="height:100%;border-radius:4px;width:${pct}%;background:${pct>=100?'var(--pos)':pct>50?'var(--postale)':'var(--warn)'}"></div>

function exportData() {
  const a = document.createElement('a');
  a.href = 'data:application/json,' + encodeURIComponent(JSON.stringify(data, null, 2));
  a.download = 'budget_2026_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const imported = JSON.parse(ev.target.result);
      Object.assign(data, imported);
      save(); showPage('settings');
    } catch { alert('Fichier invalide'); }
  };
  reader.readAsText(file);
}

function renderMain() {
  const main = document.getElementById('mainContent');
  if (!main) return;
  if (currentPage === 'annual') {
    main.innerHTML = renderAnnual();
  } else if (currentPage === 'settings') {
    main.innerHTML = renderSettings();
    setTimeout(() => { syncRrCats(); syncRdCats(); }, 50);
  } else if (currentPage === 'epargne') {
    main.innerHTML = renderEpargne();
    setTimeout(renderEpargneCharts, 150);
  } else if (currentPage === 'credits') {
    main.innerHTML = renderCredits();
    setTimeout(renderCreditsCharts, 150);
  } else {
    main.innerHTML = renderMonth(currentPage);
    setTimeout(() => {
      updateCats();
      // Pre-fill date fields with today
      const today = new Date().toISOString().split('T')[0];
      // Init all category selects with correct options
      updateCats();
      updateRevCats();
      syncRrCats();
      syncRdCats();
      ['f-date','rv-date'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = today;
      });
    }, 50);
  }
  setTimeout(initScrollHints, 200);
}

// ── EDIT MODE ─────────────────────────────────────────────────────────────────
let editMode = false;

function toggleEditMode() {
  editMode = !editMode;
  const btn = document.getElementById('editModeBtn');
  btn.textContent = editMode ? '✅  Terminer' : '✏️  Mode édition';
  btn.className = 'edit-mode-btn' + (editMode ? ' on' : '');
  const hint = document.getElementById('editHint');
  hint.className = 'edit-hint' + (editMode ? ' show' : '');
  renderMain();
}

function getConf(key, fallback) {
  return (data.config && data.config[key]) ? data.config[key] : fallback;
}

function setConf(key, val) {
  data.config = data.config || {};
  data.config[key] = val;
  save();
}

function editable(val, key) {
  if (!editMode) return val;
  return `<span class="editable" onclick="startEdit(this,'${key}')">${val}</span>`;
}

function startEdit(el, key) {
  const cur = el.textContent;
  const inp = document.createElement('input');
  inp.className = 'editable-input';
  inp.value = cur;
  inp.style.fontSize = getComputedStyle(el).fontSize;
  inp.style.fontWeight = getComputedStyle(el).fontWeight;
  inp.style.color = getComputedStyle(el).color;
  inp.style.width = Math.max(cur.length * 9, 80) + 'px';
  el.replaceWith(inp);
  inp.focus(); inp.select();
  function commit() { setConf(key, inp.value.trim() || cur); renderMain(); }
  inp.onblur = commit;
  inp.onkeydown = e => { if(e.key==='Enter'){e.preventDefault();commit();} if(e.key==='Escape'){inp.value=cur;commit();} };
}

// ── INIT ──────────────────────────────────────────────────────────────────────
// ── INIT ─────────────────────────────────────────────────────────────────────
// Inject sync UI immediately
const syncBar = document.createElement('div');
syncBar.id = 'syncBar'; syncBar.className = 'sync-bar syncing';
document.body.appendChild(syncBar);
const syncDotEl = document.createElement('div');
syncDotEl.id = 'syncDot'; syncDotEl.className = 'sync-dot syncing';
document.body.appendChild(syncDotEl);

buildNav();
loadData(() => {
  renderMain();
  initScrollHints();
});

function initScrollHints() {
  document.querySelectorAll('.tcard').forEach(card => {
    const table = card.querySelector('table');
    if (!table) return;
    if (card.querySelector('.tcard-scroll-wrap')) return; // already wrapped
    const wrap = document.createElement('div');
    wrap.className = 'tcard-scroll-wrap';
    wrap.style.overflowX = 'auto';
    wrap.style.webkitOverflowScrolling = 'touch';
    table.parentNode.insertBefore(wrap, table);
    wrap.appendChild(table);
    wrap.addEventListener('scroll', () => {
      const atEnd = wrap.scrollLeft + wrap.clientWidth >= wrap.scrollWidth - 4;
      wrap.classList.toggle('scrolled-end', atEnd);
    }, {passive:true});
    // Init state
    if (wrap.scrollWidth <= wrap.clientWidth) wrap.classList.add('scrolled-end');
  });
}


// Inject floating buttons after render
const editBtn = document.createElement('button');
editBtn.id = 'editModeBtn';
editBtn.className = 'edit-mode-btn';
editBtn.textContent = '✏️  Mode édition';
editBtn.onclick = toggleEditMode;
document.body.appendChild(editBtn);

const hint = document.createElement('div');
hint.id = 'editHint';
hint.className = 'edit-hint';
hint.textContent = 'Cliquez sur un texte pointillé pour le modifier';
document.body.appendChild(hint);
