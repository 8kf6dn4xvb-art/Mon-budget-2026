<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pilotage Budgétaire 2026</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget 2026">
<meta name="theme-color" content="#0f1117">
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;Budget 2026&quot;,&quot;short_name&quot;:&quot;Budget&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#0f1117&quot;,&quot;theme_color&quot;:&quot;#1B3A5C&quot;}">
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f1117; --surface:#181c27; --surface2:#1e2333; --surface3:#242840;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.13);
  --text:#e8eaf0; --muted:#7c8299; --dim:#4a5068;
  --postale:#4f8ef7; --postale-bg:rgba(79,142,247,0.12); --gold:#d4af37; --gold-bg:rgba(212,175,55,0.08);
  --bourso:#34d399;  --bourso-bg:rgba(52,211,153,0.12);
  --revolut:#a78bfa; --revolut-bg:rgba(167,139,250,0.12);
  --amex:#fbbf24;    --amex-bg:rgba(251,191,36,0.12);
  --pos:#34d399; --neg:#f87171; --warn:#fbbf24;
  --r:14px; --rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.mono{font-family:'DM Mono',monospace}

/* HEADER */
.header{background:var(–surface);border-bottom:1px solid var(–border);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header-left{display:flex;align-items:center;gap:14px}
.logo{width:30px;height:30px;background:linear-gradient(135deg,#4f8ef7,#a78bfa);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff}
.header h1{font-size:15px;font-weight:500;letter-spacing:-.01em}
.header h1 span{color:var(–muted);font-weight:400}
.month-nav{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.month-btn{background:transparent;border:1px solid var(–border);color:var(–muted);padding:5px 11px;border-radius:var(–rs);font-family:‘DM Sans’,sans-serif;font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap}
.month-btn:hover{border-color:var(–border2);color:var(–text)}
.month-btn.active{background:#d4af37;border-color:#d4af37;color:#0d0f1a;font-weight:700}
.nav-sep{display:flex;align-items:center;gap:4px}
.annual-btn{background:transparent;border:1px solid rgba(167,139,250,0.4);color:var(–revolut);padding:5px 13px;border-radius:var(–rs);font-family:‘DM Sans’,sans-serif;font-size:12px;cursor:pointer;transition:all .15s}
.annual-btn:hover,.annual-btn.active{background:var(–revolut);border-color:var(–revolut);color:#fff}

/* MAIN */
.main{padding:24px 28px;max-width:1440px;margin:0 auto}
.page{display:none}.page.active{display:block}

/* SECTION LABEL */
.sec-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#d4af37;margin-bottom:14px;margin-top:28px;display:flex;align-items:center;gap:10px;padding:0}
.sec-label:first-child{margin-top:0}
.sec-label::after{content:’’;flex:1;height:1px;background:linear-gradient(90deg,rgba(212,175,55,0.4),transparent)}

/* SOLDES GRID */
.soldes-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:20px}
.solde-card{background:var(–surface);border:1px solid var(–border);border-radius:var(–r);padding:18px 20px;position:relative;overflow:hidden;transition:border-color .2s}
.solde-card::before{content:’’;position:absolute;top:0;left:0;right:0;height:2px}
.sc-postale::before{background:var(–postale)}
.sc-bourso::before{background:var(–bourso)}
.sc-revolut::before{background:var(–revolut)}
.sc-amex::before{background:var(–amex)}
.sc-bank{font-size:11px;color:var(–muted);margin-bottom:3px}
.sc-name{font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.sc-dot{width:7px;height:7px;border-radius:50%}
.sc-postale .sc-dot{background:var(–postale)}
.sc-bourso  .sc-dot{background:var(–bourso)}
.sc-revolut .sc-dot{background:var(–revolut)}
.sc-amex    .sc-dot{background:var(–amex)}
.sc-rows{display:flex;flex-direction:column;gap:5px}
.sc-row{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.sc-row .lbl{color:var(–muted)}
.sc-div{height:1px;background:var(–border);margin:8px 0}
.sc-big{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.sc-big .lbl{font-size:12px;color:var(–muted)}
.sc-big .val{font-size:19px;font-weight:600;font-family:‘DM Mono’,monospace}
.val-pos{color:var(–pos)}
.val-neg{color:var(–neg)}
.val-warn{color:var(–warn)}
.val-muted{color:var(–muted)}
.val-mono{font-family:‘DM Mono’,monospace;font-size:12px}
.amex-pill{display:inline-flex;align-items:center;gap:5px;background:var(–amex-bg);color:var(–warn);border:1px solid rgba(251,191,36,0.2);border-radius:6px;padding:4px 9px;font-size:11px;font-weight:500;margin-top:10px}

/* KPI BAR */
.kpi-bar{background:var(–surface);border:1px solid var(–border);border-radius:var(–r);display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:14px}
.kpi-item{padding:16px 20px;border-right:1px solid var(–border)}
.kpi-item:last-child{border-right:none}
.kpi-lbl{font-size:11px;color:var(–muted);margin-bottom:6px}
.kpi-val{font-family:‘DM Mono’,monospace;font-size:22px;font-weight:500;letter-spacing:-.02em}
.kpi-sub{font-size:11px;color:var(–dim);margin-top:3px}

/* AMEX NOTE */
.amex-note{background:rgba(251,191,36,0.07);border:1px solid rgba(251,191,36,0.18);border-radius:var(–rs);padding:10px 16px;font-size:12px;color:var(–warn);margin-bottom:20px;display:flex;align-items:center;gap:8px}

/* TABLE CARD */
.tcard{background:var(–surface);border:1px solid var(–border);border-radius:var(–r);overflow:hidden;margin-bottom:20px}
.tcard-header{padding:14px 18px;border-bottom:1px solid var(–border);display:flex;align-items:center;justify-content:space-between}
.tcard-title{font-size:14px;font-weight:700;color:#d4af37}
.tcard-count{background:var(–surface2);border:1px solid var(–border);border-radius:20px;padding:2px 10px;font-size:11px;color:var(–muted);font-family:‘DM Mono’,monospace}
/* Scroll-hint : dégradé droit sur les tableaux scrollables */
.tcard-scroll-wrap{position:relative}
.tcard-scroll-wrap::after{content:’’;position:absolute;top:0;right:0;bottom:0;width:40px;background:linear-gradient(to right,transparent,var(–surface) 85%);pointer-events:none;opacity:1;transition:opacity .3s}
.tcard-scroll-wrap.scrolled-end::after{opacity:0}
table{width:100%;border-collapse:collapse}
thead th{padding:9px 14px;font-size:10px;font-weight:500;color:var(–dim);text-align:left;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(–border);background:var(–surface2)}
tbody tr{border-bottom:1px solid var(–border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,0.02)}
tbody td{padding:10px 14px;font-size:13px;vertical-align:middle}
.td-date{font-family:‘DM Mono’,monospace;font-size:12px;color:var(–muted)}
.td-label{font-weight:400}
.td-num{font-family:‘DM Mono’,monospace;font-size:12px;text-align:right}
.td-ecart-pos{color:var(–pos);font-family:‘DM Mono’,monospace;font-size:12px;text-align:right}
.td-ecart-neg{color:var(–neg);font-family:‘DM Mono’,monospace;font-size:12px;text-align:right}
.td-ecart-zero{color:var(–dim);font-family:‘DM Mono’,monospace;font-size:12px;text-align:right}
.total-row td{background:var(–surface2);font-weight:600;font-size:13px;border-top:1px solid var(–border2)!important}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:500;white-space:nowrap}
.b-postale{background:var(–postale-bg);color:var(–postale)}
.b-bourso{background:var(–bourso-bg);color:var(–bourso)}
.b-revolut{background:var(–revolut-bg);color:var(–revolut)}
.b-amex{background:var(–amex-bg);color:var(–warn)}
.b-logement{background:rgba(79,142,247,0.12);color:#4f8ef7}
.b-transport{background:rgba(167,139,250,0.12);color:#a78bfa}
.b-alim{background:rgba(251,191,36,0.12);color:#fbbf24}
.b-famille{background:rgba(251,113,133,0.12);color:#fb7185}
.b-sante{background:rgba(52,211,153,0.12);color:#34d399}
.b-epargne{background:rgba(52,211,153,0.15);color:#34d399}
.b-finances{background:rgba(245,158,11,0.12);color:#f59e0b}
.b-animaux{background:rgba(134,239,172,0.12);color:#86efac}
.b-bien{background:rgba(192,132,252,0.12);color:#c084fc}
.b-pro{background:rgba(20,184,166,0.12);color:#14b8a6}
.b-autres{background:rgba(148,163,184,0.12);color:#94a3b8}
.b-depenses{background:rgba(132,204,22,0.12);color:#84cc16}
.b-loisirs{background:rgba(249,115,22,0.12);color:#f97316}
.b-depyann{background:rgba(56,189,248,0.12);color:#38bdf8}
.b-auto{background:rgba(168,85,247,0.12);color:#a855f7}
.b-revenus{background:rgba(52,211,153,0.12);color:#34d399}

/* ADD ROW FORM */
.add-section{background:var(–surface);border:1px solid var(–border);border-radius:var(–r);padding:16px 18px;margin-bottom:20px}
.add-title{font-size:12px;color:var(–muted);margin-bottom:12px;font-weight:500}
.add-form{display:grid;grid-template-columns:130px 1fr 140px 140px 150px 90px 90px auto;gap:8px;align-items:end}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:10px;color:var(–dim);letter-spacing:.04em;text-transform:uppercase}
input,select{background:#1a1d2b;border:1px solid rgba(255,255,255,0.12);color:#e8eaf0;padding:7px 10px;border-radius:var(–rs);font-family:‘DM Sans’,sans-serif;font-size:12px;outline:none;width:100%;transition:border-color .15s;-webkit-text-fill-color:#e8eaf0}
input::placeholder,select::placeholder{color:rgba(124,130,153,0.7);-webkit-text-fill-color:rgba(124,130,153,0.7)}
input:focus,select:focus{border-color:var(–postale);background:#1e2235}
@media screen and (min-width:769px){
input,select{background:var(–surface2);border:1px solid var(–border2);color:var(–text);-webkit-text-fill-color:var(–text)}
input:focus,select:focus{border-color:var(–postale);background:var(–surface2)}
}

input[type=“date”]{cursor:pointer;color-scheme:dark;-webkit-text-fill-color:#e8eaf0}
input[type=“date”]::-webkit-calendar-picker-indicator{filter:invert(0.7);cursor:pointer;margin-right:-2px}

input:focus,select:focus{border-color:var(–postale)}
select option{background:var(–surface2)}
.btn-add{background:var(–postale);border:none;color:#fff;padding:8px 16px;border-radius:var(–rs);font-family:‘DM Sans’,sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:opacity .15s;white-space:nowrap}
.btn-add:hover{opacity:.85}
.btn-del{background:transparent;border:1px solid rgba(248,113,113,0.3);color:var(–neg);padding:4px 8px;border-radius:6px;font-size:11px;cursor:pointer;transition:all .15s}
.btn-del:hover{background:rgba(248,113,113,0.1)}
.row-editing{background:rgba(79,142,247,0.08)!important;outline:1px solid rgba(79,142,247,0.3)}

/* SYNTHESE GROUPES */
.synth-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.prog-card{background:var(–surface);border:1px solid var(–border);border-radius:var(–r);overflow:hidden}
.prog-row{padding:9px 16px;border-bottom:1px solid var(–border);display:flex;align-items:center;gap:10px}
.prog-row:last-child{border-bottom:none}
.prog-label{min-width:150px}
.prog-bar-bg{flex:1;height:4px;background:var(–surface3);border-radius:2px;overflow:hidden}
.prog-bar{height:100%;border-radius:2px;transition:width .6s ease}
.prog-vals{display:flex;gap:10px;min-width:120px;justify-content:flex-end;font-family:‘DM Mono’,monospace;font-size:11px}
.prog-prev{color:var(–dim)}
.prog-real{font-weight:500}

/* ANNUAL DASHBOARD */
.annual-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:24px}
.month-card{background:var(–surface);border:1px solid var(–border);border-radius:var(–r);overflow:hidden;transition:border-color .2s;cursor:pointer}
.month-card:hover{border-color:var(–border2)}
.mc-header{padding:10px 14px;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.mc-body{padding:10px 14px;display:flex;flex-direction:column;gap:5px}
.mc-row{display:flex;justify-content:space-between;font-size:12px}
.mc-lbl{color:var(–muted)}
.mc-val{font-family:‘DM Mono’,monospace;font-size:12px;font-weight:500}

/* ANNUAL TABLE */
.annual-table-wrap{background:var(–surface);border:1px solid var(–border);border-radius:var(–r);overflow:hidden;margin-bottom:24px}

/* EDITABLE */
.editable{cursor:text;border-bottom:1px dashed rgba(79,142,247,0.5);transition:border-color .15s;padding-bottom:1px}
.editable:hover{border-bottom-color:var(–postale)}
.editable-input{background:transparent;border:none;border-bottom:1px solid var(–postale);color:inherit;font:inherit;outline:none;padding:0;margin:0;min-width:60px}
.edit-mode-btn{position:fixed;bottom:20px;background:var(–surface2);border:1px solid var(–border2);color:var(–muted);padding:8px 14px;border-radius:20px;font-family:“DM Sans”,sans-serif;font-size:12px;cursor:pointer;z-index:200;transition:all .2s}
.edit-mode-btn:hover{border-color:var(–postale);color:var(–postale)}
.edit-mode-btn.on{background:rgba(79,142,247,0.12);border-color:var(–postale);color:var(–postale)}
#editModeBtn{right:20px}
.edit-hint{position:fixed;bottom:58px;right:20px;background:var(–surface2);border:1px solid var(–border);border-radius:var(–rs);padding:8px 14px;font-size:11px;color:var(–muted);z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.edit-hint.show{opacity:1}

/* SYNC STATUS */
.sync-bar{position:fixed;top:60px;right:0;left:0;height:2px;z-index:99;pointer-events:none}
.sync-bar.syncing{background:linear-gradient(90deg,transparent,var(–postale),transparent);background-size:200% 100%;animation:syncAnim 1.2s ease infinite}
.sync-bar.ok{background:var(–pos);opacity:0;transition:opacity 1s}
.sync-bar.err{background:var(–neg)}
@keyframes syncAnim{0%{background-position:100% 0}100%{background-position:-100% 0}}
.sync-dot{position:fixed;bottom:68px;right:20px;width:8px;height:8px;border-radius:50%;background:var(–dim);z-index:200;transition:background .3s}
.sync-dot.ok{background:var(–pos)}
.sync-dot.syncing{background:var(–warn);animation:pulse .8s ease infinite}
.sync-dot.err{background:var(–neg)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* CHARTS */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.chart-card{background:var(–surface);border:1px solid var(–border);border-radius:var(–r);padding:16px 20px}
.chart-title{font-size:12px;font-weight:500;color:var(–muted);margin-bottom:14px;text-transform:uppercase;letter-spacing:.05em}
.chart-wrap{position:relative;width:100%}
.chart-wrap-pie{position:relative;width:100%;max-width:280px;margin:0 auto}
.chart-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chart-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(–muted)}
.chart-legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ── FORM GRID ── */
.form-grid { display:grid; gap:10px; align-items:end; }
.vir-form { grid-template-columns:130px 1fr 160px 160px 100px auto; }
.rv-form  { grid-template-columns:130px 1fr 140px 140px 160px 90px 90px fit-content(120px); }
.dep-form { grid-template-columns:130px 1fr 140px 140px 160px 90px 90px auto; }

/* ── MOBILE ── */
@media screen and (max-width: 768px) {

/* ─ Header ─ */
.header { position:static!important; height:auto!important; padding:10px 12px 8px!important; flex-direction:column!important; align-items:stretch!important; gap:7px!important; }
.header h1 { font-size:13px!important; }
.logo { width:24px!important; height:24px!important; font-size:10px!important; }
#global-search { width:100%!important; font-size:12px!important; }
#global-search-results { width:calc(100vw - 24px)!important; left:0!important; }
.month-nav { display:grid!important; grid-template-columns:repeat(4,1fr)!important; gap:4px!important; width:100%!important; }
.month-btn { padding:5px 2px!important; font-size:11px!important; }
.nav-sep { display:grid!important; grid-template-columns:1fr 1fr!important; gap:4px!important; grid-column:1/-1!important; }
.annual-btn { font-size:11px!important; padding:5px!important; }

/* ─ Main ─ */
.main { padding:10px!important; }
.sec-label { font-size:10px!important; letter-spacing:.06em!important; }

/* ─ Cartes soldes ─ */
.soldes-grid { grid-template-columns:1fr!important; gap:10px!important; }
.solde-card { padding:14px 16px!important; margin-bottom:0!important; }
.sc-bank { font-size:10px!important; }
.sc-name { font-size:14px!important; margin-bottom:2px!important; }
.sc-name span { font-size:14px!important; }
.sc-dot { width:7px!important; height:7px!important; }
.sc-row { font-size:11px!important; padding:1px 0!important; }
.lbl { font-size:11px!important; }
.val-mono { font-size:12px!important; }
.sc-div { margin:5px 0!important; height:1px!important; }
.sc-big { margin-bottom:2px!important; }
.sc-big .val { font-size:15px!important; font-weight:600!important; }
/* Réduire TOUS les grands chiffres dans les cartes */
.solde-card span[style*=“font-size:20px”],
.solde-card span[style*=“font-size:22px”],
.solde-card div[style*=“font-size:20px”],
.solde-card div[style*=“font-size:24px”] { font-size:15px!important; font-weight:700!important; }
.solde-card span[style*=“font-size:17px”],
.solde-card span[style*=“font-size:18px”] { font-size:13px!important; }
.solde-card div[style*=“font-size:10px”],
.solde-card span[style*=“font-size:10px”],
.solde-card div[style*=“font-size:11px”] { font-size:10px!important; }

/* ─ Section spacing ─ */
.soldes-grid + .kpi-bar { margin-top:12px!important; }

/* ─ KPI bar ─ */
.kpi-bar { grid-template-columns:1fr 1fr!important; }
.kpi-item { padding:10px 12px!important; border-right:none!important; border-bottom:1px solid var(–border)!important; }
.kpi-item:nth-child(3),.kpi-item:nth-child(4) { border-bottom:none!important; }
.kpi-lbl { font-size:10px!important; }
.kpi-val { font-size:16px!important; font-weight:700!important; }
/* Projection sous KPI */
.kpi-item [style*=“font-size:13px”] { font-size:12px!important; }

/* ─ Amex note ─ */
.amex-note { font-size:10px!important; padding:7px 10px!important; }
.amex-pill { font-size:10px!important; padding:5px 10px!important; }

/* ─ Charts ─ */
.charts-grid { grid-template-columns:1fr!important; }
.chart-card { padding:12px!important; }
.chart-title { font-size:10px!important; }

/* ─ Tables ─ */
.tcard { overflow-x:auto!important; -webkit-overflow-scrolling:touch!important; }
.tcard-header { flex-wrap:wrap!important; gap:6px!important; padding:10px 12px!important; }
.tcard-title { font-size:12px!important; }
.tcard-count { font-size:11px!important; }
table { min-width:460px!important; }
thead th { font-size:9px!important; padding:5px 6px!important; letter-spacing:.04em!important; }
tbody td { font-size:11px!important; padding:7px 6px!important; }
.td-date { font-size:11px!important; }
.td-num { font-size:11px!important; }
.td-label { font-size:11px!important; }
.badge { font-size:9px!important; padding:2px 6px!important; }

/* Réel input dans tableaux fixes */

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const MOIS = ['Janvier','Février','Mars','Avril','Mai','Juin',
              'Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

const COMPTES = ['La Banque Postale','BoursoBank','Revolut','Amex (différé)'];

const GROUPES = [
  {label:'Logement',           code:'Logement',            cls:'b-logement'},
  {label:'Transport',          code:'Transport',            cls:'b-transport'},
  {label:'Alimentation',       code:'Alimentation',         cls:'b-alim'},
  {label:'Famille & Enfants',  code:'Famille_et_Enfants',   cls:'b-famille'},
  {label:'Animaux',            code:'Animaux',              cls:'b-animaux'},
  {label:'Santé',              code:'Sante',                cls:'b-sante'},
  {label:'Bien-être & Perso',  code:'Bien_etre_Perso',      cls:'b-bien'},
  {label:'Épargne',            code:'Epargne',              cls:'b-epargne'},
  {label:'Finances & Oblig.',  code:'Finances_Obligations', cls:'b-finances'},
  {label:'Dépenses perso',     code:'Depenses_perso',       cls:'b-depenses'},
  {label:'Dép. perso Yann',    code:'Depenses_perso_Yann',  cls:'b-depyann'},
  {label:'Loisirs',            code:'Loisirs',              cls:'b-loisirs'},
  {label:'Pro',                code:'Pro',                  cls:'b-pro'},
  {label:'Auto-entreprise',    code:'Auto_entreprise',      cls:'b-auto'},
  {label:'Revenus',            code:'Revenus',              cls:'b-revenus'},
  {label:'Autres',             code:'Autres',               cls:'b-autres'},
];

const CATEGORIES = {
  Logement:['Loyer / Charges','Électricité / Eau / Gaz','Décorations & Équipement','Entretien / Réparations'],
  Transport:['Carburant','Voiture / Scooter','Parking'],
  Alimentation:['Courses courantes','Courses exceptionnelles','Épicerie / Boulangerie','Restaurants'],
  Famille_et_Enfants:['Jimmy','Léon','Nounou','École / Cantine'],
  Animaux:['Chats'],
  Sante:['Médecin / Pharmacie','Mutuelles'],
  Bien_etre_Perso:['Coiffeur','Vêtements','Loisirs','Livres'],
  Epargne:['LDDS Yann','LDDS Noëmie','PEA Yann','PEA Noëmie','Assurance vie Yann','Assurance vie Noëmie','Assurance vie Jimmy','Assurance vie Léon','Livret A Jimmy','Livret A Léon','CTO','Épargne Espèces'],
  Finances_Obligations:['Crédits','Impôts','Assurances','Frais bancaires'],
  Depenses_perso:['Yann','Noëmie'],
  Pro:['Frais de missions','Cantine boulot'],
  Autres:['Cadeaux','Dons','Divers','Hors Budget'],
};

const COMPTE_CLS = {
  'La Banque Postale':'b-postale','BoursoBank':'b-bourso',
  'Revolut':'b-revolut','Amex (différé)':'b-amex'
};
const COMPTE_COLOR = {
  'La Banque Postale':'var(--postale)','BoursoBank':'var(--bourso)',
  'Revolut':'var(--revolut)','Amex (différé)':'var(--warn)'
};
const COMPTE_VAR = {
  'La Banque Postale':'--postale','BoursoBank':'--bourso',
  'Revolut':'--revolut','Amex (différé)':'--amex'
};

// ── STATE ─────────────────────────────────────────────────────────────────────
// ── FIREBASE SETUP ────────────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyBsiK-PoQx8Pp92wZtIXAq-F5RW7xEddZc",
  authDomain: "mon-budget-2026.firebaseapp.com",
  databaseURL: "https://mon-budget-2026-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "mon-budget-2026",
  storageBucket: "mon-budget-2026.firebasestorage.app",
  messagingSenderId: "442641870179",
  appId: "1:442641870179:web:1245bd1ea6228eb961f756"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const REF = db.ref('budget2026');

let data = {
  revenus: { salaire_yann:0, salaire_noemie:0, caf:0, cmg:0, autres:0 },
  soldes_debut: { jan: {postale:0,bourso:0,revolut:0} },
  transactions: Object.fromEntries(MOIS.map(m => [m, []]))
};

let syncDot, saveTimeout;

function setSyncStatus(status) {
  if (!syncDot) syncDot = document.getElementById('syncDot');
  const bar = document.getElementById('syncBar');
  if (syncDot) syncDot.className = 'sync-dot ' + status;
  if (bar) bar.className = 'sync-bar ' + status;
  if (status === 'ok') {
    setTimeout(() => { if(bar) bar.className='sync-bar'; }, 2000);
  }
}

function save() {
  // Keep localStorage as offline cache
  localStorage.setItem('budget2026', JSON.stringify(data));
  // Debounce Firebase writes
  clearTimeout(saveTimeout);
  setSyncStatus('syncing');
  saveTimeout = setTimeout(() => {
    REF.set(data)
      .then(() => setSyncStatus('ok'))
      .catch(e => { console.error(e); setSyncStatus('err'); });
  }, 800);
}

function sanitizeData(d) {
  if (!d) d = {};
  if (!d.revenus) d.revenus = { salaire_yann:0, salaire_noemie:0, caf:0, cmg:0, autres:0 };
  if (!d.soldes_debut) d.soldes_debut = { jan: {postale:0,bourso:0,revolut:0} };
  if (!d.soldes_debut.jan) d.soldes_debut.jan = {postale:0,bourso:0,revolut:0};
  if (!d.transactions) d.transactions = {};
  if (!d.revenus_tx) d.revenus_tx = {};
  MOIS.forEach(m => {
    if (!d.transactions[m]) d.transactions[m] = [];
    if (!d.revenus_tx[m]) d.revenus_tx[m] = [];
  });
  if (!d.config) d.config = {};
  if (!d.config.activeMonths) d.config.activeMonths = {
    'Janvier':false,'Février':false,'Mars':false,'Avril':false,
    'Mai':true,'Juin':true,'Juillet':true,'Août':true,
    'Septembre':true,'Octobre':true,'Novembre':true,'Décembre':true
  };
  if (!d.recurrents) d.recurrents = { revenus: [], depenses: [] };
  if (!d.virements) d.virements = {};
  MOIS.forEach(m => { if (!d.virements[m]) d.virements[m] = []; });
  if (!d.epargne) d.epargne = { comptes: [], soldes: {} };
  if (!d.epargne.comptes) d.epargne.comptes = [];
  if (!d.epargne.soldes) d.epargne.soldes = {};
  if (!d.credits) d.credits = [];
  if (!d.petite_monnaie) d.petite_monnaie = {};
  if (!d.soldes_mois) d.soldes_mois = {};
  MOIS.forEach(m => {
    if (!d.soldes_mois[m]) d.soldes_mois[m] = {postale:null, bourso:null, revolut:null};
  });
  if (!d.recurrents.revenus)  d.recurrents.revenus  = [];
  if (!d.recurrents.depenses) d.recurrents.depenses = [];
  return d;
}

// Load from Firebase on start, fall back to localStorage
function loadData(callback) {
  setSyncStatus('syncing');
  // Always render immediately with local/default data first
  const local = localStorage.getItem('budget2026');
  if (local) { try { data = sanitizeData(JSON.parse(local)); } catch(e) {} }
  else { data = sanitizeData({}); }
  callback(); // Render immediately

  // Then try Firebase
  REF.once('value')
    .then(snap => {
      const val = snap.val();
      if (val) {
        data = sanitizeData(val);
        localStorage.setItem('budget2026', JSON.stringify(data));
        setSyncStatus('ok');
        renderMain();
        // Re-init dropdowns after Firebase data loaded
        setTimeout(() => { updateCats(); updateRevCats(); }, 100);
      } else {
        // First time on Firebase: push local data up
        REF.set(data).catch(()=>{});
        setSyncStatus('ok');
      }
    })
    .catch(e => {
      console.warn('Firebase offline, using local data');
      setSyncStatus('err');
      // Show user-facing warning if Firebase fails
      const existing = document.getElementById('firebase-warn');
      if (!existing) {
        const warn = document.createElement('div');
        warn.id = 'firebase-warn';
        warn.style.cssText = 'position:fixed;bottom:16px;right:16px;background:rgba(248,113,113,0.15);border:1px solid rgba(248,113,113,0.4);border-radius:8px;padding:10px 16px;font-size:12px;color:#f87171;z-index:999;max-width:280px;line-height:1.5';
        warn.innerHTML = '⚠ Connexion Firebase indisponible<br><span style="font-size:11px;opacity:.7">Données locales utilisées. Les modifications seront synchronisées au retour du réseau.</span>';
        document.body.appendChild(warn);
        setTimeout(()=>{warn.remove();},8000);
      }
    });
}

// Real-time listener for changes from other devices
REF.on('value', snap => {
  const val = snap.val();
  if (!val) return;
  const newData = JSON.stringify(val);
  const curData = JSON.stringify(data);
  if (newData !== curData) {
    data = sanitizeData(val);
    localStorage.setItem('budget2026', JSON.stringify(data));
    renderMain();
    setTimeout(() => { updateCats(); updateRevCats(); }, 100);
    setSyncStatus('ok');
  }
});

// ── FORMATTERS ────────────────────────────────────────────────────────────────
function getActiveMonths() {
  const am = data.config?.activeMonths || {};
  return MOIS.filter(m => am[m] !== false);
}

function isMonthActive(m) {
  const am = data.config?.activeMonths;
  return !am || am[m] !== false;
}

function toggleMonth(m) {
  data.config = data.config || {};
  data.config.activeMonths = data.config.activeMonths || {};
  data.config.activeMonths[m] = !isMonthActive(m);
  save();
  showPage('settings');
}

function toastConfirm(msg, onOk) {
  const existing = document.getElementById('toastConfirm');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.id = 'toastConfirm';
  el.className = 'toast-confirm';
  el.innerHTML = `<div class="toast-confirm-msg">🗑 ${msg}</div>
    <div class="toast-confirm-actions">
      <button class="toast-confirm-cancel" onclick="document.getElementById('toastConfirm').remove()">Annuler</button>
      <button class="toast-confirm-ok" id="toastOkBtn">Supprimer</button>
    </div>`;
  document.body.appendChild(el);
  document.getElementById('toastOkBtn').onclick = () => { el.remove(); onOk(); };
  setTimeout(() => { if (document.getElementById('toastConfirm')) el.remove(); }, 6000);
}

function parseAmount(val) {
  if (!val && val !== 0) return 0;
  // Accept both comma and dot as decimal separator
  return parseFloat(String(val).replace(',', '.')) || 0;
}

function fmt(n) {
  if (n === null || n === undefined || n === '') return '—';
  const abs = Math.abs(n);
  const s = abs.toLocaleString('fr-FR', {minimumFractionDigits:0, maximumFractionDigits:2});
  return (n < 0 ? '−' : '') + s + ' €';
}

// ── PROJECTION FIN DE MOIS PAR COMPTE ────────────────────────────────────────
function getProjectionCompte(moisName, moisIdx, compte) {
  const reel = getSoldeReel(moisIdx, compte);
  const txs  = data.transactions[moisName] || [];
  const depFixes       = (data.recurrents?.depenses||[]).filter(r=>r.compte===compte).reduce((a,r)=>a+(+r.montant||0),0);
  const depFixesSaisies = txs.filter(t=>t._isRecurrent&&t.compte===compte).reduce((a,t)=>a+(+t.reel||0),0);
  const depRest = Math.max(0, depFixes - depFixesSaisies);
  const revRest = compte==='La Banque Postale' ? Math.max(0,
    (data.recurrents?.revenus||[]).reduce((a,r)=>a+(+r.montant||0),0) -
    (data.revenus_tx[moisName]||[]).filter(t=>t._isRecurrent).reduce((a,t)=>a+(+t.montant||0),0)
  ) : 0;
  return { projVal: reel + revRest - depRest, depRest, revRest };
}
function getProjectionFinMois(moisIdx) {
  const mois = MOIS[moisIdx];
  const txs = data.transactions[mois] || [];
  const revTxs = data.revenus_tx[mois] || [];
  const recDeps = data.recurrents?.depenses || [];
  const recRevs = data.recurrents?.revenus || [];

  // Soldes de début
  const soldeDebut = ['La Banque Postale','BoursoBank','Revolut']
    .reduce((a,c) => a + getSoldeDebut(moisIdx, c), 0);

  // Revenus déjà encaissés (réel)
  const revEncaisses = getRevTotal(moisIdx);

  // Revenus fixes restants non encore saisis (prévu mais pas encore réel)
  const revFixesTotal = recRevs.reduce((a,r) => a + (+r.montant||0), 0);
  const revFixesSaisis = revTxs.filter(t=>t._isRecurrent)
    .reduce((a,t) => a + (+t.montant||0), 0);
  const revRestants = Math.max(0, revFixesTotal - revFixesSaisis);

  // Dépenses réelles déjà saisies
  const depReelles = txs.reduce((a,t) => a + (+t.reel||0), 0)
    + (data.transactions[mois]||[]).filter(t=>t._isRecurrent)
      .reduce((a,t) => a + (+t.reel||0), 0);

  // Dépenses fixes restantes non encore saisies (prévu mais pas réel)
  const depFixesRestantes = recDeps.reduce((r2,r) => {
    const override = txs.find(t=>t._isRecurrent && data.recurrents.depenses.indexOf(r)===data.recurrents.depenses.indexOf(r));
    return r2 + (override ? 0 : (+r.montant||0));
  }, 0);
  // Simpler: total dépenses fixes prévues - déjà saisies
  const depFixesTotal = recDeps.reduce((a,r) => {
      const freq = r.frequence || 'mensuelle';
      let applies = true;
      let mult = 1;
      if (freq==='hebdomadaire') mult = 4;
      else if (freq==='bimensuelle') mult = 2;
      else if (freq==='trimestrielle') { applies = ((moisIdx+1)-(r._startMois||1))%3===0; }
      else if (freq==='annuelle') { applies = (moisIdx+1)===(r._startMois||1); }
      return applies ? a+(+r.montant||0)*mult : a;
    }, 0);
  const depFixesSaisies = txs.filter(t=>t._isRecurrent).reduce((a,t) => a + (+t.reel||0), 0);
  const depFixesRest = Math.max(0, depFixesTotal - depFixesSaisies);

  // Dépenses variables prévues non encore réalisées
  const depVarPrevues = txs.filter(t=>!t._isRecurrent && t.prevu && !t.reel)
    .reduce((a,t) => a + (+t.prevu||0), 0);

  const projectionBasse = soldeDebut + revEncaisses - depReelles - depFixesRest;
  const projectionHaute = soldeDebut + revEncaisses + revRestants - depReelles - depFixesRest - depVarPrevues;

  return {
    soldeDebut,
    revEncaisses,
    revRestants,
    depReelles,
    depFixesRest,
    depVarPrevues,
    projectionBasse,
    projectionHaute,
    resteAVivre: projectionHaute,
  };
}

function fmtSign(n) {
  if (!n && n !== 0) return '—';
  const s = Math.abs(n).toLocaleString('fr-FR', {minimumFractionDigits:0, maximumFractionDigits:0});
  return (n > 0 ? '+' : n < 0 ? '−' : '') + s + ' €';
}
function ecartClass(n) {
  if (!n && n !== 0) return 'td-ecart-zero';
  return n > 0 ? 'td-ecart-pos' : n < 0 ? 'td-ecart-neg' : 'td-ecart-zero';
}

// ── CALCULS ───────────────────────────────────────────────────────────────────
// Get recurring items merged into a month (prévu from template, réel = 0 until filled)
function getRecurrantsForMonth(moisName, type) {
  const items = (data.recurrents && data.recurrents[type]) || [];
  return items.map((r,i) => ({
    ...r,
    _recId: i,
    _isRecurrent: true,
  }));
}

function getRevTotal(moisIdx) {
  if (moisIdx !== undefined) {
    const mois = MOIS[moisIdx];
    const txRev = (data.revenus_tx && data.revenus_tx[mois]) || [];
    // Recurring revenues: use réel if filled, else prévu
    const recRev = getRecurrantsForMonth(mois,'revenus');
    const fromRec = recRev.reduce((a,r) => {
      const override = txRev.find(t => t._recId === r._recId);
      return a + (override ? (+override.montant||0) : (+r.montant||0));
    }, 0);
    // Manual (non-recurring) revenues
    const manual = txRev.filter(t => !t._isRecurrent).reduce((a,t)=>a+(+t.montant||0),0);
    return fromRec + manual;
  }
  return Object.values(data.revenus).reduce((a,b)=>a+(+b||0),0);
}
function getSoldeDebut(moisIdx, compte) {
  if (compte === 'Amex (différé)') return 0;
  const key = ['postale','bourso','revolut'][['La Banque Postale','BoursoBank','Revolut'].indexOf(compte)];
  const mois = MOIS[moisIdx];
  // Check if a manual override exists for this month
  if (data.soldes_mois && data.soldes_mois[mois] && data.soldes_mois[mois][key] !== null && data.soldes_mois[mois][key] !== undefined) {
    return data.soldes_mois[mois][key];
  }
  // Otherwise: Jan uses Paramètres, others carry over from previous month
  if (moisIdx === 0) return data.soldes_debut.jan[key] || 0;
  return getSoldeReel(moisIdx - 1, compte);
}

function setSoldeDebutAmex(moisName, val) {
  data.soldes_mois = data.soldes_mois || {};
  data.soldes_mois[moisName] = data.soldes_mois[moisName] || {};
  data.soldes_mois[moisName].amex = Math.round(parseAmount(val) * 100) / 100;
  save(); renderMain();
}

function setSoldeDebut(moisName, key, val) {
  data.soldes_mois = data.soldes_mois || {};
  data.soldes_mois[moisName] = data.soldes_mois[moisName] || {postale:null, bourso:null, revolut:null};
  data.soldes_mois[moisName][key] = Math.round(parseAmount(val) * 100) / 100;
  save();
  renderMain();
}
function getDepenses(moisIdx, compte) {
  return (data.transactions[MOIS[moisIdx]] || [])
    .filter(t => t.compte === compte)
    .reduce((a,t)=>a+(+t.reel||0),0);
}
function getDepensesPrev(moisIdx, compte) {
  return (data.transactions[MOIS[moisIdx]] || [])
    .filter(t => t.compte === compte)
    .reduce((a,t)=>a+(+t.prevu||0),0);
}
function getVirementsBalance(moisIdx, compte) {
  const mois = MOIS[moisIdx];
  const virs = data.virements?.[mois] || [];
  let balance = 0;
  virs.forEach(v => {
    if (v.vers === compte) balance += (+v.montant || 0);
    if (v.de   === compte) balance -= (+v.montant || 0);
  });
  return balance;
}

function getSoldeReel(moisIdx, compte) {
  if (compte === 'Amex (différé)') {
    // Solde Amex = dépenses du mois (négatif) + remboursements reçus (positif)
    const mois = MOIS[moisIdx];
    const depenses = getAmex(moisIdx);
    const remboursements = (data.revenus_tx[mois]||[])
      .filter(t => t.compte === 'Amex (différé)')
      .reduce((a,t) => a + (+t.montant||0), 0);
    return remboursements - depenses;
  }
  const rev = compte === 'La Banque Postale' ? getRevTotal(moisIdx) : 0;
  return getSoldeDebut(moisIdx, compte) + rev - getDepenses(moisIdx, compte) + getVirementsBalance(moisIdx, compte);
}
function getSoldePrev(moisIdx, compte) {
  if (compte === 'Amex (différé)') return 0;
  const rev = compte === 'La Banque Postale' ? getRevTotal(moisIdx) : 0;
  return getSoldeDebut(moisIdx, compte) + rev - getDepensesPrev(moisIdx, compte) + getVirementsBalance(moisIdx, compte);
}
function getAmex(moisIdx) {
  return (data.transactions[MOIS[moisIdx]] || [])
    .filter(t => t.compte === 'Amex (différé)')
    .reduce((a,t)=>a+(+t.reel||0),0);
}
function getEpargne(moisIdx) {
  return (data.transactions[MOIS[moisIdx]] || [])
    .filter(t => t.groupe === 'Epargne')
    .reduce((a,t)=>a+(+t.reel||0),0);
}
function getTotalDep(moisIdx) {
  const mois = MOIS[moisIdx];
  const txs = data.transactions[mois] || [];
  const virLibelles = new Set((data.virements?.[mois]||[]).map(v=>v.libelle));
  const filtered = txs.filter(t =>
    t.compte !== 'Amex (différé)' && !t._amexAuto &&
    (!virLibelles.has(t.libelle) || t.groupe !== 'Autres')
  );
  return ['La Banque Postale','BoursoBank','Revolut'].reduce((a,c)=>
    a + filtered.filter(t=>t.compte===c).reduce((s,t)=>s+(+t.reel||0),0), 0);
}

  sep.style.marginLeft='8px';
  const ab = document.createElement('button');
  ab.className='annual-btn'+(currentPage==='annual'?' active':'');

  sep.appendChild(ab);
  const spBtn = document.createElement('button');

  spBtn.style.cssText='border-color:rgba(251,191,36,0.35);color:var(--warn)';
  spBtn.textContent='⚙ Paramètres';
  spBtn.onclick=()=>showPage('settings');
  sep.appendChild(spBtn);

  const epBtn = document.createElement('button');
  epBtn.className='annual-btn'+(currentPage==='epargne'?' active':'');
  epBtn.style.cssText='border-color:rgba(52,211,153,0.35);color:var(--pos)';
  epBtn.textContent='💰 Épargne';
  epBtn.onclick=()=>showPage('epargne');
  sep.appendChild(epBtn);

  const crBtn = document.createElement('button');
  crBtn.className='annual-btn'+(currentPage==='credits'?' active':'');
  crBtn.style.cssText='border-color:rgba(248,113,113,0.35);color:var(--neg)';
  crBtn.textContent='🏦 Crédits';
  crBtn.onclick=()=>showPage('credits');

  nextBtn.className = 'month-btn';

  nextBtn.title = 'Mois suivant';
  nextBtn.style.cssText = 'padding:5px 9px;font-size:14px;font-weight:700';
  nextBtn.disabled = currentIdx < 0 || currentIdx >= activeMonths.length - 1;
  nextBtn.style.opacity = (currentIdx < 0 || currentIdx >= activeMonths.length-1) ? '0.25' : '1';
  nextBtn.onclick = () => { if(currentIdx>=0 && currentIdx<activeMonths.length-1) showPage(activeMonths[currentIdx+1]); };

function showPage(page) {
  currentPage = page;
  buildNav();
  renderMain();
}

function getBankLogo(name) {
  const n = (name||'').toLowerCase();
  if (n.includes('postale') || n.includes('labanque')) return '🟡';
  if (n.includes('bourso')) return '🔵';
  if (n.includes('revolut')) return '⚫';
  if (n.includes('amex') || n.includes('american')) return '🟦';
  if (n.includes('lcl')) return '🟢';
  if (n.includes('bnp')) return '🌿';
  if (n.includes('cic')) return '🔴';
  if (n.includes('crédit agri') || n.includes('credit agri')) return '🌾';
  if (n.includes('société') || n.includes('societe')) return '🟥';
  if (n.includes('ing')) return '🟠';
  if (n.includes('hello')) return '🟩';
  return '🏦';
}

          </div>

          <div class="sc-row"><span class="lbl">Dépenses du mois</span><span class="val-mono val-neg">−${fmt(amex)}</span></div>
          ${amexRembours > 0 ? `<div class="sc-row"><span class="lbl">Remboursements reçus</span><span class="val-mono val-pos">+${fmt(amexRembours)}</span></div>` : ''}
          <div class="sc-row" style="margin-top:4px;padding-top:8px;border-top:1px solid var(--border)">
            <span class="lbl" style="font-weight:600">Solde actuel</span>
            <span style="font-family:'DM Mono',monospace;font-size:15px;font-weight:700;color:${reel>0?'var(--pos)':reel<0?'var(--neg)':'var(--muted)'}">${fmt(reel)}</span>
          </div>
          <div class="sc-row"><span class="lbl">Prélèvement</span><span class="val-mono val-warn">30 ${moisName} → budget ${MOIS[moisIdx+1]||'mois suivant'}</span></div>
          <div class="sc-row" style="margin-top:8px">
            <span class="lbl">Solde début</span>
            <span style="display:flex;align-items:center;gap:6px">
              <input type="number" step="0.01"
                value="${(+(((data.soldes_mois||{})[moisName]?.amex)||0)).toFixed(2)}"
                style="width:110px;background:transparent;border:none;border-bottom:1px dashed rgba(251,191,36,0.4);color:var(--warn);font-family:'DM Mono',monospace;font-size:12px;text-align:right;padding:2px 4px;outline:none"
                onfocus="this.style.borderColor='var(--amex)'"
                onblur="setSoldeDebutAmex('${moisName}',this.value)"
                onkeydown="if(event.key==='Enter')this.blur()"
                placeholder="0">
              <span style="font-size:11px;color:var(--warn)">€</span>
            </span>
          </div>
        </div>
        <div class="amex-pill">⚠ À provisionner sur La Banque Postale</div>
      </div>`;
  }).join('');

  // KPIs
  const revTotal = getRevTotal(moisIdx);
  const depTotal = getTotalDep(moisIdx);
  const soldeGlobal = ['La Banque Postale','BoursoBank','Revolut']
    .reduce((a,c)=>a+getSoldeReel(moisIdx,c),0);
  const amexTotal = getAmex(moisIdx);
  const depPrev = COMPTES.reduce((a,c)=>a+getDepensesPrev(moisIdx,c),0);

  // Transactions table
  // Recurring depenses pre-filled
  // Combine fixed + variable transactions and sort by date
  const recDeps = data.recurrents?.depenses||[];

  // Build unified sorted list
  const allDepRows = [];

  // Helper: get week dates for a month
  function getWeeklyDates(moisIdx, jourHabitual) {
    const year = 2026;
    const mois0 = moisIdx; // 0-based
    const jour = parseInt(jourHabitual) || 1;
    const dates = [];
    const daysInMonth = new Date(year, mois0+1, 0).getDate();
    // Find all occurrences of the weekday starting from the given day
    // If no specific day, generate every 7 days from day 1
    let d = jour;
    while (d <= daysInMonth) {
      const dd = String(d).padStart(2,'0');
      const mm = String(mois0+1).padStart(2,'0');
      dates.push({display: dd+'/'+mm, sort: d});
      d += 7;
    }
    return dates;
  }

  // Add fixed recurring — expand hebdomadaire into multiple rows
  recDeps.forEach((r,idx)=>{
    const freq = r.frequence || 'mensuelle';
    if (freq === 'hebdomadaire') {
      const weekDates = getWeeklyDates(moisIdx, parseInt(r.date)||1);
      weekDates.forEach((wd, wi) => {
        const overrideKey = `${idx}_${wi}`;
        const override = txs.find(t=>t._isRecurrent && t._recId===idx && t._weekIdx===wi);
        const reelVal = override ? override.reel : '';
        const grpObj = getGroupes().find(g=>g.code===r.groupe);
        allDepRows.push({dateSort:wd.sort, isRecurrent:true, r, idx, override, reelVal, grpObj,
          weekIdx: wi, weekDate: wd.display, isWeekly: true});
      });
    } else if (freq === 'trimestrielle') {
      const mN = moisIdx + 1;
      const jourRef = parseInt(r.date) || 1;
      const refMois = r._startMois || 1;
      if ((mN - refMois) % 3 === 0) {
        const dd = String(jourRef).padStart(2,'0');
        const mm = String(mN).padStart(2,'0');
        const override = txs.find(t=>t._isRecurrent && t._recId===idx);
        const reelVal = override ? override.reel : '';
        const grpObj = getGroupes().find(g=>g.code===r.groupe);
        allDepRows.push({dateSort:jourRef, isRecurrent:true, r, idx, override, reelVal, grpObj,
          weekDate: dd+'/'+mm, isWeekly:false});
      }
    } else if (freq === 'annuelle') {
      const mN2 = moisIdx + 1;
      const refMois2 = r._startMois || 1;
      if (mN2 === refMois2) {
        const jourRef = parseInt(r.date) || 1;
        const dd = String(jourRef).padStart(2,'0');
        const mm = String(mN).padStart(2,'0');
        const override = txs.find(t=>t._isRecurrent && t._recId===idx);
        const reelVal = override ? override.reel : '';
        const grpObj = getGroupes().find(g=>g.code===r.groupe);
        allDepRows.push({dateSort:jourRef, isRecurrent:true, r, idx, override, reelVal, grpObj,
          weekDate: dd+'/'+mm, isWeekly:false});
      }
    } else if (freq === 'bimensuelle') {
      // Two occurrences: day X and day X+15
      const jour = parseInt(r.date) || 1;
      const jour2 = Math.min(jour + 15, 28);
      [jour, jour2].forEach((d, wi) => {
        const dd = String(d).padStart(2,'0');
        const mm = String(moisIdx+1).padStart(2,'0');
        const override = txs.find(t=>t._isRecurrent && t._recId===idx && t._weekIdx===wi);
        const reelVal = override ? override.reel : '';
        const grpObj = getGroupes().find(g=>g.code===r.groupe);
        allDepRows.push({dateSort:d, isRecurrent:true, r, idx, override, reelVal, grpObj,
          weekIdx: wi, weekDate: dd+'/'+mm, isWeekly: true});
      });
    } else {
      const override = txs.find(t=>t._isRecurrent && t._recId===idx && !t._weekIdx);
      const reelVal = override ? override.reel : '';
      const grpObj = getGroupes().find(g=>g.code===r.groupe);
      const dateSort = r.date || '99';
      allDepRows.push({dateSort, isRecurrent:true, r, idx, override, reelVal, grpObj});
    }
  });

  // Add variable transactions
  txs.filter(t=>!t._isRecurrent).forEach((t,i)=>{
    const grpObj = getGroupes().find(g=>g.code===t.groupe);
    const ecart = (t.prevu && t.reel) ? t.prevu - t.reel : null;
    const isEditingRow = !!t._editing;
    const dateSort = t.date || '99';
    allDepRows.push({dateSort, isRecurrent:false, t, i, grpObj, ecart, isEditingRow});
  });

  // ── Dépenses Amex CE mois (différées, affichées mais non comptées) ───────
  amexTxsCeMois.forEach((t, i) => {
    const grpObj = getGroupes().find(g => g.code === t.groupe);
    const txIdx = txsAll.indexOf(t);
    allDepRows.push({
      dateSort: t.date || '99',
      isRecurrent: false,
      isAmexDiffere: true, // affichée dans ce mois, comptée dans le suivant
      t, i: txIdx, grpObj,
      ecart: null, isEditingRow: false,
    });
  });

  // ── Dépenses Amex du mois précédent reportées ici ───────────────────────
  // Les dépenses Amex saisies en moisPrev apparaissent ICI avec leur vraie catégorie,
  // datées au 30 (prélèvement Amex). Elles sont en lecture seule (modif dans moisPrev).
  if (moisIdx > 0) {
    const moisPrev = MOIS[moisIdx - 1];
    const amexTxsPrev = (data.transactions[moisPrev] || [])
      .filter(t => t.compte === 'Amex (différé)' && !t._amexAuto);
    const amexTotal = amexTxsPrev.reduce((a,t) => a + (+t.reel||0), 0);

    if (amexTotal > 0) {
      const mm = String(moisIdx+1).padStart(2,'0');
      // Une ligne par dépense Amex du mois précédent, avec sa vraie catégorie
      amexTxsPrev.forEach(t => {
        const grpObj = getGroupes().find(g => g.code === t.groupe);
        allDepRows.push({
          dateSort: 30,
          isRecurrent: false,
          isAmexReporte: true,  // lecture seule, vient du mois précédent
          t: {
            ...t,
            date: `30/${mm}`,
            compte: 'La Banque Postale',
            libelle: `[Amex] ${t.libelle}`,
          },
          grpObj,
          ecart: null,
          isEditingRow: false,
          i: -1,
        });
      });

      // Ligne récap prélèvement total (modifiable pour confirmer le montant réel)
      const amexLibelle = `Prélèvement Amex (${moisPrev})`;
      const existingAmex = txs.find(t => !t._isRecurrent && t.libelle === amexLibelle);
      const amexGrpObj = getGroupes().find(g => g.code === 'Finances_Obligations');
      allDepRows.push({
        dateSort: 30,
        isRecurrent: false,
        isAmexPrelevement: true,
        amexPrevMois: moisPrev,
        amexMontantPrevu: amexTotal,
        existingAmex,
        grpObj: amexGrpObj,
        i: existingAmex ? txs.indexOf(existingAmex) : -1,
        t: existingAmex || {
          date: `30/${mm}`,
          libelle: amexLibelle,
          compte: 'La Banque Postale',
          groupe: 'Finances_Obligations',
          categorie: 'Crédits',
          prevu: amexTotal,
          reel: null,
        },
        ecart: existingAmex ? (amexTotal - (+existingAmex.reel||0)) : null,
        isEditingRow: false,
      });
    }
  }

  // Sort chronologique (direction pilotée par dateSortDir)
  allDepRows.sort((a,b)=>{
    const da = parseInt(String(a.dateSort||'99').split('/')[0])||99;
    const db = parseInt(String(b.dateSort||'99').split('/')[0])||99;
    return window._dateSortDir === 'desc' ? db - da : da - db;
  });



  const totalPrevu = txs.reduce((a,t)=>a+(+t.prevu||0),0);
  const totalReel  = txs.reduce((a,t)=>a+(+t.reel||0),0);
  const totalEcart = totalPrevu - totalReel;

  // Dépenses Amex du mois précédent reportées dans la synthèse de ce mois
  const amexTxsReportees = moisIdx > 0
    ? (data.transactions[MOIS[moisIdx-1]]||[]).filter(t => t.compte==='Amex (différé)' && !t._amexAuto)

  const txsPourSynth = [...txs, ...amexTxsReportees];

  // Synthèse par groupe
  const synthRows = getGroupes().map(g => {
    const prev = txsPourSynth.filter(t=>t.groupe===g.code).reduce((a,t)=>a+(+t.prevu||0),0);

    const maxVal = Math.max(prev, reel, 1);
    const pct = Math.min((reel/maxVal)*100, 100);
    const over = reel > prev && prev > 0;
    const barColor = over ? 'var(--neg)' : 'var(--postale)';
    if (!reel && !prev) return '';
    const total = txs.reduce((a,t)=>a+(+t.reel||0),0) + recDeps.reduce((a,r)=>a+(+r.montant||0),0);
    const pctOfTotal = total > 0 ? Math.round((reel/total)*100) : 0;
    return `
      <div class="prog-row" style="flex-direction:column;align-items:stretch;gap:5px;padding:10px 16px">
        <div style="display:flex;justify-content:space-between;align-items:center">

        </div>
        <div style="height:8px;background:var(--surface3);border-radius:4px;overflow:hidden">
          <div style="height:100%;border-radius:4px;transition:width .5s ease;width:${pctOfTotal}%;background:${over?'var(--neg)':'var(--postale)'}"></div>
        </div>
      </div>`;
  }).join('');

  // Formulaire ajout transaction
  const grpOptions = getGroupes().map(g=>`<option value="${g.code}">${g.label}</option>`).join('');

  return `

        <div class="kpi-lbl" style="color:var(--warn)">Amex à provisionner</div>

          ${(()=>{

                      onchange="updateRecurrentReal('${moisName}','revenus',${i},this.value)">

                  </div>
                </td>
                <td class="${ecartClass(ecart)}">${ecart!==null?fmtSign(ecart):'—'}</td>
                <td></td>
              </tr>`;
            }).join('');
            const manualRows = manuals.map((t,i)=>{
              const grpObj = getGroupes().find(g=>g.code===t.groupe);
              const ecart = (t.prevu && t.montant) ? t.montant - t.prevu : null;
              const isEditingRev = !!t._editing;
              return `<tr class="${isEditingRev?'row-editing':''}">
                <td class="td-date">${t.date||''}</td>
                <td>${t.libelle||''}${isEditingRev?' <span style="font-size:10px;color:var(--postale);margin-left:4px">✏️ en cours…</span>':''}</td>

                <td style="display:flex;gap:4px">
                  ${isEditingRev
                    ? `<button class="btn-del" style="color:var(--muted);border-color:var(--border)" onclick="cancelEdit('${moisName}','rev')">✕ Annuler</button>`
                    : `<button class="btn-del" style="color:var(--postale);border-color:rgba(79,142,247,0.3)" onclick="editRevTx('${moisName}',${i})">✏️</button>
                       <button class="btn-del" onclick="delRevTx('${moisName}',${i})">✕</button>`
                  }
                </td>
              </tr>`;}).join('');
            return recRows + manualRows || '<tr><td colspan="7" style="text-align:center;color:var(--dim);padding:16px;font-size:12px">Aucun revenu ce mois — ajoutez des revenus fixes dans Paramètres</td></tr>';
          })()}
          ${(data.revenus_tx[moisName]||[]).length ? `<tr class="total-row">
            <td colspan="5" style="text-align:right;color:var(--muted);font-size:12px">TOTAL</td>
            <td class="td-num val-muted">${fmt((data.recurrents?.revenus||[]).reduce((a,r)=>a+(+r.montant||0),0)+(data.revenus_tx[moisName]||[]).filter(t=>!t._isRecurrent).reduce((a,t)=>a+(+t.prevu||0),0))}</td>
            <td class="td-num val-pos">${fmt(getRevTotal(moisIdx))}</td>
            <td class="${ecartClass(getRevTotal(moisIdx) - (
              (data.recurrents?.revenus||[]).reduce((a,r)=>a+(+r.montant||0),0) +
              (data.revenus_tx[moisName]||[]).filter(t=>!t._isRecurrent).reduce((a,t)=>a+(+t.prevu||0),0)
            ))}">${fmtSign(getRevTotal(moisIdx) - (
              (data.recurrents?.revenus||[]).reduce((a,r)=>a+(+r.montant||0),0) +
              (data.revenus_tx[moisName]||[]).filter(t=>!t._isRecurrent).reduce((a,t)=>a+(+t.prevu||0),0)
            ))}</td>
            <td></td>
          </tr>` : ''}
        </tbody>
      </table>

      <div class="form-grid" style="grid-template-columns:120px 1fr 160px 160px 120px auto;padding:12px 16px;${((data.virements||{})[moisName]||[]).length?'border-top:1px solid var(--border)':''}">

            // ── Ligne dépense Amex reportée (lecture seule) ─────────────────
            if (row.isAmexReporte) {
              const {t, grpObj} = row;
              return `<tr style="background:rgba(251,191,36,0.03);opacity:0.85">
                <td class="td-date">${t.date}<span style="font-size:9px;margin-left:4px;color:var(--warn);opacity:.6">↩</span></td>
                <td class="td-label" style="color:var(--text)">${t.libelle}</td>
                <td><span class="badge b-postale">La Banque Postale</span></td>

            // ── Ligne prélèvement Amex automatique ──────────────────────────
            if (row.isAmexPrelevement) {
              const {amexPrevMois, amexMontantPrevu, existingAmex, grpObj, t} = row;
              const reelVal = existingAmex ? (+existingAmex.reel||0) : '';
              const ecart   = reelVal !== '' ? (amexMontantPrevu - reelVal) : null;
              const isConf  = reelVal !== '';
              return `<tr style="background:rgba(251,191,36,0.03);border-left:3px solid rgba(251,191,36,0.35);opacity:0.75">
                <td class="td-date" style="color:var(--dim)">30/${String(moisIdx+1).padStart(2,'0')}</td>

                      style="width:80px;background:var(--surface2);border:1px solid var(--border2);color:var(--neg);padding:4px 8px;border-radius:6px;font-size:12px;text-align:right"
                      onchange="updateRecurrentReal('${moisName}','depenses',${idx},this.value,${wi})">

                    : `<button title="Réinitialiser"
                      onclick="updateRecurrentReal('${moisName}','depenses',${idx},'',${wi});renderMain()"

                <td class="td-label">${t.libelle||''}${isEditingRow?' <span style="font-size:10px;color:var(--postale);margin-left:4px">✏️ en cours…</span>':''}</td>

                <td><span class="badge ${grpObj?grpObj.cls:''}">${grpObj?grpObj.label:t.groupe||''}</span></td>

              </tr>`;
            }

        // Dépenses Amex du mois précédent reportées ici avec leur vraie catégorie
        ...(moisIdx > 0 ? (data.transactions[MOIS[moisIdx-1]]||[])

    ${synthRows ? `

}

// ── RENDER ANNUAL ─────────────────────────────────────────────────────────────
function renderAnnual() {
  const cards = MOIS.filter(m => isMonthActive(m)).map((m,i) => {
    const mi = MOIS.indexOf(m);
    const rev = getRevTotal(mi);
    const dep = getTotalDep(mi);
    const epa = getEpargne(mi);
    const solde = ['La Banque Postale','BoursoBank','Revolut']
      .reduce((a,c)=>a+getSoldeReel(mi,c),0);
    const colors = ['#4f8ef7','#34d399','#a78bfa','#fbbf24','#f87171','#60a5fa',
                    '#2dd4bf','#c084fc','#4ade80','#fb923c','#818cf8','#94a3b8'];
    const abr=['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];
    return `
      <div class="month-card fade" onclick="showPage('${m}')" style="border-top:2px solid ${colors[i]}">
        <div class="mc-header" style="color:${colors[i]}">${m}<span style="font-size:11px;color:var(--dim);font-weight:400">${abr[i]}</span></div>
        <div class="mc-body">
          <div class="mc-row"><span class="mc-lbl">Revenus</span><span class="mc-val val-pos">${fmt(rev)}</span></div>
          <div class="mc-row"><span class="mc-lbl">Dépenses</span><span class="mc-val val-neg">${fmt(dep)}</span></div>
          <div class="mc-row"><span class="mc-lbl">Épargne</span><span class="mc-val" style="color:#34d399">${fmt(epa)}</span></div>
          <div style="height:1px;background:var(--border);margin:4px 0"></div>
          <div class="mc-row"><span class="mc-lbl">Solde réel</span><span class="mc-val" style="color:${solde<0?'var(--neg)':solde===0?'var(--muted)':'var(--pos)'}">${fmt(solde)}</span></div>
        </div>
      </div>`;
  }).join('');

  const annualRows = MOIS.filter(m => isMonthActive(m)).map((m,i) => {
    const mi = MOIS.indexOf(m);
    const rev=getRevTotal(mi), dep=getTotalDep(mi), epa=getEpargne(mi);
    const solde=['La Banque Postale','BoursoBank','Revolut'].reduce((a,c)=>a+getSoldeReel(mi,c),0);
    const amex=getAmex(mi);
    const alt = i%2===0 ? 'background:rgba(255,255,255,0.02)' : '';
    return `<tr style="${alt}">
      <td style="padding:10px 14px;font-size:13px;font-weight:500">${m}</td>
      <td class="td-num val-pos">${fmt(rev)}</td>
      <td class="td-num val-neg">${fmt(dep)}</td>
      <td class="td-num" style="color:#34d399;font-family:'DM Mono',monospace;font-size:12px;text-align:right">${fmt(epa)}</td>
      <td class="td-num" style="color:${solde<0?'var(--neg)':solde===0?'var(--muted)':'var(--pos)'}">${fmt(solde)}</td>
      <td class="td-num val-warn">${amex?fmt(amex):'—'}</td>
    </tr>`;
  }).join('');

  return `
    ${renderAnnualCharts()}
    <div class="sec-label">Vue par mois — cliquez pour naviguer</div>
    <div class="annual-grid">${cards}</div>

    <div class="sec-label">Récapitulatif annuel</div>
    <div class="annual-table-wrap">
      <table>
        <thead><tr>
          <th>Mois</th>
          <th style="text-align:right">Revenus</th>
          <th style="text-align:right">Dépenses</th>
          <th style="text-align:right">Épargne</th>
          <th style="text-align:right">Solde réel</th>
          <th style="text-align:right">Amex diff.</th>
        </tr></thead>
        <tbody>
          ${annualRows}
          <tr class="total-row">
            <td style="padding:10px 14px">TOTAL 2026</td>
            <td class="td-num val-pos">${fmt(MOIS.filter(m=>isMonthActive(m)).reduce((_,m)=>_+getRevTotal(MOIS.indexOf(m)),0))}</td>
            <td class="td-num val-neg">${fmt(MOIS.reduce((_,m,i)=>_+getTotalDep(i),0))}</td>
            <td class="td-num" style="color:#34d399;font-family:'DM Mono',monospace;font-size:12px;text-align:right">${fmt(MOIS.reduce((_,m,i)=>_+getEpargne(i),0))}</td>
            <td class="td-num">—</td>
            <td class="td-num val-warn">${fmt(MOIS.reduce((_,m,i)=>_+getAmex(i),0))}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="sec-label">Paramètres</div>
    <div class="tcard" style="padding:20px">
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:16px">
        <div class="form-group"><label class="form-label">Salaire Yann</label><input type="number" id="p-salaire_yann" value="${data.revenus.salaire_yann||0}" onchange="updateRev('salaire_yann',this.value)"></div>
        <div class="form-group"><label class="form-label">Salaire Noëmie</label><input type="number" id="p-salaire_noemie" value="${data.revenus.salaire_noemie||0}" onchange="updateRev('salaire_noemie',this.value)"></div>
        <div class="form-group"><label class="form-label">CAF</label><input type="number" id="p-caf" value="${data.revenus.caf||0}" onchange="updateRev('caf',this.value)"></div>
        <div class="form-group"><label class="form-label">CMG</label><input type="number" id="p-cmg" value="${data.revenus.cmg||0}" onchange="updateRev('cmg',this.value)"></div>
        <div class="form-group"><label class="form-label">Autres revenus</label><input type="number" id="p-autres" value="${data.revenus.autres||0}" onchange="updateRev('autres',this.value)"></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
        <div class="form-group"><label class="form-label">Solde début Janvier — La Banque Postale</label><input type="number" id="p-jan-postale" value="${data.soldes_debut.jan.postale||0}" onchange="updateSolde('postale',this.value)"></div>
        <div class="form-group"><label class="form-label">Solde début Janvier — BoursoBank</label><input type="number" id="p-jan-bourso" value="${data.soldes_debut.jan.bourso||0}" onchange="updateSolde('bourso',this.value)"></div>
        <div class="form-group"><label class="form-label">Solde début Janvier — Revolut</label><input type="number" id="p-jan-revolut" value="${data.soldes_debut.jan.revolut||0}" onchange="updateSolde('revolut',this.value)"></div>
      </div>
    </div>
  `;
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function updateCategorySelect(groupeId, catSelectId) {
  const grpEl = document.getElementById(groupeId);
  const catEl = document.getElementById(catSelectId);
  if (!grpEl || !catEl) return;
  const cats = getCats()[grpEl.value] || [];
  catEl.innerHTML = cats.map(cc=>`<option value="${cc}">${cc}</option>`).join('');
}

function globalSearch(q) {
  const panel = document.getElementById('global-search-results');
  if (!panel) return;
  const term = q.trim().toLowerCase();
  if (!term) { panel.style.display='none'; return; }
  const hits = [];
  MOIS.forEach(mois => {
    (data.transactions[mois]||[]).forEach(t => {
      if ((t.libelle||'').toLowerCase().includes(term) || (t.categorie||'').toLowerCase().includes(term)) {
        hits.push({mois, ...t, type:'dep'});
      }
    });
    (data.revenus_tx[mois]||[]).forEach(t => {
      if ((t.libelle||'').toLowerCase().includes(term)) {
        hits.push({mois, ...t, type:'rev'});
      }
    });
  });
  if (!hits.length) {
    panel.innerHTML='<div style="padding:14px 16px;color:var(--dim);font-size:12px">Aucun résultat</div>';
  } else {
    panel.innerHTML = hits.slice(0,20).map(h=>`
      <div onclick="showPage('${h.mois}');document.getElementById('global-search').value='';document.getElementById('global-search-results').style.display='none';"
        style="padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px"
        onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background=''">
        <div>
          <div style="font-size:13px;font-weight:500">${h.libelle||''}</div>
          <div style="font-size:11px;color:var(--muted)">${h.mois} · ${h.date||''} · ${h.compte||''}</div>
        </div>
        <span style="font-family:'DM Mono',monospace;font-size:13px;color:${h.type==='rev'?'var(--pos)':'var(--neg)'};white-space:nowrap">
          ${h.type==='rev'?'+':'−'}${fmt(h.type==='rev'?h.montant:h.reel)}
        </span>
      </div>`).join('');
    if (hits.length>20) panel.innerHTML += `<div style="padding:8px 14px;font-size:11px;color:var(--dim)">${hits.length-20} résultats supplémentaires…</div>`;
  }
  panel.style.display='block';
}
document.addEventListener('click', e => {
  const panel = document.getElementById('global-search-results');
  if (panel && !panel.contains(e.target) && e.target.id!=='global-search') panel.style.display='none';
});

// Direction du tri date (persistée en mémoire de session)
window._dateSortDir = window._dateSortDir || 'asc';

function validerRecurrentIdentique(moisName, idx, wi, montant) {
  updateRecurrentReal(moisName, 'depenses', idx, montant, wi >= 0 ? wi : undefined);
}

function exportPDF(moisName) {
  const moisIdx = MOIS.indexOf(moisName);
  const revTotal = getRevTotal(moisIdx);
  const depTotal = getTotalDep(moisIdx);
  const solde = revTotal - depTotal;
  const amexTotal = getAmex(moisIdx);

  // Inject print header
  let hdr = document.getElementById('printHeader');
  if (!hdr) {
    hdr = document.createElement('div');
    hdr.id = 'printHeader';
    hdr.className = 'print-header';
    document.querySelector('.main').prepend(hdr);
  }
  hdr.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div>
        <div style="font-size:22px;font-weight:700;color:#111">Bilan budgétaire — ${moisName} 2026</div>
        <div style="font-size:12px;color:#666;margin-top:4px">Généré le ${new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'})}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:11px;color:#666">Revenus : <strong style="color:#15803d">${fmt(revTotal)}</strong></div>
        <div style="font-size:11px;color:#666">Dépenses : <strong style="color:#b91c1c">${fmt(depTotal)}</strong></div>
        <div style="font-size:11px;color:#666">Solde : <strong style="${solde>=0?'color:#15803d':'color:#b91c1c'}">${fmt(solde)}</strong></div>
        ${amexTotal>0?`<div style="font-size:10px;color:#b45309;margin-top:2px">Amex différé : ${fmt(amexTotal)}</div>`:''}
      </div>
    </div>`;
  window.print();
}

function toggleDateSort() {
  window._dateSortDir = window._dateSortDir === 'asc' ? 'desc' : 'asc';
  // Mettre à jour la flèche
  const arrow = document.getElementById('date-sort-arrow');
  if (arrow) arrow.textContent = window._dateSortDir === 'asc' ? '↑' : '↓';
  // Retrier le tbody
  const tbody = document.getElementById('tx-tbody');
  if (!tbody) return;
  const rows = Array.from(tbody.querySelectorAll('tr'));
  rows.sort((a,b) => {
    const da = parseInt(a.querySelector('td:nth-child(1)')?.textContent||'99')||99;
    const db = parseInt(b.querySelector('td:nth-child(1)')?.textContent||'99')||99;
    return window._dateSortDir === 'desc' ? db - da : da - db;
  });
  rows.forEach(tr => tbody.appendChild(tr));
}

function filterTx() {
  const search  = (document.getElementById('tx-search')?.value||'').toLowerCase();
  const compte  = document.getElementById('tx-filter-compte')?.value||'';
  const groupe  = document.getElementById('tx-filter-groupe')?.value||'';
  const sort    = document.getElementById('tx-sort')?.value||'date';
  const tbody   = document.getElementById('tx-tbody');
  const counter = document.getElementById('tx-count');
  if (!tbody) return;
  const rows = Array.from(tbody.querySelectorAll('tr'));
  let visible = 0;
  rows.forEach(tr => {
    const cells = tr.querySelectorAll('td');
    if (!cells.length) return;
    const libelle = (cells[1]?.textContent||'').toLowerCase();
    const compteCell = (cells[2]?.textContent||'');
    const groupeCell = tr.getAttribute('data-groupe')||'';
    const matchSearch  = !search  || libelle.includes(search);
    const matchCompte  = !compte  || compteCell.includes(compte);
    const matchGroupe  = !groupe  || groupeCell === groupe;
    const show = matchSearch && matchCompte && matchGroupe;
    tr.style.display = show ? '' : 'none';
    if (show) visible++;
  });
  if (counter) counter.textContent = visible + ' opération' + (visible!==1?'s':'');
  // Sort visible rows — date direction pilotée par toggleDateSort
  const visibleRows = rows.filter(tr=>tr.style.display!=='none');
  visibleRows.sort((a,b) => {
    const aReel = parseFloat(a.querySelector('td:nth-child(7)')?.textContent?.replace(/[^\d.,-]/g,'').replace(',','.')||0);
    const bReel = parseFloat(b.querySelector('td:nth-child(7)')?.textContent?.replace(/[^\d.,-]/g,'').replace(',','.')||0);
    const aLib  = (a.querySelector('td:nth-child(2)')?.textContent||'').toLowerCase();
    const bLib  = (b.querySelector('td:nth-child(2)')?.textContent||'').toLowerCase();
    const aDate = parseInt(a.querySelector('td:nth-child(1)')?.textContent||'0')||0;
    const bDate = parseInt(b.querySelector('td:nth-child(1)')?.textContent||'0')||0;
    if (sort==='montant-desc') return bReel-aReel;
    if (sort==='montant-asc')  return aReel-bReel;
    if (sort==='libelle')      return aLib.localeCompare(bLib,'fr');
    // Tri date par défaut : respecte _dateSortDir
    return window._dateSortDir === 'desc' ? bDate-aDate : aDate-bDate;
  });
  visibleRows.forEach(tr => tbody.appendChild(tr));
  // Sync flèche après filterTx
  const arrow = document.getElementById('date-sort-arrow');
  if (arrow) arrow.textContent = window._dateSortDir === 'asc' ? '↑' : '↓';
}

function addTx(moisName) {
  const rawDate = document.getElementById('f-date').value;
  const date = rawDate ? new Date(rawDate).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}) : '';
  const libelle = document.getElementById('f-libelle').value;
  const compte = document.getElementById('f-compte').value;
  const groupe = document.getElementById('f-groupe').value;
  const categorie = document.getElementById('f-categorie').value;
  const reel = parseAmount(document.getElementById('f-reel').value);
  const prevu = reel; // dépenses variables : prévu = réel (saisi sur le moment)
  if (!libelle) return;
  if (!data.transactions[moisName]) data.transactions[moisName] = [];
  if (editingTx && editingTx.moisName === moisName && editingTx.type === 'dep') {
    const realIdx = data.transactions[moisName].indexOf(editingTx.originalRow);
    if (realIdx !== -1) {
      data.transactions[moisName][realIdx] = {date,libelle,compte,groupe,categorie,prevu,reel,_rawDate:rawDate};
    } else {
      data.transactions[moisName].push({date,libelle,compte,groupe,categorie,prevu,reel,_rawDate:rawDate});
    }
    editingTx = null;
  } else {
    if (editingTx && editingTx.originalRow) { delete editingTx.originalRow._editing; editingTx = null; }
    data.transactions[moisName].push({date,libelle,compte,groupe,categorie,prevu,reel,_rawDate:rawDate});
  }
  save(); showPage(moisName);
  // Réinitialiser le formulaire et focus sur la date
  setTimeout(() => {
    ['f-date','f-libelle','f-reel'].forEach(id => { const el = document.getElementById(id); if(el) el.value=''; });
    document.getElementById('f-date')?.focus();
  }, 80);
}

function delTx(moisName, idx) {
  const t = data.transactions[moisName][idx];
  toastConfirm(`Supprimer "${t?.libelle || 'cette transaction'}" ?`, () => {
    data.transactions[moisName].splice(idx, 1);
    save(); showPage(moisName);
  });
}

// Track which row is being edited
let editingTx = null;   // {moisName, type:'dep'|'rev', allIdx}

function editTx(moisName, manualIdx) {
  const manuals = data.transactions[moisName].filter(x=>!x._isRecurrent && x.compte !== 'Amex (différé)');
  const t = manuals[manualIdx];
  if (!t) return;
  const allIdx = data.transactions[moisName].indexOf(t);
  if (editingTx && editingTx.originalRow) { delete editingTx.originalRow._editing; }
  editingTx = {moisName, type:'dep', allIdx, snapshot: {...t}, originalRow: data.transactions[moisName][allIdx]};
  data.transactions[moisName][allIdx]._editing = true;

  renderMain(); // re-render first

  // THEN pre-fill form after render
  setTimeout(() => {
    const snap = editingTx?.snapshot;
    if (!snap) return;
    if (document.getElementById('f-date')) document.getElementById('f-date').value = snap._rawDate || '';
    if (document.getElementById('f-libelle')) document.getElementById('f-libelle').value = snap.libelle || '';
    if (document.getElementById('f-compte')) document.getElementById('f-compte').value = snap.compte || '';
    if (document.getElementById('f-prevu')) document.getElementById('f-prevu').value = snap.prevu || '';
    if (document.getElementById('f-reel')) document.getElementById('f-reel').value = snap.reel || '';
    const grpEl = document.getElementById('f-groupe');
    if (grpEl) { grpEl.value = snap.groupe || ''; updateCats(); }
    setTimeout(() => {
      if (document.getElementById('f-categorie')) document.getElementById('f-categorie').value = snap.categorie || '';
      // no f-prevu field for variable expenses
      if (document.getElementById('f-reel')) document.getElementById('f-reel').value = snap.reel || '';
    }, 60);
    document.getElementById('f-libelle')?.scrollIntoView({behavior:'smooth', block:'center'});
  }, 80);
}

function editRevTx(moisName, manualIdx) {
  const manuals = (data.revenus_tx[moisName]||[]).filter(x=>!x._isRecurrent);
  const t = manuals[manualIdx];
  if (!t) return;
  const allIdx = data.revenus_tx[moisName].indexOf(t);
  editingTx = {moisName, type:'rev', allIdx, snapshot: {...t}, originalRow: data.revenus_tx[moisName][allIdx]};
  data.revenus_tx[moisName][allIdx]._editing = true;

  renderMain(); // re-render first (clears form)

  // THEN pre-fill form after render
  setTimeout(() => {
    const snap = editingTx?.snapshot;
    if (!snap) return;
    if (document.getElementById('rv-date')) document.getElementById('rv-date').value = snap._rawDate || '';
    if (document.getElementById('rv-libelle')) document.getElementById('rv-libelle').value = snap.libelle || '';
    if (document.getElementById('rv-compte')) document.getElementById('rv-compte').value = snap.compte || '';
    const grpEl = document.getElementById('rv-groupe');
    if (grpEl) { grpEl.value = snap.groupe || ''; updateRevCats(); }
    setTimeout(() => {
      if (document.getElementById('rv-categorie')) document.getElementById('rv-categorie').value = snap.categorie || '';
      if (document.getElementById('rv-prevu')) document.getElementById('rv-prevu').value = snap.prevu || '';
      if (document.getElementById('rv-montant')) document.getElementById('rv-montant').value = snap.montant || '';
    }, 60);
    document.getElementById('rv-libelle')?.scrollIntoView({behavior:'smooth', block:'center'});
  }, 80);
}

          }
        }

    // ── Stacked bar: dépenses par groupe sur l'année ───────────────────────

        }),
        backgroundColor: CHART_COLORS[i % CHART_COLORS.length] + 'cc',

        stack: 'dep',
      })).filter(ds => ds.data.some(v=>v>0));

      chartInstances['bar-annual-grp'] = new Chart(barAnnGrp, {

          plugins: {

                label: ctx => ` ${ctx.dataset.label} : ${(ctx.raw||0).toLocaleString('fr-FR',{maximumFractionDigits:2})} €`

          }

  }, 150);

  return `

      <div class="chart-title">Évolution revenus · dépenses · solde sur l'année</div>
      <div class="chart-wrap"><canvas id="chart-line-annual" height="160"></canvas></div>
